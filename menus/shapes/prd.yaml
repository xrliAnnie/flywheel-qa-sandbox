shape: prd
founderReview: true
nodes:
  - id: produce
    role: pm
    defaultModel: opus
    models:
      - model: opus
        allowedEfforts: [low, medium, high, max]
        defaultEffort: high
  - id: founder_gate
    type: gate
edges:
  - id: produce_done
    from: produce
    to: founder_gate
    condition: node_done
loops: []
