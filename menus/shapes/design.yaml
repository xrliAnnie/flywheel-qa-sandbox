shape: design
nodes:
  - id: produce
    role: designer
    defaultModel: opus
    models:
      - model: opus
        allowedEfforts: [low, medium, high, xhigh, max]
        defaultEffort: xhigh
  - id: founder_gate
    type: gate
edges:
  - id: produce_done
    from: produce
    to: founder_gate
    condition: node_done
loops: []
