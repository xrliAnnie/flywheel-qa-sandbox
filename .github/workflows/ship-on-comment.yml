name: "Ship on :cool: Comment"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: ship-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ship:
    name: "🚀 CI + Merge"
    runs-on: ubuntu-latest
    # FLY-1861: the job waits up to 25m for the required exact-head CI verdict.
    # The 30m job cap leaves bounded reporting/merge headroom without re-running
    # the package suite that branch protection already requires.
    timeout-minutes: 30
    if: |
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.body == ':cool:'

    steps:
    - name: "📝 Get PR information"
      id: pr-info
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          core.setOutput('head_ref', pr.head.ref);
          core.setOutput('head_sha', pr.head.sha);
          core.setOutput('pr_title', pr.title);
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `<!-- flywheel-ship-receipt trigger_comment_id=${context.payload.comment.id} run_id=${context.runId} run_url=${runUrl} head=${pr.head.sha} status=started -->`
          });

          let permission = 'none';
          try {
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login
            });
            permission = perm.permission;
          } catch (e) {
            // 404 for non-collaborators — treat as no permission
          }
          if (!['admin', 'write'].includes(permission)) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ @${context.payload.comment.user.login} does not have write access — ship rejected.`
            });
            core.setFailed('Commenter lacks write permission');
            return;
          }
          if (pr.merged || pr.state !== 'open') {
            core.setFailed(`PR is already ${pr.merged ? 'merged' : pr.state} — skipping`);
            return;
          }

          const headRepoFullName = pr.head.repo?.full_name;
          const baseRepoFullName = `${context.repo.owner}/${context.repo.repo}`;
          if (headRepoFullName && headRepoFullName !== baseRepoFullName) {
            core.setFailed('Fork PRs are not supported by ship workflow');
            return;
          }

          if (pr.draft) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ Cannot ship a draft PR. Mark it as ready for review first.'
            });
            core.setFailed('PR is still in draft');
            return;
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `🚀 Ship triggered for \`${pr.head.ref}\` at \`${pr.head.sha.slice(0, 7)}\` — running CI checks...`
          });

    # issue_comment workflows are loaded from the protected default branch.
    # Checkout that same trusted source for the await helper; never execute the
    # PR head in this write-capable job.
    - id: checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: "⏳ Await exact-head CI verdict"
      id: await-ci
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
        AWAIT_BUDGET_SECONDS: 1500
        POLL_SECONDS: 30
      run: bash scripts/ship-await-ci.sh

    - name: "✅ Merge PR"
      id: merge-pr
      if: success()
      uses: actions/github-script@v7
      env:
        PR_TITLE: ${{ steps.pr-info.outputs.pr_title }}
        PR_NUMBER: ${{ github.event.issue.number }}
        HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
        HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
      with:
        # SHIP_PAT (classic PAT, repo + workflow scope) — the default Actions
        # token is hard-blocked from merging any PR that touches
        # .github/workflows/* (403 "refusing to allow a GitHub App to update
        # workflow without workflows permission"), which stranded every
        # workflow-touching :cool: ship. An unset secret evaluates to '', so
        # without SHIP_PAT this falls back to today's token unchanged.
        github-token: ${{ secrets.SHIP_PAT || secrets.GITHUB_TOKEN }}
        script: |
          const prNumber = parseInt(process.env.PR_NUMBER, 10);
          try {
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash',
              commit_title: `${process.env.PR_TITLE} (#${prNumber})`,
              commit_message: 'Shipped via :cool: comment',
              sha: process.env.HEAD_SHA
            });
          } catch (error) {
            core.setOutput('merge_error', JSON.stringify({
              status: Number.isInteger(error?.status) ? error.status : null,
              message: error instanceof Error ? error.message : String(error)
            }));
            throw error;
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: `✅ CI green — PR merged to main! (${process.env.HEAD_SHA.slice(0, 7)})\n<!-- flywheel-ship-receipt trigger_comment_id=${context.payload.comment.id} run_id=${context.runId} run_url=https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} head=${process.env.HEAD_SHA} status=success -->`
          });
          try {
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${process.env.HEAD_REF}`
            });
          } catch (e) { /* best-effort branch cleanup */ }

    - name: "❌ Report failure"
      if: failure()
      uses: actions/github-script@v7
      env:
        PR_INFO_OUTCOME: ${{ steps.pr-info.outcome }}
        CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        AWAIT_CI_OUTCOME: ${{ steps.await-ci.outcome }}
        AWAIT_CI_RESULT: ${{ steps.await-ci.outputs.outcome }}
        MERGE_OUTCOME: ${{ steps.merge-pr.outcome }}
        MERGE_ERROR: ${{ steps.merge-pr.outputs.merge_error }}
        HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          let failedStep = 'preflight';
          if (process.env.AWAIT_CI_OUTCOME === 'failure') {
            const knownAwaitOutcomes = new Set([
              'await_ci_timeout', 'ci_failure', 'head_moved', 'pr_not_open', 'preflight'
            ]);
            failedStep = knownAwaitOutcomes.has(process.env.AWAIT_CI_RESULT)
              ? process.env.AWAIT_CI_RESULT
              : 'preflight';
          } else if (process.env.MERGE_OUTCOME === 'failure') {
            let status = null;
            let message = '';
            try {
              const parsed = JSON.parse(process.env.MERGE_ERROR || '{}');
              status = Number.isInteger(parsed.status) ? parsed.status : null;
              message = typeof parsed.message === 'string' ? parsed.message : '';
            } catch { /* malformed output remains merge_other */ }
            if (status === 405 && /Required status check .+ is expected\./is.test(message)) {
              failedStep = 'merge_405_required_check';
            } else if (status === 405) {
              failedStep = 'merge_405_other';
            } else if (status === 409) {
              failedStep = 'merge_409_head';
            } else if (status === 403) {
              failedStep = 'merge_403';
            } else if (status === 422) {
              failedStep = 'merge_422';
            } else {
              failedStep = 'merge_other';
            }
          }

          let headSha = process.env.HEAD_SHA || '';
          if (!headSha) {
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              headSha = pr.head.sha;
            } catch { headSha = 'unknown'; }
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `❌ Ship failed — PR was NOT merged. Check the [workflow run](${runUrl}) for details. Fix the issue and post :cool: again.\n<!-- flywheel-ship-receipt trigger_comment_id=${context.payload.comment.id} run_id=${context.runId} run_url=${runUrl} head=${headSha} status=failure failed_step=${failedStep} -->`
          });
