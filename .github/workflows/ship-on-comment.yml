name: "Ship on :cool: Comment"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  actions: write

jobs:
  prepare:
    name: "🧪 Exact-head preparation"
    runs-on: ubuntu-latest
    concurrency:
      group: ship-prepare-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      head_ref: ${{ steps.pr-info.outputs.head_ref }}
      head_sha: ${{ steps.pr-info.outputs.head_sha }}
      pr_title: ${{ steps.pr-info.outputs.pr_title }}
      ticket_id: ${{ steps.pr-info.outputs.ticket_id }}
      ticket_nonce: ${{ steps.pr-info.outputs.ticket_nonce }}
      pr_info_outcome: ${{ steps.pr-info.outcome }}
      checkout_outcome: ${{ steps.checkout.outcome }}
      await_ci_outcome: ${{ steps.await-ci.outcome }}
      await_ci_result: ${{ steps.await-ci.outputs.outcome }}
    # FLY-1861: the job waits up to 25m for the required exact-head CI verdict.
    # The 30m job cap leaves bounded reporting/merge headroom without re-running
    # the package suite that branch protection already requires.
    timeout-minutes: 30
    if: |
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, ':cool:')

    steps:
    - name: "📝 Get PR information"
      id: pr-info
      uses: actions/github-script@v7
      env:
        LAND_TICKET_PUBLIC_KEY_B64: ${{ secrets.FLYWHEEL_LAND_TICKET_PUBLIC_KEY_B64 }}
        BRIDGE_GITHUB_LOGIN: ${{ vars.FLYWHEEL_BRIDGE_GITHUB_LOGIN }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          const body = context.payload.comment.body;
          const structured = body.match(/^:cool:\r?\n<!-- flywheel-land-ticket-v1 ([A-Za-z0-9_-]+) -->$/);
          let ticket = null;
          if (structured) {
            if (!process.env.BRIDGE_GITHUB_LOGIN ||
                context.payload.comment.user.login !== process.env.BRIDGE_GITHUB_LOGIN) {
              core.setFailed('Structured land ticket commenter is not the configured Bridge identity');
              return;
            }
            if (!process.env.LAND_TICKET_PUBLIC_KEY_B64) {
              core.setFailed('Structured land ticket public key is unavailable');
              return;
            }
            try {
              ticket = JSON.parse(Buffer.from(structured[1], 'base64url').toString('utf8'));
            } catch {
              core.setFailed('Structured land ticket is malformed');
              return;
            }
            const signature = ticket.signature;
            delete ticket.signature;
            const canonical = value => {
              if (value === null || typeof value !== 'object') return JSON.stringify(value);
              if (Array.isArray(value)) return `[${value.map(canonical).join(',')}]`;
              return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonical(value[key])}`).join(',')}}`;
            };
            const crypto = require('crypto');
            let verified = false;
            try {
              verified = crypto.verify(
                null,
                Buffer.from(canonical(ticket), 'utf8'),
                crypto.createPublicKey(Buffer.from(process.env.LAND_TICKET_PUBLIC_KEY_B64, 'base64').toString('utf8')),
                Buffer.from(signature || '', 'base64url')
              );
            } catch { /* invalid key/signature stays false */ }
            const now = Date.now();
            if (!verified || ticket.version !== 1 || ticket.repoIdentity !== '__main__' ||
                ticket.prNumber !== context.issue.number || ticket.headSha !== pr.head.sha ||
                !/^land-merge-ticket:[0-9a-f]{64}$/.test(ticket.ticketId || '') ||
                !/^[0-9a-f]{64}$/.test(ticket.nonce || '') ||
                !Number.isInteger(ticket.operationGeneration) || ticket.operationGeneration < 0 ||
                !Number.isFinite(Date.parse(ticket.issuedAt)) ||
                !Number.isFinite(Date.parse(ticket.expiresAt)) ||
                Date.parse(ticket.issuedAt) > now + 300000 || now > Date.parse(ticket.expiresAt)) {
              core.setFailed('Structured land ticket verification failed');
              return;
            }
            const priorComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const replayMarker = `ticket_id=${ticket.ticketId} nonce=${ticket.nonce}`;
            const replayed = priorComments.some(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes('flywheel-ship-receipt') &&
              comment.body.includes(replayMarker)
            );
            if (replayed) {
              core.setFailed('Structured land ticket was already started');
              return;
            }
          } else if (body !== ':cool:') {
            core.setFailed('Ship comment is neither legacy :cool: nor a valid structured ticket');
            return;
          }
          const expectedHead = ticket?.headSha || pr.head.sha;
          core.setOutput('head_ref', pr.head.ref);
          core.setOutput('head_sha', expectedHead);
          core.setOutput('pr_title', pr.title);
          core.setOutput('ticket_id', ticket?.ticketId || 'legacy');
          core.setOutput('ticket_nonce', ticket?.nonce || 'legacy');
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `<!-- flywheel-ship-receipt trigger_comment_id=${context.payload.comment.id} ticket_id=${ticket?.ticketId || 'legacy'} nonce=${ticket?.nonce || 'legacy'} run_id=${context.runId} run_url=${runUrl} head=${expectedHead} status=started -->`
          });

          let permission = 'none';
          try {
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login
            });
            permission = perm.permission;
          } catch (e) {
            // 404 for non-collaborators — treat as no permission
          }
          if (!['admin', 'write'].includes(permission)) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ @${context.payload.comment.user.login} does not have write access — ship rejected.`
            });
            core.setFailed('Commenter lacks write permission');
            return;
          }
          if (pr.merged || pr.state !== 'open') {
            core.setFailed(`PR is already ${pr.merged ? 'merged' : pr.state} — skipping`);
            return;
          }

          const headRepoFullName = pr.head.repo?.full_name;
          const baseRepoFullName = `${context.repo.owner}/${context.repo.repo}`;
          if (headRepoFullName && headRepoFullName !== baseRepoFullName) {
            core.setFailed('Fork PRs are not supported by ship workflow');
            return;
          }

          if (pr.draft) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ Cannot ship a draft PR. Mark it as ready for review first.'
            });
            core.setFailed('PR is still in draft');
            return;
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `🚀 Ship triggered for \`${pr.head.ref}\` at \`${pr.head.sha.slice(0, 7)}\` — running CI checks...`
          });

    # issue_comment workflows are loaded from the protected default branch.
    # Checkout that same trusted source for the await helper; never execute the
    # PR head in this write-capable job.
    - id: checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: "⏳ Await exact-head CI verdict"
      id: await-ci
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
        AWAIT_BUDGET_SECONDS: 1500
        POLL_SECONDS: 30
      run: bash scripts/ship-await-ci.sh

  merge:
    name: "✅ Serialized exact-head merge"
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ship-merge-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      merge_error: ${{ steps.merge-pr.outputs.merge_error }}
    steps:
    - name: "✅ Merge PR"
      id: merge-pr
      uses: actions/github-script@v7
      env:
        PR_TITLE: ${{ needs.prepare.outputs.pr_title }}
        PR_NUMBER: ${{ github.event.issue.number }}
        HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
        HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        TICKET_ID: ${{ needs.prepare.outputs.ticket_id }}
        TICKET_NONCE: ${{ needs.prepare.outputs.ticket_nonce }}
      with:
        github-token: ${{ secrets.SHIP_PAT || secrets.GITHUB_TOKEN }}
        script: |
          const prNumber = parseInt(process.env.PR_NUMBER, 10);
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber
          });
          if (pr.state !== 'open' || pr.merged || pr.head.sha !== process.env.HEAD_SHA) {
            core.setOutput('merge_error', JSON.stringify({
              status: 409,
              message: `exact head changed before serialized merge: expected ${process.env.HEAD_SHA}, observed ${pr.head.sha}`
            }));
            core.setFailed('Exact-head merge precondition failed');
            return;
          }
          try {
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash',
              commit_title: `${process.env.PR_TITLE} (#${prNumber})`,
              commit_message: 'Shipped via :cool: comment',
              sha: process.env.HEAD_SHA
            });
          } catch (error) {
            core.setOutput('merge_error', JSON.stringify({
              status: Number.isInteger(error?.status) ? error.status : null,
              message: error instanceof Error ? error.message : String(error)
            }));
            throw error;
          }
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: `✅ CI green — PR merged to main! (${process.env.HEAD_SHA.slice(0, 7)})\n<!-- flywheel-ship-receipt trigger_comment_id=${context.payload.comment.id} ticket_id=${process.env.TICKET_ID} nonce=${process.env.TICKET_NONCE} run_id=${context.runId} run_url=${runUrl} head=${process.env.HEAD_SHA} status=success -->`
          });
          try {
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${process.env.HEAD_REF}`
            });
          } catch (e) { /* best-effort branch cleanup */ }

  report-failure:
    name: "❌ Report ship failure"
    needs: [prepare, merge]
    if: always() && (needs.prepare.result == 'failure' || needs.merge.result == 'failure' || needs.prepare.result == 'cancelled' || needs.merge.result == 'cancelled')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v7
      env:
        PREPARE_RESULT: ${{ needs.prepare.result }}
        PR_INFO_OUTCOME: ${{ needs.prepare.outputs.pr_info_outcome }}
        CHECKOUT_OUTCOME: ${{ needs.prepare.outputs.checkout_outcome }}
        AWAIT_CI_OUTCOME: ${{ needs.prepare.outputs.await_ci_outcome }}
        AWAIT_CI_RESULT: ${{ needs.prepare.outputs.await_ci_result }}
        MERGE_RESULT: ${{ needs.merge.result }}
        MERGE_ERROR: ${{ needs.merge.outputs.merge_error }}
        HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        TICKET_ID: ${{ needs.prepare.outputs.ticket_id }}
        TICKET_NONCE: ${{ needs.prepare.outputs.ticket_nonce }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          let failedStep = 'preflight';
          if (process.env.PREPARE_RESULT === 'cancelled') {
            failedStep = 'prepare_cancelled';
          } else if (process.env.MERGE_RESULT === 'cancelled') {
            failedStep = 'merge_cancelled';
          } else if (process.env.AWAIT_CI_OUTCOME === 'failure') {
            const knownAwaitOutcomes = new Set([
              'await_ci_timeout', 'ci_failure', 'head_moved', 'pr_not_open', 'preflight'
            ]);
            failedStep = knownAwaitOutcomes.has(process.env.AWAIT_CI_RESULT)
              ? process.env.AWAIT_CI_RESULT
              : 'preflight';
          } else if (process.env.PREPARE_RESULT !== 'failure') {
            failedStep = 'merge_other';
            let status = null;
            let message = '';
            try {
              const parsed = JSON.parse(process.env.MERGE_ERROR || '{}');
              status = Number.isInteger(parsed.status) ? parsed.status : null;
              message = typeof parsed.message === 'string' ? parsed.message : '';
            } catch { /* malformed output remains merge_other */ }
            if (status === 405 && /Required status check .+ is expected\./is.test(message)) {
              failedStep = 'merge_405_required_check';
            } else if (status === 405) failedStep = 'merge_405_other';
            else if (status === 409) failedStep = 'merge_409_head';
            else if (status === 403) failedStep = 'merge_403';
            else if (status === 422) failedStep = 'merge_422';
          }
          let headSha = process.env.HEAD_SHA || '';
          if (!headSha) {
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              headSha = pr.head.sha;
            } catch { headSha = 'unknown'; }
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `❌ Ship failed — PR was NOT merged. Check the [workflow run](${runUrl}) for details.\n<!-- flywheel-ship-receipt trigger_comment_id=${context.payload.comment.id} ticket_id=${process.env.TICKET_ID || 'unknown'} nonce=${process.env.TICKET_NONCE || 'unknown'} run_id=${context.runId} run_url=${runUrl} head=${headSha} status=failure failed_step=${failedStep} -->`
          });
