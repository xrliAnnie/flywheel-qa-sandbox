# FLY-1062 PR4 · promote prepare (stage a customer-release candidate) —
# MANUAL, main-only. This workflow does the NO-GATE prepare half only:
# rebuild the clean version at the beta's manifest-derived sourceCommit,
# prove byte-equivalence against the distributed beta, and stage the durable
# candidate. It touches ONLY the internal capability (beta-publish) and NEVER
# the customer channel.
#
# The COMMIT/ABANDON/WITHDRAW half lives in the sibling
# payload-promote-commit.yml after the authorization window. This prepare-only
# workflow carries ZERO customer-release credential; the structure tests assert
# both that boundary and the exact release-environment allowlist.
name: Payload Promote (prepare)
run-name: "customer-release:${{ inputs.dispatch-id || github.run_id }}:${{ inputs.mode }}:${{ inputs.release-id }}"

on:
  workflow_dispatch:
    inputs:
      dispatch-id:
        description: Bridge durable dispatch identity for recovery; empty for manual dispatch
        required: false
        type: string
      mode:
        description: "prepare = build candidate; rebind = same abandoned artifact under a new releaseId"
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - rebind
      source-release-id:
        description: "rebind only: abandoned source operation"
        required: false
        type: string
      source-binding-digest:
        description: "rebind only: exact source B0 binding SHA256"
        required: false
        type: string
      release-id:
        description: "releaseId of this promote operation (retries reuse it)"
        required: true
        type: string
      beta:
        description: "the UNIQUE beta semver being promoted (sourceCommit is DERIVED from the manifest — never operator-supplied)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: payload-release
  queue: max

jobs:
  prepare:
    name: Prepare candidate (no gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SECURITY ORDER (Codex R1/R2): sourceCommit is DERIVED from the manifest
      # (plan PR4-3: prepare inputs are releaseId + beta ONLY — an operator can
      # never supply a commit). ① refuse non-main dispatch (the workflow
      # definition itself comes from the dispatch ref) → ② checkout main →
      # ③ derive the beta's sourceCommit from the manifest (trusted lineage —
      # betas are built by the beta workflow) → ④ switch the tree to THAT
      # commit → build.
      - name: Dispatch-ref guard (main only)
        env:
          GH_REF: ${{ github.ref }}
          DISPATCH_ID: ${{ inputs.dispatch-id }}
          MODE_INPUT: ${{ inputs.mode || 'prepare' }}
          RELEASE_ID_INPUT: ${{ inputs.release-id }}
          BETA_INPUT: ${{ inputs.beta }}
          SOURCE_RELEASE_ID_INPUT: ${{ inputs.source-release-id }}
          SOURCE_BINDING_DIGEST_INPUT: ${{ inputs.source-binding-digest }}
        run: |
          if [ -n "${DISPATCH_ID:-}" ] && [[ ! "$DISPATCH_ID" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::invalid dispatch identity'; exit 1
          fi
          if [ "$GH_REF" != "refs/heads/main" ]; then
            echo "::error::promote may only be dispatched from main (got $GH_REF)"
            exit 1
          fi

          if [[ ! "$RELEASE_ID_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$ ]]; then
            echo "::error::invalid release-id"; exit 1
          fi
          if [ "$MODE_INPUT" = "rebind" ]; then
            if [[ ! "$SOURCE_RELEASE_ID_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$ ]] || \
               [[ ! "$SOURCE_BINDING_DIGEST_INPUT" =~ ^[a-f0-9]{64}$ ]] || \
               [ "$SOURCE_RELEASE_ID_INPUT" = "$RELEASE_ID_INPUT" ] || [ -n "$BETA_INPUT" ]; then
              echo "::error::rebind requires a different source operation and exact binding digest, with no beta input"; exit 1
            fi
          elif [ "$MODE_INPUT" = "prepare" ]; then
            if [ -z "$BETA_INPUT" ] || [ -n "$SOURCE_RELEASE_ID_INPUT$SOURCE_BINDING_DIGEST_INPUT" ]; then
              echo "::error::prepare requires beta and no rebind inputs"; exit 1
            fi
          else
            echo "::error::invalid mode"; exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Derive the beta's sourceCommit from the manifest (never operator-supplied)
        if: inputs.mode != 'rebind'
        id: derive
        env:
          FW_ENDPOINT: ${{ vars.FW_ENDPOINT }}
          FW_BETA_PUBLISH_TOKEN: ${{ secrets.FW_BETA_PUBLISH_TOKEN }}
          BETA_INPUT: ${{ inputs.beta }}
        run: |
          node --input-type=module - <<'DERIVE'
          import fs from "node:fs";
          const beta = process.env.BETA_INPUT || "";
          const endpoint = (process.env.FW_ENDPOINT || "").replace(/\/+$/, "");
          const res = await fetch(`${endpoint}/admin/manifest`, {
            headers: { authorization: `Bearer ${process.env.FW_BETA_PUBLISH_TOKEN}` },
          });
          if (res.status !== 200) {
            console.error(`cannot read manifest (HTTP ${res.status})`);
            process.exit(1);
          }
          const m = await res.json();
          const entry = m.versions?.[beta];
          if (!entry || entry.channel !== "beta") {
            console.error(`no beta ${beta} in the manifest`);
            process.exit(1);
          }
          if (!/^[0-9a-f]{40}$/.test(entry.sourceCommit || "")) {
            console.error("manifest sourceCommit is not a 40-hex sha — refusing");
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${entry.sourceCommit}\n`);
          console.log(`derived: ${beta} was built from ${entry.sourceCommit}`);
          DERIVE

      - name: Check out the DERIVED commit
        if: inputs.mode != 'rebind'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.derive.outputs.commit }}
          persist-credentials: false
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        if: inputs.mode != 'rebind'

      - uses: actions/setup-node@v4
        if: inputs.mode != 'rebind'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: inputs.mode != 'rebind'
        run: pnpm install --frozen-lockfile

      - name: Install better-sqlite3 prebuilt binary
        if: inputs.mode != 'rebind'
        run: cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3 && npx --yes prebuild-install || npm run build-release

      - name: Build workspace dist
        if: inputs.mode != 'rebind'
        run: pnpm build

      # dispatch inputs never interpolate into shell text — env + quoting only
      - name: Prepare (clean build + equivalence proof + staged candidate)
        if: inputs.mode != 'rebind'
        env:
          FW_ENDPOINT: ${{ vars.FW_ENDPOINT }}
          FW_BETA_PUBLISH_TOKEN: ${{ secrets.FW_BETA_PUBLISH_TOKEN }}
          RELEASE_ID_INPUT: ${{ inputs.release-id }}
          BETA_INPUT: ${{ inputs.beta }}
        run: |
          node scripts/release/payload-promote.mjs prepare \
            --release-id "$RELEASE_ID_INPUT" \
            --beta "$BETA_INPUT"

      # This executes the reviewed main helper without any build or checkout of
      # a historical beta tree. It stages only; a new founder go is still required.
      - name: Rebind abandoned prepared artifact (same bytes, new operation)
        if: inputs.mode == 'rebind'
        env:
          FW_ENDPOINT: ${{ vars.FW_ENDPOINT }}
          FW_BETA_PUBLISH_TOKEN: ${{ secrets.FW_BETA_PUBLISH_TOKEN }}
          RELEASE_ID_INPUT: ${{ inputs.release-id }}
          SOURCE_RELEASE_ID_INPUT: ${{ inputs.source-release-id }}
          SOURCE_BINDING_DIGEST_INPUT: ${{ inputs.source-binding-digest }}
        run: |
          node scripts/release/payload-promote.mjs rebind-prepared-artifact \
            --release-id "$RELEASE_ID_INPUT" \
            --source-release-id "$SOURCE_RELEASE_ID_INPUT" \
            --source-binding-digest "$SOURCE_BINDING_DIGEST_INPUT"
