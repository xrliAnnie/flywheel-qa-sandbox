name: Ubicloud Canary
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner provider for this isolated trial
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubicloud-standard-2
      capacity:
        description: Capacity-only job count; 0 runs the payload trial
        required: true
        type: choice
        default: "0"
        options:
          - "0"
          - "1"
          - "8"
          - "33"
          - "54"
permissions:
  contents: read
concurrency:
  group: ubicloud-canary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Ubicloud Canary / Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANARY_RUNNER: ${{ inputs.runner }}
      CANARY_CAPACITY: ${{ inputs.capacity }}
      CANARY_AUTHORIZED: ${{ vars.UBICLOUD_CANARY_AUTHORIZED }}
      DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
    outputs:
      slots: ${{ steps.matrix.outputs.slots }}
    steps:
      - name: Validate bounded manual trial
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "xrliAnnie/flywheel"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "$DEFAULT_BRANCH_REF"
          case "$CANARY_RUNNER" in
            ubuntu-latest|ubicloud-standard-2) ;;
            *) printf '%s\n' 'unsupported canary runner' >&2; exit 1 ;;
          esac
          case "$CANARY_CAPACITY" in
            0|1|8|33|54) ;;
            *) printf '%s\n' 'unsupported capacity' >&2; exit 1 ;;
          esac
          if [ "$CANARY_RUNNER" = "ubicloud-standard-2" ]; then
            test "$CANARY_AUTHORIZED" = "true"
          fi
      - name: Build validated capacity matrix
        id: matrix
        env:
          CAPACITY: ${{ inputs.capacity }}
        shell: bash
        run: |
          set -euo pipefail
          slots="$(node -e 'const n=Number(process.argv[1]); console.log(JSON.stringify(Array.from({length:n},(_,i)=>i+1)))' "$CAPACITY")"
          printf 'slots=%s\n' "$slots" >> "$GITHUB_OUTPUT"
  quick-gate:
    name: Ubicloud Canary / Quick Gate
    runs-on: ${{ inputs.runner == 'ubicloud-standard-2' && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Canary — Record job start
        shell: bash
        run: date +%s > "$RUNNER_TEMP/fly2684-canary-start"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Canary — Restore non-secret cache probe
        id: cache-probe
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fly2684-cache-probe
          key: fly2684-canary-${{ inputs.runner }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Canary — Prepare non-secret cache probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fly2684-cache-probe"
          printf '%s\n' 'fly2684-cache-probe-v1' > "$RUNNER_TEMP/fly2684-cache-probe/payload"
          test -s "$RUNNER_TEMP/fly2684-cache-probe/payload"
      - name: Canary — Verify dedicated secret delivery
        env:
          CANARY_PROBE: ${{ secrets.UBICLOUD_CANARY_PROBE }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "$CANARY_PROBE"
          printf '%s\n' 'secret_present=true'
      - name: Verify shell suite CI enumeration is complete
        run: bash scripts/__tests__/ci-shell-suite-enumeration.test.sh
      - name: Test — FLY-1338/1861 CI structure guard
        run: bash scripts/__tests__/ci-structure.test.sh
      - name: Enforce FLY-1773 ACK-only delivery semantics
        run: bash scripts/__tests__/fly1773-delivery-semantics.test.sh
      - name: Enforce FLY-2045 milestone layout
        run: bash scripts/__tests__/fly2045-milestone-layout.test.sh
      - name: Enforce FLY-2030 summary inflow gates
        run: |
          bash scripts/__tests__/fly2030-summary-prefix-pair.test.sh
          bash scripts/__tests__/fly2030-summary-registry-activation.test.sh
      - name: Enforce FLY-2445 Raya standard Lead migration contracts
        run: bash scripts/__tests__/raya-standard-migration.test.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Canary — Record public runner facts
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_name=%s\n' "$RUNNER_NAME"
          uname -a
          cat /etc/os-release
          nproc
          free -h
          df -h "$RUNNER_TEMP"
          node --version
          pnpm --version
      - name: Enforce FLY-2074 founder disclosure contract
        run: node scripts/fly2074-founder-disclosure-guard.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate workflow startup syntax and contexts (FLY-2534)
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/fly2534-actionlint"
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          mkdir -p "$install_dir"
          curl --retry 3 --connect-timeout 15 --max-time 120 -fsSLo "$install_dir/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$install_dir/$archive" | sha256sum -c -
          tar -xzf "$install_dir/$archive" -C "$install_dir" actionlint
          export PATH="$install_dir:$PATH"
          node scripts/check-workflow-startup.mjs
          node --test scripts/__tests__/workflow-startup.test.mjs
      - name: Enforce FLY-1781 flag-governance safety contracts
        run: |
          bash scripts/__tests__/flag-governance-cos-contract.test.sh
          bash scripts/__tests__/test-verify-flag-verdicts.test.sh
      - name: Build
        run: pnpm build
      - name: Test — root Node contract suites
        run: |
          node --test scripts/__tests__/beta-schedule-receipt.test.mjs
          node --test scripts/__tests__/beta-workflow-structure.test.mjs
          node --test scripts/__tests__/customer-release-reservation.test.mjs
          node --test scripts/__tests__/payload-promote-commit-shared.test.mjs
          node --test scripts/__tests__/payload-auto-release.test.mjs
          node --test scripts/__tests__/payload-auto-release-workflow.test.mjs
          node --test scripts/__tests__/payload-manual-decision-workflow.test.mjs
          node --test scripts/__tests__/payload-rebind-workflow.test.mjs
          node --test scripts/__tests__/payload-rebind-prepared.test.mjs
          node --test scripts/__tests__/fly-2395-ship-relevance-retro.test.mjs
          node --test scripts/__tests__/fly-2397-strength-two-acceptance.test.mjs
          node --test scripts/__tests__/fly-2398-shadow-table.test.mjs
          node --test scripts/__tests__/import-ship-judgment-retro.test.mjs
          node --test scripts/__tests__/replay-ship-judgment.test.mjs
          node --test scripts/__tests__/replay-ship-judgment-cards.test.mjs
          node --test scripts/__tests__/ship-judgment-timer.test.mjs
          node --test scripts/__tests__/ship-judgment-mutations.test.mjs
          node --test scripts/__tests__/fly-2490-backfill-receipts.test.mjs
          node --test scripts/__tests__/fly1165-sweep-decision.test.mjs
          node --test scripts/__tests__/fly2074-founder-disclosure-guard.test.mjs
          node --test scripts/__tests__/fly-2413-retention-mutations.test.mjs
          node --test scripts/__tests__/qa-codex-lead-parity-drill.test.mjs
          node --test scripts/__tests__/qa-fly-2519-529-drill.test.mjs scripts/__tests__/qa-fly-2519-browser-node.test.mjs scripts/__tests__/qa-fly-2519-browser-process.test.mjs
      - name: Test — FLY-2519 bounded patrol GitHub facts
        run: bash scripts/__tests__/lead-patrol-github-facts.test.sh
      - name: Enforce FLY-2165 torn mailbox identity repair contracts
        run: bash scripts/__tests__/fly-2165-repair-torn-mailbox-identities.test.sh
      - name: Enforce FLY-2103 project config generator retirement
        run: bash scripts/__tests__/fly2103-project-config-generators.test.sh
      - name: Verify workflow seed authority
        run: pnpm verify:workflow-seeds
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Enforce FLY-1645 receipt teardown residue gate
        run: |
          node --test scripts/__tests__/fly1645-receipt-residue-gate.test.mjs
          node scripts/fly1645-receipt-residue-gate.mjs --main-only
      - name: Package gate receipt and retry guards (FLY-2467)
        run: |
          node --test scripts/__tests__/package-gate.test.mjs
          node --test scripts/__tests__/teamlead-shards.test.mjs
          node --test scripts/__tests__/vitest-worker-rpc.test.mjs
      - name: Enforce FLY-2006 retention consumer gate
        run: |
          node --test scripts/__tests__/fly-2006-retention-consumer-gate.test.mjs
          node scripts/fly-2006-retention-consumer-gate.mjs
      - name: Canary — Report elapsed and cache state
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.cache-probe.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          start="$(cat "$RUNNER_TEMP/fly2684-canary-start")"
          now="$(date +%s)"
          printf 'elapsed_seconds=%s\n' "$((now - start))"
          if [ -n "$CACHE_HIT" ]; then cache_hit="$CACHE_HIT"; else cache_hit=false; fi
          printf 'cache_hit=%s\n' "$cache_hit"
    needs:
      - preflight
    if: ${{ needs.preflight.result == 'success' && inputs.capacity == '0' }}
  unit-tests:
    name: Ubicloud Canary / Unit (${{ matrix.name }})
    env:
      VITEST_MAX_FORKS: "1"
      VITEST_MIN_FORKS: "1"
    runs-on: ${{ inputs.runner == 'ubicloud-standard-2' && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    needs:
      - preflight
    if: ${{ needs.preflight.result == 'success' && inputs.capacity == '0' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: teamlead 1 of 4
            cmd: node scripts/teamlead-ci-shard.mjs --shard=1/4
    steps:
      - name: Canary — Record job start
        shell: bash
        run: date +%s > "$RUNNER_TEMP/fly2684-canary-start"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Canary — Restore non-secret cache probe
        id: cache-probe
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fly2684-cache-probe
          key: fly2684-canary-${{ inputs.runner }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Canary — Prepare non-secret cache probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fly2684-cache-probe"
          printf '%s\n' 'fly2684-cache-probe-v1' > "$RUNNER_TEMP/fly2684-cache-probe/payload"
          test -s "$RUNNER_TEMP/fly2684-cache-probe/payload"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Canary — Record public runner facts
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_name=%s\n' "$RUNNER_NAME"
          uname -a
          cat /etc/os-release
          nproc
          free -h
          df -h "$RUNNER_TEMP"
          node --version
          pnpm --version
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@flywheel.dev"
          git config --global user.name "Flywheel CI"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure lsof/tmux (FLY-1905 hardened, normally zero-network)
        timeout-minutes: 8
        run: bash scripts/ci-apt-install.sh tmux lsof ffmpeg
      - name: Install better-sqlite3 prebuilt binary
        run: cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3 && npx --yes prebuild-install || npm run build-release
      - name: Build
        run: pnpm build
      - name: FLY-2453 whole-gate writer mutations
        if: matrix.name == 'teamlead 1 of 4'
        run: node scripts/fly-2453-narrow-gate-mutations.mjs
      - name: Record matrix worker budget
        run: node -e "console.log(JSON.stringify({cpus:require('node:os').availableParallelism(),maxForks:process.env.VITEST_MAX_FORKS,minForks:process.env.VITEST_MIN_FORKS}))"
      - name: Run matrix tests
        run: ${{ matrix.cmd }}
      - name: FLY-1883 stub-hygiene pairing
        if: matrix.name == 'teamlead 1 of 4'
        run: pnpm --filter flywheel-teamlead test:stub-hygiene
      - name: Canary — Report elapsed and cache state
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.cache-probe.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          start="$(cat "$RUNNER_TEMP/fly2684-canary-start")"
          now="$(date +%s)"
          printf 'elapsed_seconds=%s\n' "$((now - start))"
          if [ -n "$CACHE_HIT" ]; then cache_hit="$CACHE_HIT"; else cache_hit=false; fi
          printf 'cache_hit=%s\n' "$cache_hit"
  script-tests-2:
    name: Ubicloud Canary / Script 2
    runs-on: ${{ inputs.runner == 'ubicloud-standard-2' && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    needs:
      - preflight
    if: ${{ needs.preflight.result == 'success' && inputs.capacity == '0' }}
    timeout-minutes: 20
