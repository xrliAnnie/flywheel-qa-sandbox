        if: always()
        run: bash scripts/ci-job-elapsed-tripwire.sh --cap-minutes 20 --threshold-pct 85 --start-file "$RUNNER_TEMP/flywheel-job-start-epoch"
      - name: Canary — Report elapsed and cache state
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.cache-probe.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          start="$(cat "$RUNNER_TEMP/fly2684-canary-start")"
          now="$(date +%s)"
          printf 'elapsed_seconds=%s\n' "$((now - start))"
          if [ -n "$CACHE_HIT" ]; then cache_hit="$CACHE_HIT"; else cache_hit=false; fi
          printf 'cache_hit=%s\n' "$cache_hit"
  isolation-write:
    name: Ubicloud Canary / Isolation Writer
    runs-on: ${{ inputs.runner == 'ubicloud-standard-2' && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    needs:
      - preflight
    if: ${{ needs.preflight.result == 'success' && inputs.capacity == '0' }}
    timeout-minutes: 5
    steps:
      - name: Canary — Verify absence then write fixed sentinels
        shell: bash
        run: |
          set -euo pipefail
          for sentinel in /tmp/fly2684-vm-sentinel "$HOME/.fly2684-vm-sentinel" /var/tmp/fly2684-vm-sentinel; do
            test ! -e "$sentinel"
          done
          printf '%s\n' 'fly2684-non-secret-sentinel' > /tmp/fly2684-vm-sentinel
          printf '%s\n' 'fly2684-non-secret-sentinel' > "$HOME/.fly2684-vm-sentinel"
          printf '%s\n' 'fly2684-non-secret-sentinel' > /var/tmp/fly2684-vm-sentinel
          test -s /tmp/fly2684-vm-sentinel
          test -s "$HOME/.fly2684-vm-sentinel"
          test -s /var/tmp/fly2684-vm-sentinel
          printf 'runner_name=%s\n' "$RUNNER_NAME"
  isolation-read:
    name: Ubicloud Canary / Isolation Reader
    runs-on: ${{ inputs.runner == 'ubicloud-standard-2' && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    needs:
      - preflight
      - isolation-write
    if: ${{ needs.preflight.result == 'success' && inputs.capacity == '0' }}
    timeout-minutes: 5
    steps:
      - name: Canary — Verify fixed sentinels did not persist
        shell: bash
        run: |
          set -euo pipefail
          for sentinel in /tmp/fly2684-vm-sentinel "$HOME/.fly2684-vm-sentinel" /var/tmp/fly2684-vm-sentinel; do
            test ! -e "$sentinel"
          done
          boot_hash="$(sha256sum /proc/sys/kernel/random/boot_id | cut -d' ' -f1)"
          printf 'runner_name=%s\n' "$RUNNER_NAME"
          printf 'boot_id_sha256=%s\n' "$boot_hash"
  capacity-probe:
    name: Ubicloud Canary / Capacity (${{ matrix.slot }})
    runs-on: ${{ inputs.runner == 'ubicloud-standard-2' && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    needs:
      - preflight
    if: ${{ needs.preflight.result == 'success' && inputs.capacity != '0' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 54
      matrix:
        slot: ${{ fromJSON(needs.preflight.outputs.slots) }}
    steps:
      - name: Hold one capacity slot
        shell: bash
        run: |
          sleep 180
  result:
    name: Ubicloud Canary Result
    runs-on: ubuntu-latest
    needs:
      - preflight
      - quick-gate
      - unit-tests
      - script-tests-2
      - isolation-write
      - isolation-read
      - capacity-probe
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Verify the selected canary mode passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CAPACITY: ${{ inputs.capacity }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -e --arg capacity "$CAPACITY" '
            . as $needs
            | ($needs["preflight"].result == "success")
              and if $capacity == "0" then
                (["quick-gate", "unit-tests", "script-tests-2", "isolation-write", "isolation-read"]
                  | all(. as $job | $needs[$job].result == "success"))
                and ($needs["capacity-probe"].result == "skipped")
              else
                ($needs["capacity-probe"].result == "success")
                and (["quick-gate", "unit-tests", "script-tests-2", "isolation-write", "isolation-read"]
                  | all(. as $job | $needs[$job].result == "skipped"))
              end
          '
