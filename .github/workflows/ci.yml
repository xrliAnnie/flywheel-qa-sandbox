      # command-boundary shims only; no network or host service mutation.
      - name: Test — FLY-1729/1743 restart update + consistency guards
        run: |
          bash scripts/__tests__/restart-pull-preflight.test.sh
          bash scripts/__tests__/restart-deploy-consistency.test.sh

      # FLY-1081: restart/update/wrapper notify-path migration off Simba —
