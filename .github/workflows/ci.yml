name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# FLY-350 (Z) R3-2: pin the GITHUB_TOKEN to the LEAST privilege CI needs
# (read the repo to build/test — nothing else). Without an explicit block a
# pull_request run gets the repo-DEFAULT token scope, which can include write
# / issues / pull-requests — an INDIRECT action channel a model-authored PR
# (opened via the gateway) could ride to comment / dispatch / merge, bypassing
# the structural "Mufasa cannot :cool:" guarantee. default-deny + contents:read
# closes it. (The `:cool:` ship workflow's own scope is FLY-367.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FLY-1861: cost-only classifier. It may skip heavy jobs only when the
  # current PR head is a documentation-only descendant of the latest green
  # exact-PR baseline under the same base SHA. Every uncertainty runs full CI.
  classify:
    name: Classify CI scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      no_code: ${{ steps.classify.outputs.no_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify cumulative diff from latest green baseline
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-classify.sh

  quick-gate:
    name: Quick Gate (build + typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # FLY-1764: this job intentionally enumerates shell suites instead of
      # globbing platform/operator tests. Keep every root suite explicitly
      # classified as CI-run or reviewed manual-only so a new test cannot ship
      # without executing anywhere in the required lane.
      - name: Verify shell suite CI enumeration is complete
        run: bash scripts/__tests__/ci-shell-suite-enumeration.test.sh

      # This guard intentionally runs in the always-on lane. It is the
      # governance surface for changing the CI job graph and skip semantics.
      - name: Test — FLY-1338/1861 CI structure guard
        run: bash scripts/__tests__/ci-structure.test.sh

      - name: Enforce FLY-1773 ACK-only delivery semantics
        run: bash scripts/__tests__/fly1773-delivery-semantics.test.sh

      # FLY-2045: the milestone ledger must stay out of CLAUDE.md. This has to live in the
      # always-on lane: every regression it catches is a Markdown-only change, and Markdown
      # under engineering/doc/ classifies inert, so the heavy jobs would skip exactly the
      # PRs it is meant to catch. Pure bash, so it runs before `pnpm install`.
      - name: Enforce FLY-2045 milestone layout
        run: bash scripts/__tests__/fly2045-milestone-layout.test.sh

      # FLY-2030: these hermetic contracts guard the cross-repository prefix
      # fence and ensure activation fails before any running service is stopped.
      - name: Enforce FLY-2030 summary inflow gates
        run: |
          bash scripts/__tests__/fly2030-summary-prefix-pair.test.sh
          bash scripts/__tests__/fly2030-summary-registry-activation.test.sh

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # FLY-2074 is a docs-only PR, so this contract must run in the always-on
      # lane rather than a package or heavy test shard.
      - name: Enforce FLY-2074 founder disclosure contract
        run: node scripts/fly2074-founder-disclosure-guard.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce FLY-1781 flag-governance safety contracts
        run: |
          bash scripts/__tests__/flag-governance-cos-contract.test.sh
          bash scripts/__tests__/test-verify-flag-verdicts.test.sh

      - name: Build
        run: pnpm build

      - name: Enforce FLY-2165 torn mailbox identity repair contracts
        run: bash scripts/__tests__/fly-2165-repair-torn-mailbox-identities.test.sh

      - name: Enforce FLY-2103 project config generator retirement
        run: bash scripts/__tests__/fly2103-project-config-generators.test.sh

      - name: Verify workflow seed authority
        run: pnpm verify:workflow-seeds

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Enforce FLY-1645 receipt teardown residue gate
        run: |
          node --test scripts/__tests__/fly1645-receipt-residue-gate.test.mjs
          node scripts/fly1645-receipt-residue-gate.mjs --main-only

      - name: Enforce FLY-2006 retention consumer gate
        run: |
          node --test scripts/__tests__/fly-2006-retention-consumer-gate.test.mjs
          node scripts/fly-2006-retention-consumer-gate.mjs

  unit-tests:
    name: Unit (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [classify]
    if: ${{ needs.classify.outputs.no_code != 'true' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: teamlead 1 of 3
            cmd: pnpm --filter flywheel-teamlead test:run --shard=1/3
          - name: teamlead 2 of 3
            cmd: pnpm --filter flywheel-teamlead test:run --shard=2/3
          - name: teamlead 3 of 3
            cmd: pnpm --filter flywheel-teamlead test:run --shard=3/3
          - name: heavy
            cmd: pnpm --filter flywheel-claude-runner --filter flywheel-comm --filter flywheel-edge-worker test:run
          - name: light
            cmd: pnpm --filter './packages/*' --filter '!flywheel-teamlead' --filter '!flywheel-claude-runner' --filter '!flywheel-comm' --filter '!flywheel-edge-worker' test:run
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@flywheel.dev"
          git config --global user.name "Flywheel CI"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # FLY-1759: edge-worker teardown E2E uses the real cwd census, and the
      # real-tmux reap case spawns an actual tmux server bound to the worktree
      # cwd. FLY-1905 verifies both tools before skipping installation; a
      # missing, broken, or below-floor tool enters the bounded repair path.
      - name: Ensure lsof/tmux (FLY-1905 hardened, normally zero-network)
        timeout-minutes: 8
        run: bash scripts/ci-apt-install.sh tmux lsof

      - name: Install better-sqlite3 prebuilt binary
        run: cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3 && npx --yes prebuild-install || npm run build-release

      - name: Build
        run: pnpm build

      - name: Run matrix tests
        run: ${{ matrix.cmd }}

      - name: FLY-1883 stub-hygiene pairing
        if: matrix.name == 'teamlead 1 of 3'
        run: pnpm --filter flywheel-teamlead test:stub-hygiene

  script-tests:
    name: Script Tests 1/4 — session/lifecycle (shell suites)
    runs-on: ubuntu-latest
    needs: [classify]
    if: ${{ needs.classify.outputs.no_code != 'true' }}
    # FLY-2245 rebalanced six 2026-09-01 runs against the unchanged FLY-1870
    # 1020s tripwire budget. Per-step maxima + 149s setup project this shard at
    # 624s (61.2%). Move only complete named steps; see the FLY-2245 research.
    timeout-minutes: 20
    steps:
      - name: Record job start (FLY-1870 tripwire)
        run: date +%s > "$RUNNER_TEMP/flywheel-job-start-epoch"

      - uses: actions/checkout@v4
        with:
          # FLY-2007 resolves a historical freeze commit; shallow clone cannot
          # see it (deterministic CI-only failure).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@flywheel.dev"
          git config --global user.name "Flywheel CI"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install better-sqlite3 prebuilt binary
        run: cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3 && npx --yes prebuild-install || npm run build-release

      - name: Build
        run: pnpm build

      # FLY-889 dependencies remain fail-closed. FLY-1905 first verifies each
      # real binary and version; only probe failures enter the bounded installer.
      - name: Ensure tmux/lsof/sqlite3/ripgrep (FLY-1905 hardened)
        timeout-minutes: 8
        run: bash scripts/ci-apt-install.sh tmux lsof sqlite3 ripgrep

      - name: Test — FLY-1707 incident replay
        run: bash scripts/__tests__/qa-fly-1707-incident-replay.test.sh

      # FLY-1393: prove the operator-facing flag-truth CLI is directly
      # executable and that its retired-switch positive control fails closed.
      - name: Test — FLY-1393 flag truth CLI
        run: bash scripts/__tests__/check-flag-truth.test.sh

      # FLY-1436: the founder-gated cutover CLI is a root-level node:test
      # module, so workspace Vitest jobs do not discover it.
      - name: Test — FLY-1436 work-kind cutover CLI
        run: node --test scripts/__tests__/workkind-cutover.test.mjs

      # FLY-1759: script-tests are explicitly enumerated (no glob discovery).
      # The first suite runs real child/sun process cleanup on Ubuntu; the
      # second blocks any new unanchored worktree-removal command.
      - name: Test — FLY-1759 reap-first worktree teardown
        run: |
          bash scripts/__tests__/test-reap-worktree-lib.test.sh
          bash scripts/__tests__/test-worktree-removal-contract.test.sh

      # FLY-1867/2026: these hermetic suites guard both read-only browser
      # censuses and the exact-manifest quarantine/delete safety gates. The
      # quarantine suite uses real lsof against only its private temp tree.
      - name: Test — FLY-1867/2026 Playwright lifecycle tools
        run: |
          bash scripts/__tests__/fly-1867-playwright-orphan-census.test.sh
          bash scripts/__tests__/fly-2026-browser-idle-census.test.sh
          bash scripts/__tests__/fly-1867-legacy-profiles-quarantine.test.sh

      - name: Test — FLY-1572 mailbox migration CLI
        run: bash scripts/__tests__/migrate-fly1572-mailbox.test.sh

      # FLY-1764: producer retirement is a deployment fence over real SQLite
      # shards, including legacy schemas and the rollback-on-cleanup-failure
      # path. It must run in the required CI lane, not only on an author host.
      - name: Test — FLY-1764 legacy swap broadcast retirement
        run: bash scripts/__tests__/legacy-swap-broadcast-retirement.test.sh

      # FLY-1327: deterministic cycle-time analytics use real WAL backup +
      # immutable-snapshot reads against fixture DBs. Keep the sqlite preflight
      # adjacent so a missing CLI fails with an explicit environment diagnosis.
      - name: Test — FLY-1327 cycle-time report
        run: |
          sqlite3 --version
          pnpm test:cycle-time

      # FLY-110: cmux-sync hook integration test runs against an isolated
      # tmux server (exact -S path under its private temp root) so it cannot interfere with
      # other CI processes. Verifies the production-critical cleanup path:
      # pane-died (global hook) fires when a remain-on-exit pane process
      # exits — the bug that left cmux sidebar entries hanging for 5+
      # minutes in production until FLY-110.
      - name: Integration test — cmux-sync hooks
        run: bash scripts/test-cmux-sync-hooks-integration.sh

      # FLY-1944: the founder-gated host cutover is hermetic here: all Homebrew,
      # tmux, process-census, Bridge HTTP, receipt, and clock inputs use private
      # fixtures or injected seams. Keep it in the required lane so admission
      # budget/quiescence and exact-version preflight cannot drift unobserved.
      - name: Test — FLY-1944 host terminal cutover brake
        run: bash scripts/__tests__/host-terminal-cutover.test.sh

      # FLY-183: Discord adapter orphan reaper tests. Hermetic — the reaper's
      # process-table source is injected (FLY183_PS_OVERRIDE) and all spawned
      # processes are test-owned, so this never touches a real adapter. lsof is
      # needed for the cwd-probe / identity-label cases (T3/T4).
      - name: Test — Discord adapter orphan reaper (FLY-183)
        run: bash packages/teamlead/scripts/__tests__/adapter-reap.test.sh

      # FLY-1402: Claude CLI is last-one-wins for repeated prompt-file flags.
      # Exercise the real launcher under isolated HOMEs across dept/CoS/
      # companion/external + explicit legacy, then prove receipt lifecycle.
      - name: Test — Lead rules single-bundle load chain (FLY-1402)
        run: bash packages/teamlead/scripts/__tests__/fly1402-single-bundle.test.sh

      # FLY-1496: model resolution is authoritative-source-driven, so the thing
      # worth machining is that a launch is FAITHFUL to config — aliases
      # canonicalize, a stale manifest never wins, and an edit takes effect on
      # the next decision. This job enumerates suites explicitly (no glob
      # discovery), so a suite not listed here only ever ran on its author's
      # machine. Both are hermetic: isolated HOMEs and the real launcher in
      # dry-run.
      - name: Test — FLY-1496 model resolution + Lead derivation
        run: |
          bash scripts/__tests__/fly1496-model-policy.test.sh
          bash packages/teamlead/scripts/__tests__/fly241-lead-model-override.test.sh
          bash packages/teamlead/scripts/__tests__/lead-model-authority-receipt.test.sh
          bash scripts/__tests__/fly1496-qa-acceptance.test.sh
          bash packages/teamlead/scripts/__tests__/fly1650-companion-effort.test.sh

      # FLY-1663: launchd-native lifecycle contracts are root shell suites and
      # are not discovered by package Vitest jobs. Keep all four migration
      # seams explicit: carrier foundation, body runtime, cmux, and Bridge.
      # FLY-1679 rides here as a fifth seam: the dev-channels auto-confirm the
      # carrier migration dropped, whose absence parks every Lead cold start.
      - name: Test — FLY-1663 launchd-native Lead lifecycle
        run: |
          bash scripts/__tests__/fly1663-launchd-foundation.test.sh
          bash scripts/__tests__/fly1663-lead-v2-runtime.test.sh
          bash scripts/__tests__/fly1663-cmux-v2.test.sh
          bash scripts/__tests__/fly1663-bridge-launchd.test.sh
          bash scripts/__tests__/fly1663-qa-launchd.test.sh
          bash scripts/__tests__/fly1679-dev-channels-v2.test.sh
          bash scripts/__tests__/fly1680-v1-extinction.test.sh
          bash scripts/__tests__/flywheel-daemon-install-verify.test.sh
          bash scripts/__tests__/materialize-lead-manifests.test.sh

      # FLY-1830: the non-Lead launchd daemons (quota-monitor, updater,
      # bridge-liveness-probe, daily-standup) had no owner — a label that left
      # the domain stayed gone with its plist still on disk. The restart wave now
      # reconciles them, and the Lead family must stay excluded (bootstrapping
      # the FLY-398 TUI carrier would create a second listener). Hermetic: the
      # launchctl seam is a scripted mock, so this never touches a real domain.
      # Step seconds: ~1.
      - name: Test — FLY-1830 non-Lead daemon convergence
        run: |
          bash scripts/__tests__/converge-nonlead-daemons.test.sh

      # FLY-1814: explicit launchd fleet authority, bidirectional census, and
      # operator-only repair/retirement paths. Every suite is hermetic: plist,
      # TTY, launchctl, filesystem, and alert boundaries use fixtures/seams.
      # Keep this separate from FLY-1830's existing single-suite contract.
      # Step seconds: ~15 locally; comfortably inside the shard budget.
      - name: Test — FLY-1814 launchd fleet contracts
        run: |
          bash scripts/__tests__/launchd-units-manifest.test.sh
          bash scripts/__tests__/launchd-units-manifest-fail-closed.test.sh
          bash scripts/__tests__/launchd-census.test.sh
          bash scripts/__tests__/launchd-census-wiring.test.sh
          bash scripts/__tests__/fly1814-operator-tools.test.sh

      # FLY-1929: IPC-voucher watcher. Hermetic — injected clock, fake zprint,
      # fake DiagnosticReports dir, and a fake alert script that MIRRORS the real
      # permanent-receipt dedup (a forgetful fake would let the re-arm case pass
      # while production silently never re-posts). Drives real sequential
      # invocations rather than one batch fixture, because a batch fixture hides
      # warm-up behaviour. Step seconds: ~230 locally on a loaded host.
      - name: Test — FLY-1929 voucher watch contracts
        run: |
          bash scripts/__tests__/voucher-watch.test.sh

      # FLY-913/2137/2204: restart/calendar guard and credential-isolation
      # deployment guardrails. Hermetic — all credentials, calendar clients,
      # homes, sockets, and delivery seams are private fixtures.
      - name: Test — FLY-913/2204 restart + calendar isolation guards
        run: |
          python3 scripts/hooks/test-flywheel-restart-guard.py
          bash scripts/hooks/test-restart-guard-install.sh
          bash scripts/__tests__/test-calendar-write-sweep.test.sh
          bash scripts/__tests__/test-install-calendar-sweep.test.sh
          bash scripts/__tests__/fly2204-calendar-isolation-negative.test.sh
          bash scripts/__tests__/fly2204-calendar-oauth-probe.test.sh
          bash scripts/__tests__/fly2204-calendar-peer-proxy.test.sh
          bash scripts/__tests__/fly2204-calendar-service-installer.test.sh
          bash scripts/__tests__/fly2204-qa-calendar-config.test.sh
          bash scripts/__tests__/lead-alert-strict-delivery.test.sh

      - name: Test — FLY-2007 phase-0 analyser contract
        run: bash scripts/__tests__/qa-fly-2007-phase0-analyze.test.sh

      - name: Enforce FLY-1870 capacity tripwire
        if: always()
        run: bash scripts/ci-job-elapsed-tripwire.sh --cap-minutes 20 --threshold-pct 85 --start-file "$RUNNER_TEMP/flywheel-job-start-epoch"

  script-tests-2:
    name: Script Tests 2/4 — fleet/setup/packaging A (shell suites)
    runs-on: ubuntu-latest
    needs: [classify]
    if: ${{ needs.classify.outputs.no_code != 'true' }}
    # FLY-2245 rebalanced six 2026-09-01 runs against the unchanged FLY-1870
    # 1020s tripwire budget. Per-step maxima + 149s setup project this shard at
    # 605s (59.3%). Move only complete named steps; see the FLY-2245 research.
    timeout-minutes: 20
    steps:
      - name: Record job start (FLY-1870 tripwire)
        run: date +%s > "$RUNNER_TEMP/flywheel-job-start-epoch"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@flywheel.dev"
          git config --global user.name "Flywheel CI"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install better-sqlite3 prebuilt binary
        run: cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3 && npx --yes prebuild-install || npm run build-release

      - name: Build
        run: pnpm build

      # FLY-889 dependencies remain fail-closed. FLY-1905 first verifies each
      # real binary and version; only probe failures enter the bounded installer.
      - name: Ensure tmux/lsof/sqlite3/ripgrep (FLY-1905 hardened)
        timeout-minutes: 8
        run: bash scripts/ci-apt-install.sh tmux lsof sqlite3 ripgrep

      - name: Test — FLY-1905 CI apt-install helper
        timeout-minutes: 10
        run: bash scripts/__tests__/ci-apt-install.test.sh

      # FLY-519: fleet provisioning toolchain — hermetic tests for the secret
      # sanitizer, capture, and provision scripts, PLUS the zero-secret gate at
      # the git boundary. `scan_for_secrets fleet/` fails CI if the committed
      # fleet/ artifact ever contains secret-like content (e.g. a hand-edited
      # artifact bypassing fleet-capture.sh's own gate — Codex design-review).
      - name: Test — FLY-519 fleet provisioning + zero-secret gate
        run: |
          bash scripts/__tests__/fleet-sanitize.test.sh
          bash scripts/__tests__/fleet-capture.test.sh
          bash scripts/__tests__/provision-fleet-host.test.sh
          bash -c 'source scripts/lib/fleet-sanitize.sh; scan_for_secrets fleet/'

      # FLY-2034: Belle's cutover runbook carries a credential gate that must
      # inspect the Git index (including binary blobs), never a divergent
      # working-tree copy. Hermetic temporary repo; no external credentials.
      - name: Test — FLY-2034 Belle staged credential gate
        run: bash scripts/__tests__/fly2034-onboarding-credential-gate.test.sh

      # FLY-1356: skill-framework arm definitions are FROZEN artifacts — the
      # matt-skills vendor structure + B/C prompt-variant contracts (bare arm
      # Superpowers grep-zero with positive controls; baselines stay on A).
      - name: Test — FLY-1356 skill-framework vendor + variant contracts
        run: bash scripts/__tests__/skill-framework-variants.test.sh

      # FLY-1609: the authoritative future-data analysis entry must keep all
      # four arms visible, gate comparisons on the rollout epoch, and exclude
      # sessions whose effective ponytail condition does not match their arm.
      - name: Test — FLY-1609 four-arm analysis contract
        run: bash scripts/__tests__/test-fly1609-design-compare.test.sh

      # FLY-648: one-command setup wizard (flywheel-setup.sh). Hermetic —
      # fixture HOMEs + stubbed curl/systemctl/loginctl + guided inputs via
      # the FLYWHEEL_SETUP_ANSWER_* automation seam. Needs the built teamlead
      # dist (pnpm build above): the config gate runs the REAL loader
      # (validate-projects CLI), and the POC drives the real provisioner's
      # Linux APPLY path end-to-end + the linux-preflight --check contract.
      - name: Test — FLY-648 one-command setup wizard
        run: |
          bash scripts/__tests__/flywheel-setup-engine.test.sh
          bash scripts/__tests__/flywheel-setup-config.test.sh
          bash scripts/__tests__/flywheel-setup-bot.test.sh
          bash scripts/__tests__/flywheel-setup-channels.test.sh
          bash scripts/__tests__/flywheel-setup-linear.test.sh
          bash scripts/__tests__/flywheel-setup-services.test.sh
          bash scripts/__tests__/flywheel-setup-poc.test.sh
          bash scripts/__tests__/flywheel-setup-resume-e2e.test.sh

      # FLY-1023: Buddy onboarding — step CLI over the unchanged wizard
      # (journal v2, stdout discipline, secret-injection refusal) + the
      # AgentCliProvider contract. Hermetic — same stub infrastructure as the
      # FLY-648 suite; needs the built teamlead dist (real-loader gate).
      - name: Test — FLY-1023 Buddy onboarding (step CLI + provider contract)
        run: |
          bash scripts/__tests__/flywheel-buddy-steps.test.sh
          bash scripts/__tests__/agent-cli-provider-contract.test.sh
          bash scripts/__tests__/flywheel-onboard.test.sh
          bash scripts/__tests__/flywheel-buddy.test.sh
          bash scripts/__tests__/flywheel-buddy-github.test.sh
          bash scripts/__tests__/flywheel-buddy-captain.test.sh
          bash scripts/__tests__/flywheel-buddy-connect.test.sh
          bash scripts/__tests__/buddy-escalate.test.sh

      # FLY-1189: 529-Room multi-Lead campaign harness — hermetic suite over
      # scripts/lib/qa-multilead.sh + the test-deploy/test-teardown wiring:
      # byte-compat baselines (FLYWHEEL_PROJECTS builder + canonical
      # config.yaml), campaign-arg validation, atomic slot-set claim/rollback,
      # borrowed-lock anti-reclaim, manifest-driven extra-Lead teardown, and
      # the secret-free launch manifest. Temp lockroots + sandboxed HOME +
      # stubbed tmux — never touches a real slot.
      - name: Test — FLY-1189 multi-Lead campaign harness
        run: bash scripts/__tests__/test-deploy-multilead.test.sh

      # FLY-2237: slot-only Bridge cycle — hermetic process/listener fixture
      # covering campaign ownership, validation, TERM-only failure handling,
      # lsof/bind proofs, interruption, and cycle/teardown exclusion.
      - name: Test — FLY-2237 slot Bridge cycle
        run: bash scripts/__tests__/test-cycle-bridge.test.sh

      # FLY-1775: generalized-DAG 529 room provisioning, canonical binding
      # seed/verify, deterministic persistent stub, and the nine-step replay
      # state machine. Hermetic: temporary SQLite/clone fixtures and fake
      # Discord HTTP responses; it never starts a real room or writes GitHub.
      - name: Test — FLY-1775 generalized-DAG 529 room
        run: |
          bash scripts/__tests__/test-deploy-generalized.test.sh
          bash scripts/__tests__/fly2121-node-contract-and-setup.test.sh
          node --test scripts/__tests__/qa-generalized-helper.test.mjs
          node --test scripts/__tests__/qa-generalized-e2e-lib.test.mjs
          node --test scripts/__tests__/qa-generalized-codex-stub.test.mjs

      # FLY-1189: fault injector S1 SAFETY LOCK — the anchor rejection matrix
      # (execId/tmux/path anchors + prod denylist + prefix-collision + symlink
      # escape + TOCTOU start-time/inode drift + restore direction lock +
      # all-in-safe-root journal invariant). Every rejection path must exit
      # non-zero with ZERO actions performed — this is what keeps a mis-fired
      # SIGSTOP/mv off the 19 live production runners. Fully hermetic
      # (descriptor fixtures + action sink; never touches a real process).
      - name: Test — FLY-1189 fault injector safety lock
