          bash scripts/__tests__/qa-fly1081-notify-identity.test.sh

      - name: Test — FLY-1861 CI cancellation and classification contracts
        run: |
          bash scripts/__tests__/ship-await-ci.test.sh
          bash scripts/__tests__/ship-report-failure.test.sh
          bash scripts/__tests__/ci-classify.test.sh

      # FLY-1674: retired dispatcher/config/flag names cannot return outside
      # exact persisted-compatibility seams.
      - name: Test — FLY-1674 legacy-path residue guard
        run: bash scripts/__tests__/fly1674-residue.test.sh

      - name: Test — FLY-2102 startup flag freeze residue guard
        run: bash scripts/__tests__/fly2102-flag-freeze.test.sh

      # FLY-1338 QA: the structure guard above reasons about the matrix filter
      # STRINGS; this one asks pnpm what they actually resolve to on the real
      # workspace, so "the sharded matrix still covers every packages/* package,
      # exactly once" survives future filter edits AND package renames/additions.
      - name: Test — FLY-1338 matrix coverage parity (QA)
        run: bash scripts/__tests__/ci-matrix-coverage.test.sh

      - name: Test — FLY-1855 executable Lead patrol snapshot
        run: bash scripts/__tests__/lead-patrol-snapshot.test.sh

      # FLY-1986: the Phase-0 load probe is read-only by contract. This suite
      # mutates the probe and requires every contract to go RED, so a check that
      # can no longer fail is itself caught. ⚠ Placed on THIS shard, not shard 1:
