        run: bash scripts/__tests__/db-maintenance.test.sh

      # FLY-1887: hard deadline + identity-fenced cleanup for global one-shot
      # Codex calls. Hermetic fake HOME/PATH/process fixtures; never installs to
      # or signals anything in the runner's real host state.
