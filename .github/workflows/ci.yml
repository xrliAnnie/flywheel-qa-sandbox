        run: bash scripts/__tests__/flywheel-log-rotate.test.sh

      - name: Test — FLY-1961 dual-vendor workspace trust
        run: bash scripts/__tests__/test-runner-workspace-trust.sh

      # FLY-1018: gemini-agent static guard. Pure grep assertions over
      # packages/gemini-agent/src — zero reserved endpoints, zero forbidden
      # imports, zero privileged credentials, exactly 6 tool declarations.
      # Widening the agent's surface must be an explicit, reviewable act.
      - name: Test — FLY-1018 gemini-agent guard
        run: bash scripts/gemini-agent-guard.sh

      # FLY-880: internal PM agent role .md contract guard. Pure text assertions
      # (no external deps) — defends the 40k injection-truncation red line and the
      # product-co-creation (mode A) + inherited docs/design (mode B) anchors
      # against silent regression.
      - name: Test — FLY-880 PM executor role contract
        run: bash scripts/__tests__/test-pm-executor-contract.sh

      # FLY-2015: roles that produce architecture diagrams or founder-facing
      # HTML must route polished diagrams through diagram-design. QA stays an
      # independent verifier and is deliberately not assigned the skill.
      - name: Test — FLY-2015 diagram-design role routing
        run: bash scripts/__tests__/fly2015-diagram-design-roles.test.sh

      # FLY-2022: the v2.6.5 vendor copy is project-scoped, byte-pinned, and
      # carries a default marker so unattended first generation never asks for
      # brand colors. Pure local hash/census checks; no installer or network.
      - name: Test — FLY-2022 diagram-design project install
        run: bash scripts/__tests__/fly2022-diagram-design-install.test.sh

      # FLY-1787: Flywheel CoS prompt rules must keep department labels
