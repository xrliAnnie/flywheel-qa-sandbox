          bash scripts/__tests__/fly1944-birth-adoption.test.sh
          bash scripts/__tests__/fly1944-dead-view-rebuild.test.sh
          bash scripts/__tests__/fly1944-helper-reap.test.sh
          bash scripts/__tests__/cmux-cleanup-lifecycle.test.sh
          bash scripts/__tests__/cmux-view-rebind.test.sh
          bash scripts/__tests__/fly2048-cmux-convergence.test.sh
          bash scripts/__tests__/fly1884-view-attach.test.sh
          bash scripts/__tests__/fly1884-attach-recovery.test.sh
          bash scripts/__tests__/fly1884-node-presence.test.sh
          bash scripts/__tests__/tmux-server-rescue.test.sh
          bash scripts/__tests__/tmux-server-rescue-lock.test.sh
          bash scripts/__tests__/tmux-server-rescue-instrumentation.test.sh
          bash scripts/__tests__/tmux-server-rescue-real-tmux.test.sh
          bash scripts/__tests__/flywheel-cmux-install-link-only.test.sh
          bash scripts/__tests__/test-cmux-autostart-flags.test.sh
          bash scripts/__tests__/test-teardown-cmux-ownership.test.sh
          bash scripts/__tests__/test-teardown-live-watcher-e2e.test.sh
          bash scripts/__tests__/test-teardown-lease-contract.test.sh
          bash scripts/__tests__/qa-teardown-finalize.test.sh
          bash scripts/__tests__/restart-cmux-watcher.test.sh

      - name: Enforce FLY-1870 capacity tripwire
        if: always()
        run: bash scripts/ci-job-elapsed-tripwire.sh --cap-minutes 20 --threshold-pct 85 --start-file "$RUNNER_TEMP/flywheel-job-start-epoch"

  # FLY-1062 PR3/PR4: the gated distribution layer — ISOLATED job (the
  # original Build & Test job above was split by FLY-1338; this payload job
  # mapping remains byte-untouched. Hermetic: the pure endpoint handler + its
  # in-process serve shell + the release/ops scripts + the PR2 contract-
  # consistency rerun + the workflow structure lint. Zero wrangler, zero vendor
  # credentials, zero network beyond loopback.
  payload-distribution:
    name: NPM payload distribution (endpoint + release pipeline)
    runs-on: ubuntu-latest
    needs: [classify]
    if: ${{ needs.classify.outputs.no_code != 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # only the version-injection sentinel needs node_modules (typescript for
      # the run-bridge transpile inside the fixture packer)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Endpoint handler unit tests (validator / views / transitions / lifecycle)
        run: node --test packages/payload-endpoint/__tests__/*.test.mjs

      - name: PO_RELEASE_VERSION injection sentinel (default path byte-stable)
        run: bash scripts/__tests__/package-onboard-version-injection.test.sh

      - name: Contract consistency — PR2 shell suites vs the REAL handler
        run: bash packages/payload-endpoint/__tests__/contract-consistency.test.sh

      - name: License key + retention cleanup scripts
        run: bash scripts/__tests__/payload-key-cleanup.test.sh

      - name: Release pipeline (beta line + two-stage promote + withdraw)
        run: bash scripts/__tests__/payload-release-pipeline.test.sh

      # FLY-1323 (Codex R7#4): the two preflight matrices were standalone and ran
      # NOWHERE in CI, so their O1-O7 / registry fail-closed guards could regress
      # while required checks stayed green. Wired here. NOTE: both de-placeholder the
      # checked-in packages/onboard-shell/lib/config.mjs (atomic temp+mv, trap-restored)
      # — keep them SEQUENTIAL (do NOT move either into a parallel matrix that also
      # reads config.mjs) until they are refactored onto a fully sandboxed tree.
      - name: Preflight registry-pin matrix (scoped-registry fail-closed)
        run: bash scripts/__tests__/shell-preflight-registry.test.sh

      - name: Preflight OIDC toolchain-floor matrix (exit-status + version-grammar guards)
        run: bash scripts/__tests__/oidc-toolchain-floor.test.sh

      - name: Release workflow structure lint (founder-gate contract)
        run: bash scripts/__tests__/release-workflows-structure.test.sh

      - name: Ship merge-token contract (SHIP_PAT first, GITHUB_TOKEN fallback)
        run: bash scripts/__tests__/ship-merge-token.test.sh

      - name: Shell packaging verification (pack + install + publish --dry-run)
        run: bash scripts/__tests__/shell-pack-install-dryrun.test.sh

      - name: Customer E2E acceptance (real endpoint + real release scripts + tarball-installed shell)
        run: bash scripts/__tests__/customer-e2e-acceptance.test.sh

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [classify, quick-gate, unit-tests, script-tests, script-tests-2, script-tests-3, script-tests-4, payload-distribution]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Verify all jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          NO_CODE: ${{ needs.classify.outputs.no_code }}
        run: |
          printf '%s\n' "$NEEDS_JSON" | jq -e --arg no_code "$NO_CODE" '
            . as $needs
            | ($needs["quick-gate"].result == "success")
              and ($needs.classify.result == "success")
              and (
                ["unit-tests", "script-tests", "script-tests-2", "script-tests-3", "script-tests-4", "payload-distribution"]
                | all(
                    . as $job
                    | ($needs[$job].result == "success")
                      or ($no_code == "true" and $needs[$job].result == "skipped")
                  )
              )
          '
