="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>每一步</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(460.796875, 907)"><g class="label" data-id="L_S_D_0" transform="translate(-32, -12)"><foreignObject width="64" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>兜底时写</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(460.796875, 1203)"><g class="label" data-id="L_D_X_0" transform="translate(-42.046875, -12)"><foreignObject width="84.09375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>launch 时读</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default t" id="flowchart-S-0" transform="translate(299.3984375, 687)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#007aff !important;stroke-width:1.5px !important" x="-130" y="-183" width="260" height="366"/><g class="label" style="text-align:left !important" transform="translate(-100, -168)"><rect/><foreignObject width="200" height="336"><div style="text-align: center; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="text-align:left !important" class="nodeLabel"><p>codex_quota_standby<br />一行 = 一个待命执行体<br />——————<br />execution_id 主键<br />run · node · attempt · activation<br />entered_at · entry_seq<br />state 待命/恢复中/兜底准备中/已释放/结束<br />trigger_signal_seq 撞墙序号<br />permit_id · attempts_for_permit<br />fallback_execution_id · vendor</p></span></div></foreignObject></g></g><g class="node default t" id="flowchart-P-1" transform="translate(299.3984375, 295)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#007aff !important;stroke-width:1.5px !important" x="-138.375" y="-135" width="276.75" height="270"/><g class="label" style="text-align:left !important" transform="translate(-108.375, -120)"><rect/><foreignObject width="216.75" height="240"><div style="text-align: center; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="text-align:left !important" class="nodeLabel"><p>codex_quota_capacity_permit<br />一行 = 某账号代的放行证据<br />——————<br />kind 切号成功 / 读数确认有额度<br />root_key · generation<br />account_key · profile<br />covers_signal_seq 覆盖到的撞墙序号<br />evidence_ref</p></span></div></foreignObject></g></g><g class="node default t" id="flowchart-A-2" transform="translate(138, 1055)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#007aff !important;stroke-width:1.5px !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="text-align:left !important" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div style="text-align: center; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="text-align:left !important" class="nodeLabel"><p>codex_quota_resume_audit<br />只增不改的审计<br />——————<br />action 进入/开始/续上/失败/兜底/释放<br />from_profile · to_profile · vendor<br />detail_code</p></span></div></foreignObject></g></g><g class="node default t" id="flowchart-D-3" transform="translate(460.796875, 1055)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#007aff !important;stroke-width:1.5px !important" x="-142.796875" y="-99" width="285.59375" height="198"/><g class="label" style="text-align:left !important" transform="translate(-112.796875, -84)"><rect/><foreignObject width="225.59375" height="168"><div style="text-align: center; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="text-align:left !important" class="nodeLabel"><p>codex_quota_dispatch_demand<br />兜底派发要求<br />——————<br />new_execution_id 主键<br />vendor codex 或 claude<br />reason codex_quota_fallback<br />state 准备 / 已提交 / 已回滚</p></span></div></foreignObject></g></g><g class="node default e" id="flowchart-R-4" transform="translate(299.3984375, 47)"><rect class="basic label-container" style="fill:#f5f5f7 !important;stroke:#86868b !important;stroke-dasharray:4 3 !important" x="-107.875" y="-39" width="215.75" height="78"/><g class="label" style="" transform="translate(-77.875, -24)"><rect/><foreignObject width="155.75" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>codex-accounts.json<br />只读额度读数(已存在)</p></span></div></foreignObject></g></g><g class="node default e" id="flowchart-X-5" transform="translate(460.796875, 1279)"><rect class="basic label-container" style="fill:#f5f5f7 !important;stroke:#86868b !important;stroke-dasharray:4 3 !important" x="-137.671875" y="-39" width="275.34375" height="78"/><g class="label" style="" transform="translate(-107.671875, -24)"><rect/><foreignObject width="215.34375" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>resolveNodeDispatchAtLaunch<br />唯一派发解析(已存在)</p></span></div></foreignObject></g></g></g></g></g></svg>