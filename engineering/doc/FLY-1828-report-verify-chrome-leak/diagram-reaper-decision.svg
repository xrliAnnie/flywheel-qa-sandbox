e; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>放过<br />QA 正在驱动的浏览器、<br />你桌面开着的 Chrome 都不碰</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-T-9" transform="translate(454.4765625, 1010.703125)"><polygon points="102.953125,0 205.90625,-102.953125 102.953125,-205.90625 0,-102.953125" class="label-container" transform="translate(-102.453125, 102.953125)"/><g class="label" style="" transform="translate(-75.953125, -12)"><rect/><foreignObject width="151.90625" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>已经活了超过 5 分钟?</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-S3-11" transform="translate(306.5390625, 1238.65625)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>放过: 正常截图还在跑<br />(正常寿命只有几秒,余量 75 倍)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-U-13" transform="translate(602.4140625, 1238.65625)"><rect class="basic label-container" style="" x="-115.875" y="-51" width="231.75" height="102"/><g class="label" style="" transform="translate(-85.875, -36)"><rect/><foreignObject width="171.75" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>核对身份指纹(启动时刻)<br />确认还是同一个进程<br />防止号码被新进程复用</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-V-15" transform="translate(602.4140625, 1390.65625)"><rect class="basic label-container" style="fill:#fdebec !important;stroke:#ff3b30 !important" x="-115.8359375" y="-51" width="231.671875" height="102"/><g class="label" style="" transform="translate(-85.8359375, -36)"><rect/><foreignObject width="171.671875" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>先礼后兵: 温和退出信号<br />→ 3 秒没退 → 强制击杀<br />→ 确认死透才记一笔账</p></span></div></foreignObject></g></g></g></g></g></svg>