6-d3_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_E_P_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_P_F_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_F_W_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_W_G_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_G_REC_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-E-0" transform="translate(138, 95)"><rect class="basic label-container" style="" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>0 环境绑定<br />记下 Bridge 地址 + 数据库真实路径<br />+ 六仓 commit 号,并验证 SQL 查的<br />就是这台 Bridge 用的库</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-P-1" transform="translate(138, 307)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>1 前置收敛<br />维护窗内合并 5 个配套 PR;<br />六仓 config 逐仓保全式清理<br />(备份 diff,只动退役键,冲突即停)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-3" transform="translate(138, 519)"><rect class="basic label-container" style="fill:#fff8e6 !important;stroke:#ff9500 !important;stroke-width:2px !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>2 写前体检(只读)<br />库里恰好 6 行 → 允许写<br />恰好最终 7 行 → 无事可做,安全重入<br />其他任何状态 → 停,人工裁决</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-W-5" transform="translate(138, 719)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>3 写第 7 行<br />ponytail 全局=关<br />走 Bridge 正式接口,任一步失败即中止</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-7" transform="translate(138, 907)"><rect class="basic label-container" style="fill:#eef6ff !important;stroke:#007aff !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>4 三道验收<br />G2-a 库里恰好 7 行<br />G2-b 六仓退役键零残留<br />G2-c 完整可观察面清单逐项核对</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-REC-9" transform="translate(138, 1083)"><rect class="basic label-container" style="" x="-121.34375" y="-51" width="242.6875" height="102"/><g class="label" style="" transform="translate(-91.34375, -36)"><rect/><foreignObject width="182.6875" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>5 记录<br />证据先拷贝再引用<br />全程记入 FLY-2103 讨论串</p></span></div></foreignObject></g></g></g></g></g></svg>