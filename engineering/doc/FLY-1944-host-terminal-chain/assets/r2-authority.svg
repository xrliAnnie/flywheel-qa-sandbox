" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>现场三方核对(每次动手前重做)<br />① cmux 现在的 tab/surface 清单<br />② cmux 自己的持久状态文件里这块画面正在跑什么命令<br />③ Lead 名册里它应该连到哪个会话</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-2" transform="translate(148.8125, 519)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>修复闸门(最后一道)<br />0 个观看者 + 画面确认已死<br />+ 连续两轮结论一致 + 预算未用完</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-A-3" transform="translate(126.8125, 695)"><rect class="basic label-container" style="fill:#e6f9ec !important;stroke:#34c759 !important" x="-118.8125" y="-39" width="237.625" height="78"/><g class="label" style="" transform="translate(-88.8125, -24)"><rect/><foreignObject width="177.625" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>才允许动手修<br />(一次只修一个,全程留痕)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-X-4" transform="translate(392.0390625, 695)"><rect class="basic label-container" style="fill:#fdeceb !important;stroke:#ff3b30 !important" x="-96.4140625" y="-39" width="192.828125" height="78"/><g class="label" style="" transform="translate(-66.4140625, -24)"><rect/><foreignObject width="132.828125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>任何一项对不上 →<br />只记录,绝不动手</p></span></div></foreignObject></g></g></g></g></g></svg>