t: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Bridge 核 head<br />git rev-parse HEAD@QA 工作树 == 命令里的 head</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E-7" transform="translate(138, 787)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>探针 (a):去 529 房 /health<br />房活着? built? buildSha == head?</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-9" transform="translate(448, 787)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>探针 (b):真去取报告地址<br />托管报告 HTTP 200 + 正文 sha256 == 本地存档</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-11" transform="translate(138, 927)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>judgeRan → (a) 真环境跑过 ✓/✗ + 原因</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-H-13" transform="translate(448, 927)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>judgeRecord → (b) 外部记录可取 ✓/✗ + 原因</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-I-15" transform="translate(293, 1067)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>单事务写一行台账(只追加,不可改删)<br />强度二 = (a) ∧ (b)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-J-19" transform="translate(293, 1219)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>B4 影子跑记录线 ③ 读台账<br />没有行 = 不满足;取不到 = 不满足</p></span></div></foreignObject></g></g></g></g></g></svg>