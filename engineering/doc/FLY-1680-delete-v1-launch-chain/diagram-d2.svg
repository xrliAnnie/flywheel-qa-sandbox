iner" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>V0 守卫先行\n灭绝检测测试落地+注册进 CI\n(先证明它抓得到现存 v1 引用)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-V1-1" transform="translate(138, 211)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>V1 主体剜除\nclaude-lead.sh 剜掉 v1 区段\n+ 4 个孤儿库整删</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-V2-3" transform="translate(138, 363)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>V2 重启/安装面\n删 v1 启动壳与安装死分支\nCodex 重启编舞逐字节保留</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-V3-5" transform="translate(138, 515)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>V3 carrier 契约\n封死历史事务复活 v1 的路\n(用真实旧事务做反面测试)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-V4-7" transform="translate(138, 667)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>V4 观测面+收口\nTS 侧 v1 识别臂删除\n开启全仓灭绝断言+文档里程碑</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-A-9" transform="translate(138, 819)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>验收\ngrep 级灭绝 + QA 槽冷启动彩排\n+ 批尾统一重启 16/16 零异常</p></span></div></foreignObject></g></g></g></g></g></svg>