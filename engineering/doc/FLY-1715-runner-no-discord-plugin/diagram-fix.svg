<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">FLY-1715 修复边界</title>
  <desc id="desc">机器级 Discord key 保持不动，只在受控非 Lead spawn 上禁用插件，并剥离继承的身份凭据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d1d1f; }
      .label { font-size: 18px; font-weight: 650; }
      .small { font-size: 15px; }
      .old { fill: #ffe5e3; stroke: #ff3b30; stroke-width: 2; }
      .new { fill: #e3f5e9; stroke: #34c759; stroke-width: 2; }
      .result { fill: #e3eefc; stroke: #007aff; stroke-width: 2; }
      .line { stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="old" x="35" y="35" width="270" height="105" rx="16"/>
  <text class="label" x="170" y="72" text-anchor="middle">修复前</text>
  <text class="small" x="170" y="101" text-anchor="middle">非 Lead 继承机器插件默认与</text>
  <text class="small" x="170" y="124" text-anchor="middle">tmux server 的身份／凭据</text>

  <rect class="new" x="365" y="25" width="285" height="125" rx="16"/>
  <text class="label" x="507" y="61" text-anchor="middle">逐进程 Discord deny</text>
  <text class="small" x="507" y="90" text-anchor="middle">受控非 Lead argv 最后写两 key=false</text>
  <text class="small" x="507" y="114" text-anchor="middle">机器 key 与 Lead argv 均不修改</text>

  <rect class="new" x="365" y="205" width="285" height="125" rx="16"/>
  <text class="label" x="507" y="241" text-anchor="middle">spawn 身份显式化</text>
  <text class="small" x="507" y="270" text-anchor="middle">剥离 6 个 ambient 身份／凭据</text>
  <text class="small" x="507" y="294" text-anchor="middle">从 registry ctx 恢复 runner 身份</text>

  <rect class="result" x="715" y="25" width="250" height="125" rx="16"/>
  <text class="label" x="840" y="61" text-anchor="middle">Discord 隔离</text>
  <text class="small" x="840" y="90" text-anchor="middle">受控非 Lead 无 adapter</text>
  <text class="small" x="840" y="114" text-anchor="middle">Lead gateway 保持在线</text>

  <rect class="result" x="715" y="205" width="250" height="125" rx="16"/>
  <text class="label" x="840" y="241" text-anchor="middle">身份／凭据隔离</text>
  <text class="small" x="840" y="270" text-anchor="middle">runner 不随 tmux server 嵌合</text>
  <text class="small" x="840" y="294" text-anchor="middle">低权限 ingest 维持必需能力</text>

  <line class="line" x1="305" y1="88" x2="355" y2="88"/>
  <line class="line" x1="305" y1="112" x2="355" y2="250"/>
  <line class="line" x1="650" y1="88" x2="705" y2="88"/>
  <line class="line" x1="650" y1="268" x2="705" y2="268"/>

  <rect x="210" y="365" width="580" height="45" rx="12" fill="#fff2d9" stroke="#ff9500" stroke-width="2"/>
  <text class="small" x="500" y="393" text-anchor="middle">禁止动作：翻转 ~/.claude/settings.json 的共享 Discord key</text>
</svg>
