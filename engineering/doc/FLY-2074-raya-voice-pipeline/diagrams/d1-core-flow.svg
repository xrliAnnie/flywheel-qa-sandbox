<svg id="FLY-2074-d1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">Raya 按需语音模式核心流程</title>
  <desc id="d1-desc">从 #raya 精确文字命令，到 desired-state marker、launchd 按需启动，再到现有 Voice Channel 与 Codex realtime 的双向常开音频流。</desc>
  <defs>
    <marker id="d1-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eef2ff;stroke:#6366f1}.good{fill:#ecfdf5;stroke:#10b981}.warn{fill:#fff7ed;stroke:#f97316}.t{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.a{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#d1-arrow)}.dash{stroke-dasharray:8 6}</style>
  </defs>
  <rect width="1400" height="720" rx="24" fill="#fff"/>
  <text x="42" y="48" class="h">按需出现，会话内常开</text>

  <rect x="35" y="82" width="265" height="585" rx="18" class="group"/>
  <text x="58" y="118" class="h">Discord</text>
  <rect x="60" y="150" width="215" height="105" rx="14" class="box accent"/>
  <text x="168" y="185" text-anchor="middle" class="t">#raya 文字频道</text>
  <text x="168" y="215" text-anchor="middle" class="s">“进入语音模式”</text>
  <text x="168" y="239" text-anchor="middle" class="s">启动 / 停止 / 状态行</text>
  <rect x="60" y="455" width="215" height="105" rx="14" class="box good"/>
  <text x="168" y="492" text-anchor="middle" class="t">现有 Voice Channel</text>
  <text x="168" y="522" text-anchor="middle" class="s">不新建专门语音频道</text>
  <text x="168" y="546" text-anchor="middle" class="s">她 ⇄ Raya bot</text>

  <rect x="330" y="82" width="285" height="585" rx="18" class="group"/>
  <text x="353" y="118" class="h">常驻 brain</text>
  <rect x="355" y="150" width="235" height="82" rx="14" class="box"/>
  <text x="473" y="183" text-anchor="middle" class="t">最小 Gateway</text>
  <text x="473" y="211" text-anchor="middle" class="s">精确短语 + allowlist</text>
  <rect x="355" y="282" width="235" height="82" rx="14" class="box accent"/>
  <text x="473" y="315" text-anchor="middle" class="t">voice-mode.requested</text>
  <text x="473" y="343" text-anchor="middle" class="s">0600 原子 desired-state marker</text>
  <rect x="355" y="414" width="235" height="105" rx="14" class="box warn"/>
  <text x="473" y="450" text-anchor="middle" class="t">launchd voice</text>
  <text x="473" y="480" text-anchor="middle" class="s">RunAtLoad=false</text>
  <text x="473" y="504" text-anchor="middle" class="s">exit1 fresh 重拉 · exit0 停住</text>

  <rect x="645" y="82" width="430" height="585" rx="18" class="group"/>
  <text x="668" y="118" class="h">raya-voice 按需会话进程</text>
  <rect x="670" y="150" width="180" height="105" rx="14" class="box good"/>
  <text x="760" y="183" text-anchor="middle" class="t">Discord 腿</text>
  <text x="760" y="211" text-anchor="middle" class="s">收 Opus · 播 PCM</text>
  <text x="760" y="235" text-anchor="middle" class="s">静默也每 20ms 一帧</text>
  <rect x="870" y="150" width="180" height="105" rx="14" class="box accent"/>
  <text x="960" y="183" text-anchor="middle" class="t">Codex 腿</text>
  <text x="960" y="211" text-anchor="middle" class="s">app-server 子进程</text>
  <text x="960" y="235" text-anchor="middle" class="s">realtime v2</text>
  <rect x="670" y="310" width="380" height="105" rx="14" class="box"/>
  <text x="860" y="345" text-anchor="middle" class="t">协调器</text>
  <text x="860" y="375" text-anchor="middle" class="s">三腿健康 · 世代号 · 状态行回执</text>
  <text x="860" y="399" text-anchor="middle" class="s">最后授权人离房 → 清 marker → “我下线了” → exit0</text>
  <rect x="670" y="470" width="380" height="105" rx="14" class="box"/>
  <text x="860" y="505" text-anchor="middle" class="t">证据与指标</text>
  <text x="860" y="535" text-anchor="middle" class="s">threadId · 重启史 · 投递回执</text>
  <text x="860" y="559" text-anchor="middle" class="s">events.jsonl · context-usage.jsonl</text>

  <rect x="1105" y="82" width="260" height="585" rx="18" class="group"/>
  <text x="1128" y="118" class="h">OpenAI</text>
  <rect x="1130" y="150" width="210" height="105" rx="14" class="box accent"/>
  <text x="1235" y="185" text-anchor="middle" class="t">realtime 会话 v2</text>
  <text x="1235" y="215" text-anchor="middle" class="s">听 · 想 · 说</text>
  <text x="1235" y="239" text-anchor="middle" class="s">24k PCM 双向流</text>

  <path d="M275 202 H355" class="a"/>
  <path d="M473 232 V282" class="a"/>
  <path d="M473 364 V414" class="a"/>
  <path d="M590 466 H650" class="a"/>
  <path d="M850 202 H870" class="a"/>
  <path d="M1050 202 H1130" class="a"/>
  <path d="M1130 230 H1055" class="a dash"/>
  <path d="M760 255 V445 H275" class="a"/>
  <path d="M670 352 H300 V245" class="a dash"/>
  <text x="318" y="434" class="s">双向音频</text>
  <text x="316" y="337" class="s">状态行</text>
</svg>
