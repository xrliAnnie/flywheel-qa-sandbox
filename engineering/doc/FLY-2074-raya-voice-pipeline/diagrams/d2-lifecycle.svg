<svg id="FLY-2074-d2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 820" role="img" aria-labelledby="d2-title d2-desc">
  <title id="d2-title">Raya 按需语音生命周期</title>
  <desc id="d2-desc">平常停止，经文字命令启动；正常停止清除 marker 并 exit0，异常时保留 marker 并由 launchd fresh 拉起。</desc>
  <defs>
    <marker id="d2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.state{fill:#fff;stroke:#64748b;stroke-width:2}.start{fill:#f1f5f9}.live{fill:#ecfdf5;stroke:#10b981}.stop{fill:#eef2ff;stroke:#6366f1}.fail{fill:#fff1f2;stroke:#e11d48}.hold{fill:#fff7ed;stroke:#f97316}.t{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.a{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#d2-arrow)}</style>
  </defs>
  <rect width="1220" height="820" rx="24" fill="#fff"/>
  <text x="40" y="48" class="h">按需生命周期：正常停住，异常才重拉</text>
  <circle cx="95" cy="125" r="20" fill="#334155"/>
  <rect x="165" y="90" width="245" height="78" rx="39" class="state stop"/>
  <text x="288" y="136" text-anchor="middle" class="t">平常停止</text>
  <rect x="505" y="90" width="245" height="78" rx="16" class="state start"/>
  <text x="628" y="122" text-anchor="middle" class="t">启动中</text>
  <text x="628" y="148" text-anchor="middle" class="s">核对 voice-mode.requested</text>
  <rect x="845" y="90" width="300" height="78" rx="16" class="state"/>
  <text x="995" y="122" text-anchor="middle" class="t">在房待命</text>
  <text x="995" y="148" text-anchor="middle" class="s">已加入现有 Voice Channel</text>
  <rect x="845" y="275" width="300" height="90" rx="16" class="state"/>
  <text x="995" y="310" text-anchor="middle" class="t">预热</text>
  <text x="995" y="339" text-anchor="middle" class="s">codex + fresh thread/start</text>
  <rect x="845" y="470" width="300" height="90" rx="16" class="state live"/>
  <text x="995" y="505" text-anchor="middle" class="t">在线</text>
  <text x="995" y="534" text-anchor="middle" class="s">听 ⇄ 忙(等待音) ⇄ 说</text>
  <rect x="455" y="470" width="300" height="90" rx="16" class="state stop"/>
  <text x="605" y="505" text-anchor="middle" class="t">正常收尾</text>
  <text x="605" y="534" text-anchor="middle" class="s">清 marker · “我下线了” · exit0</text>
  <rect x="455" y="660" width="300" height="105" rx="16" class="state fail"/>
  <text x="605" y="695" text-anchor="middle" class="t">故障收尾</text>
  <text x="605" y="724" text-anchor="middle" class="s">保留 marker · 断线一行 · exit1</text>
  <text x="605" y="748" text-anchor="middle" class="s">launchd fresh 拉起(记得:否)</text>
  <rect x="70" y="660" width="275" height="105" rx="16" class="state hold"/>
  <text x="208" y="695" text-anchor="middle" class="t">挂起</text>
  <text x="208" y="724" text-anchor="middle" class="s">凭据错误 / 连续崩溃</text>
  <text x="208" y="748" text-anchor="middle" class="s">人工 clear-hold 标记</text>
  <path d="M115 125 H165" class="a"/>
  <path d="M410 129 H505" class="a"/>
  <text x="456" y="102" text-anchor="middle" class="s">#raya “进入语音模式”</text>
  <text x="456" y="123" text-anchor="middle" class="s">写 marker → kickstart</text>
  <path d="M750 129 H845" class="a"/>
  <path d="M995 168 V275" class="a"/>
  <text x="1010" y="229" class="s">授权真人在房</text>
  <path d="M995 365 V470" class="a"/>
  <text x="1010" y="423" class="s">realtime/start 成功</text>
  <path d="M845 515 H755" class="a"/>
  <text x="800" y="486" text-anchor="middle" class="s">最后授权人离房，或</text>
  <text x="800" y="506" text-anchor="middle" class="s">#raya “退出语音模式”</text>
  <path d="M455 515 H350 V168 H288" class="a"/>
  <text x="365" y="360" class="s">exit0 不重拉</text>
  <path d="M995 560 V712 H755" class="a"/>
  <text x="895" y="686" class="s">任一条腿断</text>
  <path d="M605 660 V610 H785 V180 H628 V168" class="a"/>
  <text x="640" y="632" class="s">SuccessfulExit=false</text>
  <path d="M505 155 C400 240 250 410 208 660" class="a"/>
  <path d="M345 712 H420 V250 H845" class="a"/>
</svg>
