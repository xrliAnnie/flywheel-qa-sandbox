3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>runner 出生时\n把『当时的 tmux server 身份』\n存进自己的档案(凭证)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B1-5" transform="translate(510.5, 210)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Bridge 例行对账\n(开机后 + 每小时,不加新闹钟)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B2-7" transform="translate(854.5, 210)"><polygon points="139,0 278,-139 139,-278 0,-139" class="label-container" transform="translate(-138.5, 139)"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>当前 server 身份\n== 凭证记录?</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B3-9" transform="translate(1398.5, 82)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>claude 干活中的行\n自动转 failed + 在 issue 帖子里说明</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B4-11" transform="translate(1398.5, 210)"><rect class="basic label-container" style="" x="-1