<style>

<div class="wrap">
  <p class="eyebrow">FLYWHEEL · LINEAR → TMUX RUNNER</p>
  <h1>超长 issue 描述如何安全送进 tmux runner</h1>
  <p class="subtitle">修复前:任务说明全文直接拼进 tmux 启动命令,整条命令超过约 16KB 就报 command too long,runner 根本起不来。修复后:全文先写进仅本机可读的临时文件,命令里只放文件路径,新窗口内的小脚本再把原文读回来——Claude 收到的任务原文与修复前逐字一致。</p>

        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
