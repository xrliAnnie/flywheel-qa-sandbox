e-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="FLY-1863-d2-flowchart-F-0" data-look="classic" transform="translate(293, 71)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>修复:种子时间改为「相对现在」派生<br />base = 跑测试那一刻的真实时间</p></span></div></foreignObject></g></g><g class="node default" id="FLY-1863-d2-flowchart-G-1" data-look="classic" transform="translate(138, 247)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>租约到期 = base + 1 小时<br />不管哪天跑,到期时间永远在未来</p></span></div></foreignObject></g></g><g class="node default" id="FLY-1863-d2-flowchart-H-3" data-look="classic" transform="translate(138, 423)"><rect class="basic label-container" style="fill:#e8f8ee !important;stroke:#34c759 !important" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>✅ 任何时刻、单跑或在任何分组里跑<br />都自包含地绿</p></span></div></foreignObject></g></g><g class="node default" id="FLY-1863-d2-flowchart-I-5" data-look="classic" transform="translate(448, 247)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>守卫测试:把时钟冻结在任意时刻<br />逐字断言种子产物 = 冻结时刻 ± 精确偏移</p></span></div></foreignObject></g></g><g class="node default" id="FLY-1863-d2-flowchart-J-7" data-look="classic" transform="translate(448, 423)"><rect class="basic label-container" style="fill:#eef4ff !important;stroke:#007aff !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>谁以后再写死绝对日期(2026 或 2099 都一样)<br />这条守卫当场红,不用等引信烧完</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="FLY-1863-d2-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="FLY-1863-d2-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>