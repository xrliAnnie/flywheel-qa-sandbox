://www.w3.org/1999/xhtml"><span style="color:#1d1d1f !important" class="nodeLabel"><p>Ch.3 force-cancel(FLY-1416)<br />一步到位:先把 run 定成终态<br />(引擎立即停止补人)<br />再逐个收掉活着的执行体</p></span></div></foreignObject></g></g><g class="node default step" id="flowchart-CC-1" transform="translate(447.875, 83)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#007aff !important;stroke-width:2px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#1d1d1f !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(29, 29, 31) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1d1d1f !important" class="nodeLabel"><p>Ch.4 close 级联(FLY-1711)<br />运维关掉最后一个执行体时<br />run 一并判终、死预留随之释放<br />(多执行体的 run 绝不误杀)</p></span></div></foreignObject></g></g><g class="node default prim" id="flowchart-SW-2" transform="translate(292.90625, 283)"><rect class="basic label-container" style="fill:#f5f0ff !important;stroke:#af52de !important;stroke-width:2px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#1d1d1f !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(29, 29, 31) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1d1d1f !important" class="nodeLabel"><p>共享兜底:巡检收敛<br />终态 run 里还活着的残留会话<br />逐个收干净(先只列账、后动手)</p></span></div></foreignObject></g></g><g class="node default good" id="flowchart-OK-3" transform="translate(292.90625, 459)"><rect class="basic label-container" style="fill:#f0fff4 !important;stroke:#34c759 !important;stroke-width:2px !important" x="-130" y="-51" width="260" height="102"/><g class="label" style="color:#1d1d1f !important" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div style="color: rgb(29, 29, 31) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1d1d1f !important" class="nodeLabel"><p>✅ 关得掉、死得透<br />新单立刻能开(不再被残留锁死)</p></span></div></foreignObject></g></g></g></g></g></svg>