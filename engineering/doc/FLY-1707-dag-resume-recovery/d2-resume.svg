Bkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>全过</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_Q_GO_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(448, 667)"><g class="label" data-id="L_V_HOLD_0" transform="translate(-32, -12)"><foreignObject width="64" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>任一不过</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default step" id="flowchart-W-0" transform="translate(293, 95)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#007aff !important;stroke-width:2px !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="color:#1d1d1f !important" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div style="color: rgb(29, 29, 31) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1d1d1f !important" class="nodeLabel"><p>平时:每走一步,引擎在同一笔账里<br />给『当前该做的那一步』挂一份恢复凭据<br />(代码锚点 + 输入快照 + 语义指纹)</p></span></div></foreignObject></g></g><g class="node default step" id="flowchart-C-1" transform="translate(293, 259)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#007aff !important;stroke-width:2px !important" x="-111.015625" y="-27" width="222.03125" height="54"/><g class="label" style="color:#1d1d1f !important" transform="translate(-81.015625, -12)"><rect/><foreignObject width="162.03125" height="24"><div style="color: rgb(29, 29, 31) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1d1d1f !important" class="nodeLabel"><p>崩溃 / 重启后重新派单</p></span></div></foreignObject></g></g><g class="node default step" id="flowchart-V-2" transform="translate(293, 483)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#007aff !important;stroke-width:2px !important" x="-130" y="-147" width="260" height="294"/><g class="label" style="color:#1d1d1f !important" transform="translate(-100, -132)"><rect/><foreignObject width="200" height="264"><div style="color: rgb(29, 29, 31) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1d1d1f !important" class="nodeLabel"><p>五道验证(任一不过就不恢复):<br />V1 代码锚点还找得回(双备份)<br />V2 输入没变(issue 正文/反馈)<br />V3 语义没变(模板快照/模型)<br />V4 恢复方式明确<br />V5 旧执行者已被围住(不能再写)</p></span></div></foreignObject></g></g><g class="node default step" id="flowchart-Q-3" transform="translate(138, 779)"><rect class="basic label-container" style="fill:#ffffff !important;stroke:#007aff !important;stroke-width:2px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#1d1d1f !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(29, 29, 31) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1d1d1f !important" class="nodeLabel"><p>有半成品?<br />先原样封存进隔离区(不算『代码变了』)<br />再从代码锚点精确重建工作目录</p></span></div></foreignObject></g></g><g class="node default good" id="flowchart-GO-4" transform="translate(138, 943)"><rect class="basic label-container" style="fill:#f0fff4 !important;stroke:#34c759 !important;stroke-width:2px !important" x="-114.4140625" y="-39" width="228.828125" height="78"/><g class="label" style="color:#1d1d1f !important" transform="translate(-84.4140625, -24)"><rect/><foreignObject width="168.828125" height="48"><div style="color: rgb(29, 29, 31) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1d1d1f !important" class="nodeLabel"><p>✅ 从当前那一步接着跑<br />(做完的步骤不重跑)</p></span></div></foreignObject></g></g><g class="node default hold" id="flowchart-HOLD-5" transform="translate(448, 779)"><rect class="basic label-container" style="fill:#fff8f0 !important;stroke:#ff9500 !important;stroke-width:2px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#1d1d1f !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(29, 29, 31) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1d1d1f !important" class="nodeLabel"><p>❌ 验证不过 → 明确拒绝 + 落账可查<br />给出三条出路:稍后重试 / 返工 / 显式重开<br />绝不悄悄退回第一步</p></span></div></foreignObject></g></g></g></g></g></svg>