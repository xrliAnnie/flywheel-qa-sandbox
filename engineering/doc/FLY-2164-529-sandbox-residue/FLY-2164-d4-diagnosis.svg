ine-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p>✅ 分钟级明确诊断:『基线塌空——<br />换 --issue,或清理沙箱 main 的残留(FLY-2164)』</p></span></div></foreignObject></g></g></g></g></g></svg>