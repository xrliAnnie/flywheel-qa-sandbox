lowchart-D-3" transform="translate(276.84375, 455)"><rect class="basic label-container" style="fill:#fff3e0 !important;stroke:#ff9500 !important;stroke-width:2px !important" x="-180.625" y="-39" width="361.25" height="78"/><g class="label" style="" transform="translate(-150.625, -24)"><rect/><foreignObject width="301.25" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p>FLY-1404 闸 fail-closed(宁可拦下也不放行)<br />『变更区间里没有设计 HTML』</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E-4" transform="translate(276.84375, 583)"><rect class="basic label-container" style="" x="-198.5078125" y="-39" width="397.015625" height="78"/><g class="label" style="" transform="translate(-168.5078125, -24)"><rect/><foreignObject width="337.015625" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p>stub 把死因写进 stub-state 的 fatal 字段后退出<br />→ 工作流节点永远不变 done</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-5" transform="translate(276.84375, 711)"><rect class="basic label-container" style="fill:#ffe5e0 !important;stroke:#ff3b30 !important;stroke-width:2px !important" x="-200.828125" y="-39" width="401.65625" height="78"/><g class="label" style="" transform="translate(-170.828125, -24)"><rect/><foreignObject width="341.65625" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p>🕳 driver(九步校验脚本)只查数据库、不读 fatal<br />静默卡在 step 2,15 分钟后通用超时,看不到真因</p></span></div></foreignObject></g></g></g></g></g></svg>