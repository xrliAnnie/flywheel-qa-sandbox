foreignObject></g></g><g class="node default" id="flowchart-C-5" transform="translate(312, 567)"><rect class="basic label-container" style="" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Linear 侧<br />可选:配了 key 才读<br />活跃 issue 样本 + 最近更新时间<br />没配 ⇒ 明写「未配置,读不到」</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D-7" transform="translate(312, 767)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>summary 文件<br />部署 checkout 里的文件数与日期<br />只是观测,不代表已读未读</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E-9" transform="translate(622, 343)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>派生:最近可观测活动是几天前<br />只用读到的来源,并列出用了哪些</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-15" transform="translate(932, 343)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>静默本身是信号<br />某项目静了 60 天 + 挂着 5 个 open PR<br />而她说过它要紧 ⇒ 这就是可以开口的分岔</p></span></div></foreignObject></g></g></g></g></g></svg>