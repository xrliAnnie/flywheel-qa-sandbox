Object width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>阶段 4<br />稳定 48 小时后<br />删掉全部旧机制(净删除主体)<br />搭车例行部署,0 额外重启</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-RB-9" transform="translate(1301.125, 259)"><rect class="basic label-container" style="fill:#ffebe9 !important;stroke:#ff3b30 !important" x="-114.1953125" y="-51" width="228.390625" height="102"/><g class="label" style="" transform="translate(-84.1953125, -36)"><rect/><foreignObject width="168.390625" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>回滚<br />旧脚本/旧状态全程在盘<br />单个 Lead 可独立回退</p></span></div></foreignObject></g></g></g></g></g></svg>