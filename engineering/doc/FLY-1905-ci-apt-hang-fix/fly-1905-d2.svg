height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>否</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-A-0" transform="translate(293, 47)"><rect class="basic label-container" style="" x="-127.421875" y="-39" width="254.84375" height="78"/><g class="label" style="" transform="translate(-97.421875, -24)"><rect/><foreignObject width="194.84375" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>CI 步骤改为调用统一小脚本<br />scripts/ci-apt-install.sh</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B-1" transform="translate(293, 311)"><polygon points="175,0 350,-175 175,-350 0,-175" class="label-container" transform="translate(-174.5, 175)"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>三重验证(几秒内):<br />①工具在吗?②真实跑一下,动吗?<br />③版本 ≥ 写死在脚本里的最低要求?</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-C-3" transform="translate(138, 683)"><rect class="basic label-container" style="fill:#e8f7ee !important;stroke:#34c759 !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>验证通过才跳过安装 ✅<br />零安装、零联网<br />5/7 台机器从此对软件源故障免疫</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D-5" transform="translate(448, 683)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>明确报出原因,自动补装:<br />跳过最容易卡的 update,<br />只下载缺的那个包<br />+ 每条命令套 2 分钟强制秒表</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-V-7" transform="translate(294.5, 1135)"><polygon points="127,0 254,-127 127,-254 0,-127" class="label-container" transform="translate(-126.5, 127)"/><g class="label" style="" transform="translate(-88, -24)"><rect/><foreignObject width="176" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>复查:用同一套三重验证<br />确认真的能用、版本达标</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E-9" transform="translate(567.5, 883)"><rect class="basic label-container" style="" x="-117.0546875" y="-51" width="234.109375" height="102"/><g class="label" style="" transform="translate(-87.0546875, -36)"><rect/><foreignObject width="174.109375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>换备用软件源<br />(绕开出故障的 Azure 源)<br />再试一次(同样带秒表)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-13" transform="translate(601.5, 1135)"><rect class="basic label-container" style="fill:#fff3e0 !important;stroke:#ff9500 !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>几分钟内明确报错并停止 ❌<br />错误写清卡在哪一步<br />(不再静默烧满 20 分钟)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-15" transform="translate(202.35546875, 1375)"><rect class="basic label-container" style="fill:#e8f7ee !important;stroke:#34c759 !important" x="-58.4140625" y="-27" width="116.828125" height="54"/><g class="label" style="" transform="translate(-28.4140625, -12)"><rect/><foreignObject width="56.828125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>通过 ✅</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-H-17" transform="translate(386.64453125, 1375)"><rect class="basic label-container" style="fill:#fff3e0 !important;stroke:#ff9500 !important" x="-75.875" y="-39" width="151.75" height="78"/><g class="label" style="" transform="translate(-45.875, -24)"><rect/><foreignObject width="91.75" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>报错停止<br />(防止假成功)</p></span></div></foreignObject></g></g></g></g></g></svg>