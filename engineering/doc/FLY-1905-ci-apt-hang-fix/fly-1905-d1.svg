iv></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_H_I_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-A-0" transform="translate(279, 47)"><rect class="basic label-container" style="" x="-108.6640625" y="-39" width="217.328125" height="78"/><g class="label" style="" transform="translate(-78.6640625, -24)"><rect/><foreignObject width="157.328125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>一次 CI 触发<br />(每个 PR push 都会跑)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B-1" transform="translate(279, 187)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>7 台测试机并行开工<br />(5 台单元测试 + 2 台脚本测试)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-C-3" transform="translate(279, 339)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>每台都先跑『装软件』步骤<br />sudo apt-get update &amp;&amp; install</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D-5" transform="translate(279, 491)"><rect class="basic label-container" style="" x="-125.9296875" y="-51" width="251.859375" height="102"/><g class="label" style="" transform="translate(-95.9296875, -36)"><rect/><foreignObject width="191.859375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>apt-get update =<br />向 Azure 的 Ubuntu 软件源<br />拉取 4 份索引清单</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E-7" transform="translate(138, 655)"><rect class="basic label-container" style="fill:#e8f7ee !important;stroke:#34c759 !important" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>30~60 秒装完,继续跑测试 ✅</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-9" transform="translate(420, 655)"><rect class="basic label-container" style="fill:#ffe5e2 !important;stroke:#ff3b30 !important" x="-102" y="-39" width="204" height="78"/><g class="label" style="" transform="translate(-72, -24)"><rect/><foreignObject width="144" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>连接半死不活:<br />不断线、也不给数据</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-11" transform="translate(420, 783)"><rect class="basic label-container" style="fill:#ffe5e2 !important;stroke:#ff3b30 !important" x="-118.0390625" y="-39" width="236.078125" height="78"/><g class="label" style="" transform="translate(-88.0390625, -24)"><rect/><foreignObject width="176.078125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>apt 静默等待 14~18 分钟<br />零输出、不自己退出</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-H-13" transform="translate(420, 911)"><rect class="basic label-container" style="fill:#ffe5e2 !important;stroke:#ff3b30 !important" x="-128.3046875" y="-39" width="256.609375" height="78"/><g class="label" style="" transform="translate(-98.3046875, -24)"><rect/><foreignObject width="196.609375" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>撞上 job 的 15/20 分钟上限<br />被强制杀掉 ❌</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-I-15" transform="translate(420, 1051)"><rect class="basic label-container" style="fill:#fff3e0 !important;stroke:#ff9500 !important" x="-116.2421875" y="-51" width="232.484375" height="102"/><g class="label" style="" transform="translate(-86.2421875, -36)"><rect/><foreignObject width="172.484375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>当天合计:11 个 job 被杀<br />≈187 分钟机器时间白烧<br />4 个 CI 全要人工重跑</p></span></div></foreignObject></g></g></g></g></g></svg>