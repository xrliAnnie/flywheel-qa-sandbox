<svg id="FLY-2121-d1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">FLY-2121 两层注册表</title>
  <desc id="d1-desc">上层列出七个已注册执行节点，下层逐条列出工程开发、轻量开发、产品需求、产品设计、原型验证和通用六条流水线。</desc>
  <style>
    .bg{fill:#fff}.outer{fill:#fbfbfd;stroke:#86868b;stroke-width:2}.node-layer{fill:#e8f0fb;stroke:#007aff;stroke-width:2}.graph-layer{fill:#e8f5ec;stroke:#34c759;stroke-width:2}.guard{fill:#fff4e5;stroke:#ff9500;stroke-width:2}.card{fill:#fff;stroke:#d2d2d7;stroke-width:1.5}.title{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#1d1d1f}.layer-title{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#1a365d}.name{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1d1d1f}.label{font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#515154}.chain{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#515154}.guard-text{font:600 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#7a4a00}
  </style>
  <rect class="bg" width="1000" height="850"/>
  <rect class="outer" x="20" y="20" width="960" height="730" rx="18"/>
  <text class="title" x="48" y="58">registry.yaml — 名字只在这里定义</text>

  <rect class="node-layer" x="45" y="82" width="910" height="260" rx="14"/>
  <text class="layer-title" x="68" y="115">nodes · GraphNode 层（每段工作由谁、按哪本说明书做）</text>
  <g transform="translate(68 135)">
    <g><rect class="card" width="198" height="78" rx="10"/><text class="name" x="14" y="29">eng_design</text><text class="label" x="14" y="55">设计（工程）</text></g>
    <g transform="translate(216 0)"><rect class="card" width="198" height="78" rx="10"/><text class="name" x="14" y="29">implement</text><text class="label" x="14" y="55">实现</text></g>
    <g transform="translate(432 0)"><rect class="card" width="198" height="78" rx="10"/><text class="name" x="14" y="29">qa</text><text class="label" x="14" y="55">QA 验证</text></g>
    <g transform="translate(648 0)"><rect class="card" width="198" height="78" rx="10"/><text class="name" x="14" y="29">product_design</text><text class="label" x="14" y="55">产品设计</text></g>
    <g transform="translate(108 96)"><rect class="card" width="198" height="78" rx="10"/><text class="name" x="14" y="29">pm</text><text class="label" x="14" y="55">产品需求</text></g>
    <g transform="translate(324 96)"><rect class="card" width="198" height="78" rx="10"/><text class="name" x="14" y="29">proto</text><text class="label" x="14" y="55">原型</text></g>
    <g transform="translate(540 96)"><rect class="card" width="198" height="78" rx="10"/><text class="name" x="14" y="29">general</text><text class="label" x="14" y="55">通用执行</text></g>
  </g>

  <rect class="graph-layer" x="45" y="365" width="910" height="360" rx="14"/>
  <text class="layer-title" x="68" y="399">graphs · Graph 层（六条流水线只引用已注册节点）</text>
  <g transform="translate(68 420)">
    <g><rect class="card" width="270" height="125" rx="10"/><text class="name" x="14" y="28">code</text><text class="label" x="14" y="53">工程开发</text><text class="chain" x="14" y="80">eng_design → implement → qa</text><text class="chain" x="14" y="103">→ founder_gate → land</text></g>
    <g transform="translate(288 0)"><rect class="card" width="270" height="125" rx="10"/><text class="name" x="14" y="28">simple_code</text><text class="label" x="14" y="53">轻量开发</text><text class="chain" x="14" y="80">implement → qa</text><text class="chain" x="14" y="103">→ founder_gate → land</text></g>
    <g transform="translate(576 0)"><rect class="card" width="270" height="125" rx="10"/><text class="name" x="14" y="28">prd</text><text class="label" x="14" y="53">产品需求</text><text class="chain" x="14" y="80">pm → founder_gate → land</text><text class="label" x="14" y="105">单节点业务 DAG</text></g>
    <g transform="translate(0 143)"><rect class="card" width="270" height="125" rx="10"/><text class="name" x="14" y="28">product_design_flow</text><text class="label" x="14" y="53">产品设计</text><text class="chain" x="14" y="80">product_design → gate → land</text><text class="label" x="14" y="105">单节点业务 DAG</text></g>
    <g transform="translate(288 143)"><rect class="card" width="270" height="125" rx="10"/><text class="name" x="14" y="28">prototype</text><text class="label" x="14" y="53">原型验证</text><text class="chain" x="14" y="80">proto → founder_gate → land</text><text class="label" x="14" y="105">单节点业务 DAG</text></g>
    <g transform="translate(576 143)"><rect class="card" width="270" height="125" rx="10"/><text class="name" x="14" y="28">generic</text><text class="label" x="14" y="53">通用</text><text class="chain" x="14" y="80">general → founder_gate → land</text></g>
  </g>

  <rect class="guard" x="130" y="775" width="740" height="52" rx="12"/>
  <text class="guard-text" x="500" y="807" text-anchor="middle">loader 硬校验：注册名 = md 文件名 · 未注册引用拒载 · 两层名字全局互斥</text>
</svg>
