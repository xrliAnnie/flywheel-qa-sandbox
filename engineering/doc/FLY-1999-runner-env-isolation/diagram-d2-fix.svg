bject></g></g><g class="edgeLabel"><g class="label" data-id="L_WASH_R_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-SCRUB-0" transform="translate(138, 107)"><rect class="basic label-container" style="fill:#fff4e6 !important;stroke:#ff9500 !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>第三层 · Bridge 开机清扫<br />(治存量)<br />每次启动把 tmux server 里<br />已固化的秘密名/身份名逐个删除<br />(只按名字删,值永不读取)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-BIRTH-1" transform="translate(448, 107)"><rect class="basic label-container" style="fill:#e6f0ff !important;stroke:#007aff !important" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>第二层 · server 出生卫生<br />(防再犯)<br />三个可能'第一个碰 tmux'的位点<br />统一用最小规范环境起 server<br />→ 重启竞赛谁赢都不再带病</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-WASH-2" transform="translate(758, 107)"><rect class="basic label-container" style="fill:#e8f5e9 !important;stroke:#34c759 !important;stroke-width:2px !important" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>第一层 · 窗口白名单重建<br />(核心修)<br />runner 窗口启动前从零重建环境:<br />OS 基底 ∪ 本次显式注入的协议名<br />不在名单 = 不存在</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-R-7" transform="translate(1068, 107)"><rect class="basic label-container" style="fill:#e8f5e9 !important;stroke:#34c759 !important;stroke-width:2px !important" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>新 runner 环境<br />· CODEX_HOME 不存在<br />→ codex 读 ~/.codex → 切号器重新生效<br />· 秘密零下发<br />· 环境集合 = 白名单精确相等,可测试</p></span></div></foreignObject></g></g></g></g></g></svg>