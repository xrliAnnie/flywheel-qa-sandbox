30" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>节点完成合同 = 声明的 + 派生的</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D1-1" transform="translate(138, 375)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>声明的(建图时写死)<br />例:QA 节点要一份 verdict 判定<br />例:要求产出某个文件</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D2-3" transform="translate(448, 375)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>派生的(看实际改了什么)<br />对比上次完成点到现在的真实 diff</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E1-5" transform="translate(304.89453125, 539)"><rect class="basic label-container" style="" x="-108.1796875" y="-51" width="216.359375" height="102"/><g class="label" style="" transform="translate(-78.1796875, -36)"><rect/><foreignObject width="156.359375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>改了产品代码<br />→ 必须有另一族 AI 的<br />逐字节 code review</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E2-7" transform="translate(591.10546875, 539)"><rect class="basic label-container" style="" x="-128.03125" y="-39" width="256.0625" height="78"/><g class="label" style="" transform="translate(-98.03125, -24)"><rect/><foreignObject width="196.0625" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>只改测试 / 只改文档 / 没改<br />→ 不要求 code review</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-9" transform="translate(448, 715)"><rect class="basic label-container" style="fill:#e6f7ec !important;stroke:#34c759 !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>证据齐了?<br />齐:完成状态+证据同一笔账落库<br />不齐:节点保持未完成,发告警</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-12" transform="translate(293, 59)"><rect class="basic label-container" style="fill:#fee !important;stroke:#ff3b30 !important" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>节点叫什么名字(design/implement/qa)<br />完全不参与判断</p></span></div></foreignObject></g></g></g></g></g></svg>