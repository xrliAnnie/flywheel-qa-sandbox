d="L_C_D_0" transform="translate(-68.375, -24)"><foreignObject width="136.75" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>窗口已不在<br />1757 / 1955 / 1961</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(448, 550.328125)"><g class="label" data-id="L_C_F_0" transform="translate(-82.9375, -36)"><foreignObject width="165.875" height="72"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>窗口活着,但内部服务已<br />停跳心跳 5 分钟以上<br />1831 / 1975 / 1944</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_F_G_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_G_I_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_I_J_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-A-0" transform="translate(293, 35)"><rect class="basic label-container" style="" x="-127.40625" y="-27" width="254.8125" height="54"/><g class="label" style="" transform="translate(-97.40625, -12)"><rect/><foreignObject width="194.8125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>PR 合入成功(六单都到这里)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-B-1" transform="translate(293, 151)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>land 收尾:关 runner、清工作副本、归档 thread</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-C-3" transform="translate(293, 364.6640625)"><polygon points="124.6640625,0 249.328125,-124.6640625 124.6640625,-249.328125 0,-124.6640625" class="label-container" transform="translate(-124.1640625, 124.6640625)"/><g class="label" style="" transform="translate(-85.6640625, -24)"><rect/><foreignObject width="171.328125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>关停 Codex 实现容器时:<br />它的终端窗口还在吗?</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D-5" transform="translate(138, 686.328125)"><rect class="basic label-container" style="fill:#e8f8ee !important;stroke:#34c759 !important;stroke-width:2px !important" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>直接收尾,30秒~3分钟<br />✅ thread 自动归档 + Linear Done</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-7" transform="translate(448, 686.328125)"><rect class="basic label-container" style="fill:#ffeceb !important;stroke:#ff3b30 !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>安全规则拒绝强关:<br />『不能证明它死了,就不动它』<br />—— 且没有任何后续升级手段</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-9" transform="translate(448, 874.328125)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>按 1/2/4/8/15/30/60/120 分钟重试 9 次<br />每次撞同一堵墙(状态永远不会自己变好)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-I-11" transform="translate(448, 1038.328125)"><rect class="basic label-container" style="fill:#ffeceb !important;stroke:#ff3b30 !important;stroke-width:2px !important" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>❌ 转『搁置』,机器彻底放手<br />归档/置 Done 一并悬空</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-J-13" transform="translate(448, 1202.328125)"><rect class="basic label-container" style="fill:#fff7e6 !important;stroke:#ff9500 !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>唯一出路 = Lead 人工拆窗口 + 平账 + 恢复<br />1831 等了 8 小时;founder 追问后才发生</p></span></div></foreignObject></g></g></g></g></g></svg>