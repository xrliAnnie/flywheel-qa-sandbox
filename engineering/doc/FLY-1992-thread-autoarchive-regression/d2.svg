; text-align: center;"><span class="nodeLabel"><p>下一遍重试:<br />六道证据全部成立?<br />(动手前逐项复核最新状态)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-D-5" transform="translate(138, 690.75)"><rect class="basic label-container" style="fill:#fff7e6 !important;stroke:#ff9500 !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>维持现状不动手(和今天一样安全)<br />进程身份核不实 → 精确告警给 Lead</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-F-7" transform="translate(448, 690.75)"><rect class="basic label-container" style="fill:#f5f9ff !important;stroke:#007aff !important" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>先落『强拆意图』账<br />(哪怕中途崩溃也能对账,绝不糊涂账)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-G-9" transform="translate(448, 866.75)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>第一步:按进程身份收掉后台服务进程组<br />(先收进程再动窗口 → 不留孤儿进程)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-H-11" transform="translate(448, 1018.75)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>第二步:验明窗口正身(执行体标记)后关窗</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-I-13" transform="translate(448, 1146.75)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>平账 → 收尾在同一遍内继续走完</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-J-15" transform="translate(448, 1298.75)"><rect class="basic label-container" style="fill:#e8f8ee !important;stroke:#34c759 !important;stroke-width:2px !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>✅ thread 自动归档 + Linear Done<br />全程零人工,约 merge 后 3 分钟</p></span></div></foreignObject></g></g></g></g></g></svg>