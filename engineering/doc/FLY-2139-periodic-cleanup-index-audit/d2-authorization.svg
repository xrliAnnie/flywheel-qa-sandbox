 center; width: 200px;"><span class="nodeLabel"><p>founder 设计评审通过<br />(本 issue,一次性授权升级为常设授权)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-P-1" transform="translate(138, 247)"><rect class="basic label-container" style="" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>常设政策文件 standing-policy<br />仓库内固定:可清表族 / 14 天窗<br />单次上限 50 万行 / 单表 30 万行</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-I-2" transform="translate(138, 423)"><rect class="basic label-container" style="" x="-124.140625" y="-39" width="248.28125" height="78"/><g class="label" style="" transform="translate(-94.140625, -24)"><rect/><foreignObject width="188.28125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>首夜只盘点 inventory-only<br />不删任何行,产出候选清单</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-L-3" transform="translate(138, 587)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Lead 审阅首夜清单后<br />手工写入 activation receipt<br />(激活回执,janitor 自己写不了)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-E-4" transform="translate(293, 763)"><rect class="basic label-container" style="" x="-128.03125" y="-51" width="256.0625" height="102"/><g class="label" style="" transform="translate(-98.03125, -36)"><rect/><foreignObject width="196.0625" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>引擎 policy-apply<br />打开数据库前强制校验:<br />回执 + 政策指纹 + 行数上限</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-OK-5" transform="translate(138, 927)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>上限内:备份快照 → 删除 → 留收据<br />(与 FLY-2006 已批流程同一套代码)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-NO-6" transform="translate(448, 927)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>超上限 / 回执失效:<br />零删除 + 告警给 Lead(fail-closed)</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-C-19" transform="translate(448, 587)"><rect class="basic label-container" style="" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>政策 / 名册 / 引擎任一文件被改动<br />→ 指纹失配 → 回执自动失效<br />→ 退回只盘点模式</p></span></div></foreignObject></g></g></g></g></g></svg>