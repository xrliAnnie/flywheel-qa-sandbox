# Deployed through the reviewed main + release-environment activation workflow.
# Signer credentials and capability hashes are Worker secrets; payloads stay private.
name = "flywheel-onboard-endpoint"
main = "src/worker.mjs"
compatibility_date = "2026-07-01"

[vars]
FW_R2_BUCKET = "flywheel-payloads"

[[r2_buckets]]
binding = "PAYLOADS"
bucket_name = "flywheel-payloads"
