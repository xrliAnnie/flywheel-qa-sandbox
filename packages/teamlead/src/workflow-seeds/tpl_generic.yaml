template_id: tpl_generic
name: Generic single-session task
project_scope: global
manifest:
  schema_version: 2
  nodes:
    - id: execute
      type: generic
      vendor: codex
      model: gpt-5.6-sol
      effort: low
      agent_file: agents/generic-executor.md
      # FLY-1467 (05cde232, option C — Annie via Tadashi): the node's output
      # now counts. The "zero-prompt clean session" (dropping agent_file) is
      # blocked here — a generic node must define exactly one of role or
      # agent_file (workflow-template.ts) — so it is folded into the follow-up
      # "capable-generic" node type (option B), alongside the capability opening
      # (shared_branch_writer / creates_pr / completion_route).
      produces_output: true
      output:
        schema: json_v1
        max_bytes: 262144
    - id: founder_gate
      type: gate
    - id: land
      type: land
      execution: engine
  edges:
    - id: execute_done
      from: execute
      to: founder_gate
      condition: node_done
    - id: founder_approved
      from: founder_gate
      to: land
      condition: founder_approved
  loops: []
  approval_gate:
    node: founder_gate
    predicate: founder_approved
  terminal_node:
    node: land
  ship_claims:
    - founder_approved
