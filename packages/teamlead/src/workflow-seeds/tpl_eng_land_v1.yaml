template_id: tpl_eng_land_v1
name: Engineering (tiered) with automated land
project_scope: global
manifest:
  schema_version: 1
  manifest_variant: land_v1
  nodes:
    - id: design
      type: design
      vendor: claude
      model: claude-fable-5
      handoff_pointer: { worktree: true, design_doc: true }
    - id: implement
      type: implement
      vendor: codex
      model: gpt-5.6-sol
      handoff_pointer: { worktree: true, design_doc: true }
    - id: qa
      type: qa
      vendor: claude
      model: claude-opus-4-8
      handoff_pointer: { worktree: true, design_doc: true }
    - id: founder_gate
      type: gate
    - id: land
      type: land
      execution: engine
  edges:
    - { id: design_done, from: design, to: implement, condition: design_done }
    - { id: implement_done, from: implement, to: qa, condition: implement_done }
    - { id: qa_pass, from: qa, to: founder_gate, condition: qa_pass }
    - { id: founder_approved, from: founder_gate, to: land, condition: founder_approved }
  loops:
    - id: qa_retry
      from: qa
      to: implement
      loop_when: qa_fail
      exit_when: qa_pass
      max_iterations: 3
      on_limit: escalate
    - id: founder_feedback
      from: founder_gate
      to: implement
      loop_when: founder_feedback_kickback
      exit_when: founder_approved
      max_iterations: 3
      on_limit: escalate
  approval_gate: { node: founder_gate, predicate: founder_approved }
  terminal_node: { node: land }
  ship_claims: [qa_passed, founder_approved]
  tier_presets:
    heavy:
      reason: eng heavy tier — xhigh implement
      nodes:
        implement: { effort: xhigh }
    light:
      reason: eng light tier — codex design
      nodes:
        design: { vendor: codex, model: gpt-5.6-sol }
    trivial:
      reason: eng trivial tier — codex design + fable QA
      nodes:
        design: { vendor: codex, model: gpt-5.6-sol }
        qa: { model: claude-fable-5 }
