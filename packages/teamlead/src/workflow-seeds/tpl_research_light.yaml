template_id: tpl_research_light
name: Lightweight research artifact
project_scope: global
manifest:
  schema_version: 2
  nodes:
    - id: research
      type: generic
      vendor: codex
      model: gpt-5.6-sol
      effort: low
      agent_file: agents/generic-executor.md
      produces_output: true
      output:
        schema: json_v1
        max_bytes: 262144
    - id: founder_gate
      type: gate
  edges:
    - id: research_done
      from: research
      to: founder_gate
      condition: node_done
  loops: []
  terminal_gate:
    node: founder_gate
    predicate: founder_approved
  ship_claims:
    - founder_approved
