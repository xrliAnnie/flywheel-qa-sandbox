template_id: tpl_product_designer
name: Product designer flow
project_scope: global
manifest:
  schema_version: 2
  nodes:
    - id: design_iterate
      type: generic
      vendor: claude
      model: claude-fable-5
      effort: high
      agent_file: agents/designer-executor.md
      produces_output: true
      output:
        schema: json_v1
        max_bytes: 262144
    - id: review
      type: review
      vendor: codex
      model: gpt-5.6-sol
      effort: xhigh
    - id: founder_gate
      type: gate
    - id: land
      type: land
      execution: engine
  edges:
    - id: design_iterate_done
      from: design_iterate
      to: review
      condition: node_done
    - id: review_passed
      from: review
      to: founder_gate
      condition: review_pass
    - id: founder_approved
      from: founder_gate
      to: land
      condition: founder_approved
  loops:
    - id: review_kickback
      from: review
      to: design_iterate
      loop_when: review_fail
      exit_when: review_pass
      max_iterations: 3
      on_limit: escalate
  approval_gate:
    node: founder_gate
    predicate: founder_approved
  terminal_node:
    node: land
  ship_claims:
    - design_review_approved
    - founder_approved
