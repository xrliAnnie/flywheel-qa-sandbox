template_id: tpl_product_v1
name: Product research and review
project_scope: global
manifest:
  schema_version: 2
  nodes:
    - id: research
      type: generic
      vendor: codex
      model: gpt-5.6-sol
      effort: low
      agent_file: agents/generic-executor.md
    - id: produce
      type: generic
      vendor: codex
      model: gpt-5.6-sol
      effort: high
      agent_file: agents/generic-executor.md
      produces_output: true
      output:
        schema: json_v1
        max_bytes: 262144
    - id: review
      type: review
      vendor: claude
      model: claude-sonnet-4-5
      effort: high
    - id: founder_gate
      type: gate
  edges:
    - id: research_done
      from: research
      to: produce
      condition: node_done
    - id: produce_done
      from: produce
      to: review
      condition: node_done
    - id: review_passed
      from: review
      to: founder_gate
      condition: review_pass
  loops:
    - id: review_kickback
      from: review
      to: produce
      loop_when: review_fail
      exit_when: review_pass
      max_iterations: 3
      on_limit: escalate
  terminal_gate:
    node: founder_gate
    predicate: founder_approved
  ship_claims:
    - design_review_approved
    - founder_approved
