# FLY-260 — read-deny config for a read-only Codex Lead (e.g. Mufasa, a COE Director).
#
# SINGLE SOURCE OF TRUTH for the read-deny config shape. It is appended verbatim by
# `codex-lead-tui-home.sh` when FLYWHEEL_CODEX_LEAD_READ_DENY=1, and asserted by
# `read-deny-profile.test.ts` (the deny keys here must equal READ_DENY_FILESYSTEM_PATHS
# in read-deny-profile.ts; the test also forbids the known-ineffective single-star /
# bare `**/.env` forms and a blanket `~/.flywheel` deny — so this can never silently
# regress into "fake hardening").
#
# WHY each shape — REAL-MACHINE VERIFIED on codex-cli 0.140.0 (see the FLY-260 plan):
#   * NO top-level `sandbox_mode` here. Permission profiles do NOT compose with the
#     legacy sandbox settings: any legacy `sandbox` override (config sandbox_mode, the
#     thread/start `sandbox` param, or the TUI `-s read-only` flag) sets
#     activePermissionProfile=null and DISABLES this whole profile. The runtime omits
#     the thread param and the TUI omits `-s` under the same flag.
#   * `~/.codex*` (single star) does NOT match `~/.codex-mufasa`; bare `**/.env` is
#     rejected by codex. The verified-effective forms are `~/.codex**` and `~/**/.env**`
#     (double-star, recursive); an exact dir/file path denies recursively.
#   * SURGICAL: we do NOT deny `~/.flywheel` as a directory — a COE Director orchestrates
#     through it (comm DB / teamlead.db / bin / state / Bridge). `~/**/.env**` denies the
#     secret `.env*` files inside it (verified) while leaving the operational tree readable.
#   * `[shell_environment_policy].exclude` hides token-shaped env from the MODEL EXEC
#     SHELL (env is a parallel exfil surface: `printenv` would otherwise leak a token even
#     when auth.json is denied). Glob matching is case-INSENSITIVE (verified: `*TOKEN*`
#     also hides `fly260_lower_token`), so UPPER forms suffice. Token-shaped ONLY — NOT a
#     blanket FLYWHEEL_*/DISCORD_* removal — so Director coordination env survives.

default_permissions = "flywheel-lead-secret-deny"
approval_policy = "never"

[shell_environment_policy]
exclude = ["*TOKEN*", "*SECRET*", "*KEY*"]

[permissions.flywheel-lead-secret-deny]
extends = ":read-only"

[permissions.flywheel-lead-secret-deny.filesystem]
"~/.codex**" = "deny"
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.config/gh" = "deny"
"~/.config/gcloud" = "deny"
"~/.npmrc" = "deny"
"~/.docker" = "deny"
"~/**/.env**" = "deny"
# Absent on the current host (names-only inventory; add a `"<path>" = "deny"` line if any
# appears): ~/.netrc  ~/.git-credentials  ~/.kube/config  ~/.gnupg  ~/.pgpass  ~/.gem/credentials
