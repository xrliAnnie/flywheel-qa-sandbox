<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flywheel 管理台</title>
<style>
  :root{
    /* cool-slate neutrals — a considered grey with a faint indigo bias, not default mid-grey */
    --bg:#eef0f4; --paper:#fff; --nav:#f7f8fb; --ink:#191b22; --dim:#656a75; --faint:#9aa0ac;
    --line:#e4e6ec; --line2:#d0d3dc; --soft:#eff1f5;
    /* one brand/focal accent — indigo-violet (the flywheel ◆), used for every "where am I" cue */
    --blue:#5646d6; --blue-soft:#ecebfb; --blue-line:#d3cff4;
    /* semantic status — functional signals, kept distinct from the brand accent */
    --green:#1f9d47; --purple:#7b40d6; --amber:#e8850c; --teal:#0b95ab; --red:#d1382b;
    --info:#1160c9; --info-soft:#e9f1fe; --info-line:#c8ddfb;
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    --mono:'SF Mono',ui-monospace,Menlo,monospace;
    --shadow:0 1px 2px rgba(24,27,40,.05),0 8px 26px rgba(24,27,40,.06);
  }
  /* deliberately single-theme: a light ops-console viewed on localhost; the many
     status-signal colors (green/amber/red pills, the 原型 band) are the point. */
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px;min-height:100vh;display:flex;flex-direction:column;}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;}
  header h1{font-size:1.5rem;margin:0;letter-spacing:-.02em;font-weight:700;}
  header h1 .hdia{color:var(--blue);}
  .protopill{font-size:.64rem;font-weight:600;color:var(--dim);background:var(--soft);border:1px solid var(--line2);
    border-radius:999px;padding:2px 9px;white-space:nowrap;margin-left:auto;cursor:help;letter-spacing:.02em;}

  .frame{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column;min-height:0;}
  .barw{display:flex;align-items:center;gap:7px;padding:9px 14px;background:#f6f6f8;border-bottom:1px solid var(--line);}
  .barw .d{width:11px;height:11px;border-radius:50%;} .barw .r{background:#ff5f57;}.barw .y{background:#febc2e;}.barw .g{background:#28c840;}
  .barw .u{margin-left:8px;font-family:var(--mono);font-size:.73rem;color:var(--dim);background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 10px;}
  .barw .ap{margin-left:auto;font-size:.75rem;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:3px 10px;}

  .app{display:grid;grid-template-columns:158px 1fr;min-height:580px;flex:1;min-height:0;}
  .side{background:var(--nav);border-right:1px solid var(--line);padding:14px 9px;}
  .brand{font-weight:750;font-size:.92rem;padding:2px 8px 14px;letter-spacing:-.01em;} .brand .fw{color:var(--blue);}
  .nv{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:8px;font-size:.86rem;font-weight:560;color:var(--dim);margin-bottom:3px;cursor:pointer;user-select:none;border-left:3px solid transparent;transition:background .12s;}
  .nv:hover{background:var(--soft);color:var(--ink);}
  .nv.sel{background:var(--blue-soft);color:var(--blue);font-weight:700;border-left-color:var(--blue);}
  .nv.sel:hover{background:var(--blue-soft);}

  .main{overflow:auto;}
  .page{display:none;} .page.on{display:block;animation:fade .2s;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .page-instance.on{display:grid;grid-template-columns:210px 1fr;}

  .list{border-right:1px solid var(--line);padding:9px 8px;overflow:auto;}
  .lh{font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px 6px;font-family:var(--mono);}
  .psearch{width:100%;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:.82rem;font-family:var(--sans);margin-bottom:8px;background:#fff;color:var(--ink);}
  .psearch:focus{outline:none;border-color:var(--blue-line);box-shadow:0 0 0 3px var(--blue-soft);}
  .li{padding:8px 11px 8px 12px;border-radius:8px;font-size:.9rem;font-weight:560;margin-bottom:3px;display:flex;align-items:center;gap:8px;cursor:pointer;border-left:3px solid transparent;transition:background .12s;}
  .li:hover{background:var(--soft);} .li .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 3px rgba(31,157,71,.13);}
  .li .c{margin-left:auto;font-size:.7rem;color:var(--dim);font-family:var(--mono);background:var(--soft);border-radius:10px;padding:1px 7px;font-variant-numeric:tabular-nums;}
  .li.sel{background:var(--blue-soft);color:var(--blue);font-weight:700;border-left-color:var(--blue);} .li.sel:hover{background:var(--blue-soft);}
  .li.sel .c{background:#fff;color:var(--blue);}
  .li .nm-hl{background:#fff3b0;border-radius:3px;} .empty{font-size:.8rem;color:var(--faint);padding:12px 8px;font-style:italic;}
  .li .gicon{font-size:.78rem;flex:none;width:7px;display:inline-flex;justify-content:center;} .li.ligroup{border-left-color:var(--line2);}
  .li .gtag{font-size:.56rem;font-weight:700;color:var(--dim);background:var(--soft);border:1px solid var(--line2);border-radius:4px;padding:0 5px;letter-spacing:.03em;margin-left:2px;}
  .li.ligroup.sel .gtag{background:#fff;color:var(--blue);border-color:var(--blue-line);}
  /* low-key source link — real GitHub blob link (verified) or path-hover fallback */
  .srclink{font-size:.66rem;font-weight:600;color:var(--blue);text-decoration:none;border:1px solid var(--blue-line);background:var(--blue-soft);border-radius:5px;padding:1px 6px;white-space:nowrap;display:inline-flex;align-items:center;gap:2px;cursor:pointer;}
  .srclink:hover{background:var(--paper);text-decoration:underline;} .srclink .ghi{font-weight:700;}
  .srclink.pathonly{color:var(--dim);background:var(--soft);border-color:var(--line2);cursor:help;text-decoration:none;}
  .tpl-hd .srclink,.cronhd .srclink{margin-left:2px;}

  .detail{padding:16px 19px;overflow:auto;}
  .dh{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;flex-wrap:wrap;}
  .dh .pn{font-weight:720;font-size:1.32rem;letter-spacing:-.015em;} .dh .pm{color:var(--dim);font-size:.76rem;font-family:var(--mono);}
  .dtabs{display:flex;gap:3px;border-bottom:1.5px solid var(--line);margin:12px 0 16px;}
  .dtab{padding:8px 14px;font-size:.85rem;color:var(--dim);border-bottom:2.5px solid transparent;font-weight:600;cursor:pointer;margin-bottom:-1.5px;transition:color .12s;}
  .dtab.on{color:var(--blue);border-bottom-color:var(--blue);} .dtab:hover:not(.on){color:var(--ink);}
  .pane{display:none;} .pane.on{display:block;animation:fade .2s;}

  .cascade{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.77rem;color:#54555c;background:#fbfbfd;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px;}
  .cascade .lvl{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px;} .cascade .arr{color:var(--faint);}
  .rowh{font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:18px 0 7px;font-family:var(--mono);display:flex;align-items:center;gap:7px;}
  .rowh::before{content:"";width:3px;height:11px;background:var(--blue);border-radius:2px;opacity:.55;}
  .rowh:first-child{margin-top:2px;}
  .lrow{display:flex;align-items:center;gap:9px;font-size:.85rem;padding:9px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .lrow:last-child{border-bottom:none;} .lrow .nm{font-weight:640;font-size:.9rem;min-width:150px;font-family:var(--mono);letter-spacing:-.01em;} .lrow .lbl{color:var(--dim);font-size:.73rem;}
  .lrow.ghost{opacity:.5;font-style:italic;}
  .dot2{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px rgba(31,157,71,.15);flex:none;}
  .dept{font-size:.63rem;font-weight:600;background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-line);border-radius:5px;padding:1px 7px;font-family:var(--mono);letter-spacing:.02em;}

  /* 改A: 固定宽度,选长值不 reflow */
  .casc3{display:inline-flex;gap:6px;align-items:center;margin-left:auto;position:relative;}
  .casc{font-family:var(--mono);font-size:.73rem;border:1px solid var(--line2);border-radius:6px;padding:4px 7px;background:#fff;color:#1d1d1f;cursor:pointer;}
  .casc-vendor{color:#7b40d6;font-weight:600;border-color:#e0d4ff;background:#faf7ff;width:150px;}
  .casc-model{color:#0a63c9;font-weight:600;width:170px;} .casc-effort{color:#54555c;width:96px;}
  /* 改B: dirty 高亮 + 待提交 */
  .casc3.dirty .casc{border-color:var(--amber);background:#fff9ec;} .casc3.dirty .casc-vendor{background:#fff4e0;}
  .casc3.dirty::after{content:"● 待提交 ↓";position:absolute;top:-10px;right:2px;font-size:.56rem;color:var(--amber);font-weight:700;background:var(--paper);padding:0 3px;border-radius:3px;white-space:nowrap;}
  .savebar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(180%);min-width:340px;max-width:min(680px,92vw);background:linear-gradient(135deg,#221c17,#33291f);color:#fff;border:2px solid var(--amber);border-radius:15px;padding:15px 16px 15px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 44px rgba(0,0,0,.42);z-index:9999;font-size:.98rem;visibility:hidden;transition:transform .36s cubic-bezier(.2,.9,.3,1.35);}
  .savebar.on{transform:translateX(-50%) translateY(0);visibility:visible;}
  .savebar .up{font-size:1.35rem;line-height:1;} .savebar .sp{flex:1;}
  .savebar .n{font-weight:600;white-space:nowrap;} .savebar .n b{color:var(--amber);font-size:1.2rem;padding:0 2px;}
  .savebar button{border:none;border-radius:10px;padding:11px 24px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;}
  .savebar .submit{background:var(--amber);color:#1d1d1f;box-shadow:0 2px 10px rgba(255,149,0,.5);}
  .savebar .discard{background:#3a3a3c;color:#e5e5e7;padding:11px 16px;}
  @keyframes barbump{0%{box-shadow:0 14px 44px rgba(0,0,0,.42);}45%{box-shadow:0 16px 58px rgba(255,149,0,.72);}100%{box-shadow:0 14px 44px rgba(0,0,0,.42);}}
  .savebar.bump{animation:barbump .62s ease;}
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .ovl.on{display:flex;} .modal{background:#fff;border-radius:14px;padding:20px 22px;max-width:600px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h3{margin:0 0 4px;font-size:1.05rem;} .modal .msub{color:var(--dim);font-size:.84rem;margin:0 0 14px;}
  .chg{display:flex;gap:10px;font-size:.82rem;padding:8px 0;border-bottom:1px dashed var(--line);align-items:baseline;flex-wrap:wrap;}
  .chg:last-of-type{border-bottom:none;} .chg .who{font-weight:600;min-width:180px;font-family:var(--mono);font-size:.75rem;}
  .chg .ft .o{color:var(--faint);text-decoration:line-through;} .chg .ft .arr{color:var(--faint);margin:0 5px;} .chg .ft .nw{color:#0a63c9;font-weight:600;}
  .mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;} .mbtns button{border:none;border-radius:8px;padding:8px 16px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;}
  .mbtns .ok{background:var(--blue);color:#fff;} .mbtns .cancel{background:var(--soft);color:#46474e;}
  .staged{background:#eafaf0;border:1px solid #bfe6cb;color:#1f7a3f;border-radius:9px;padding:11px 13px;font-size:.85rem;margin-top:4px;line-height:1.5;}

  /* DAG templates */
  .tpl{border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:11px;padding:13px 15px;margin-bottom:11px;background:var(--paper);box-shadow:0 1px 2px rgba(24,27,40,.03);}
  .tpl.tpl3{border-left-color:var(--blue);background:linear-gradient(180deg,var(--blue-soft) 0%,var(--paper) 44px);}
  .tpl-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px;}
  .tpl-n{font-family:var(--mono);font-weight:720;font-size:.98rem;letter-spacing:-.01em;} .tpl-badge{font-size:.66rem;font-weight:700;letter-spacing:.02em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:999px;padding:2px 9px;}
  .tpl-badge.single{color:#8a5a00;background:#fff6e6;border-color:#ffe0a6;}
  .tpl-badge.def{color:var(--dim);background:var(--soft);border-color:var(--line2);}
  .tpl.tpldef{border-left-style:dashed;background:var(--nav);}
  .cronrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:#fff;}
  .cronhd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .cronsrc{font-family:var(--mono);font-size:.66rem;color:var(--dim);margin-top:7px;word-break:break-all;background:#fafafb;border-radius:6px;padding:5px 8px;}
  .cronbadge{font-size:.64rem;font-weight:700;border-radius:5px;padding:2px 7px;font-family:var(--mono);white-space:nowrap;}
  .cronbadge.on{color:#1f8a3f;background:#e7f6ec;border:1px solid #bfe6cb;}
  .cronbadge.stale{color:#c0392b;background:#fdecea;border:1px solid #f5c6cb;}
  .cronbadge.paused{color:#8a5a00;background:#fff6e6;border:1px solid #ffe0a6;}
  /* cron schedule picker v2: 7 星期多选钮 + 派生标签 + 多时间行 */
  .cronsched{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);}
  .cronpick2{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;border:1px solid transparent;border-radius:8px;padding:3px 4px;}
  .cronpick2.dirty{border-color:var(--amber);background:#fff9ec;}
  .daybtns{display:inline-flex;gap:3px;}
  .daybtn{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:700;
    border:1px solid var(--line2);border-radius:7px;background:var(--paper);color:var(--dim);cursor:pointer;user-select:none;transition:all .12s;}
  .daybtn:hover{border-color:var(--blue-line);color:var(--ink);}
  .daybtn.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 1px 4px rgba(86,70,214,.32);}
  .daylabel{font-size:.68rem;font-weight:700;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue-line);
    border-radius:999px;padding:2px 9px;font-family:var(--mono);white-space:nowrap;}
  .timerows{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .timerow{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:2px 4px;}
  .deltime{margin-left:3px;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
    font-size:.72rem;font-weight:700;color:var(--dim);background:var(--paper);border:1px solid var(--line2);cursor:pointer;}
  .deltime:hover{color:#fff;background:var(--red);border-color:var(--red);}
  .addtime{font-size:.68rem;font-weight:700;color:var(--blue);background:var(--blue-soft);border:1px dashed var(--blue-line);
    border-radius:7px;padding:3px 9px;cursor:pointer;white-space:nowrap;}
  .addtime:hover{background:var(--paper);border-style:solid;}
  .cronsel{font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:3px 5px;background:var(--paper);cursor:pointer;}
  .cronsel:focus{outline:none;border-color:var(--blue-line);box-shadow:0 0 0 2px var(--blue-soft);}
  .cronpick .colon{color:var(--dim);font-weight:700;margin:0 -1px;}
  .cronen{margin-left:2px;} .cronrow.cronoff{opacity:.62;background:var(--soft);} .cronrow.cronoff .cronsch{background:var(--soft);}
  .tabc{font-size:.6rem;background:var(--soft);border-radius:8px;padding:0 5px;margin-left:4px;color:var(--dim);}
  .cronfact{margin-top:7px;font-size:.72rem;line-height:1.5;color:#8a5a00;background:#fff8ec;border:1px solid #ffe0a6;border-left:3px solid var(--amber);border-radius:6px;padding:7px 10px;}
  .tpl-flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
  .tnode{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line2);border-radius:8px;padding:4px 9px;font-size:.78rem;font-weight:600;background:#fff;}
  .tarr{color:var(--faint);} .tann{font-size:.72rem;color:var(--amber);font-weight:600;margin-bottom:9px;}
  .tann.single{color:var(--dim);}
  .tnrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px dashed var(--line);flex-wrap:wrap;}
  .tnrow .tnn{font-weight:560;min-width:130px;font-size:.84rem;}
  .discreal{font-size:.73rem;color:var(--dim);background:#fbfbfd;border:1px dashed var(--line2);border-radius:8px;padding:8px 11px;margin-top:6px;line-height:1.5;}

  /* flags */
  .fgrp{margin-bottom:22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);box-shadow:0 1px 2px rgba(24,27,40,.03);}
  .fgrp-h{font-size:.82rem;font-weight:720;color:var(--ink);margin:0;padding:10px 14px;background:var(--nav);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:1;}
  .fgrp-h .cnt{font-size:.66rem;color:var(--dim);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .fr{display:flex;align-items:center;gap:12px;font-size:.82rem;padding:9px 14px;border-bottom:1px solid var(--line);}
  .fr:last-child{border-bottom:none;} .fr:hover{background:var(--nav);} .fr .fn{font-family:var(--mono);font-size:.76rem;font-weight:640;color:var(--ink);min-width:290px;flex:none;letter-spacing:-.01em;}
  .fr .fdesc{color:var(--dim);font-size:.75rem;flex:1;min-width:120px;line-height:1.45;} .fr .fc{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;}
  .fovr{font-size:.65rem;color:#c02e60;background:#fff1f5;border:1px solid #ffd0e0;border-radius:5px;padding:1px 6px;white-space:nowrap;}
  .pill.fdirty{outline:2px solid var(--amber);outline-offset:1px;}
  .fr .fc{margin-left:auto;} .pill{font-family:var(--mono);font-size:.69rem;border-radius:999px;padding:2px 9px;font-weight:600;}
  .pill.on{background:#e7f6ec;color:#1f8a3f;border:1px solid #bfe6cb;} .pill.off{background:var(--soft);color:var(--dim);border:1px solid var(--line);}
  .pill.val{background:#eef4ff;color:#0a63c9;border:1px solid var(--blue-line);} .pill.ovr{background:#fff1f5;color:#c02e60;border:1px solid #ffd0e0;}
  .tog{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;background:#fff;cursor:pointer;}
  .rotag{font-size:.63rem;color:var(--faint);font-family:var(--mono);}
  /* FLY-1038 Feature Flags v3: unified toggle / enum / value controls */
  .tgl{width:40px;height:23px;border-radius:12px;background:#cfcfd4;position:relative;cursor:pointer;transition:background .18s;flex:none;display:inline-block;vertical-align:middle;}
  .tgl.on{background:#34c759;}
  .tgl::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.28);}
  .tgl.on::after{transform:translateX(17px);}
  .tgl.locked{background:#dcdce1;cursor:not-allowed;} .tgl.locked.on{background:#a9d9b4;}
  .tgl.dirty{outline:2px solid var(--amber);outline-offset:2px;}
  .lk{font-size:.82rem;}
  .segd{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .segd .seg{font-family:var(--mono);font-size:.65rem;padding:3px 8px;color:var(--dim);background:#fafafb;border-right:1px solid var(--line);}
  .segd .seg:last-child{border-right:none;} .segd .seg.on{background:#1d1d1f;color:#fff;font-weight:700;}
  .fval{font-family:var(--mono);font-size:.7rem;color:#0a63c9;background:#eef4ff;border:1px solid var(--blue-line);border-radius:6px;padding:2px 9px;}
  .fr.fsub{padding-left:24px;background:#fbfbfc;} .fr.fsub .fn{color:#8a5a00;min-width:266px;font-size:.71rem;}

  .pgpad{padding:16px 20px;} .pgh{font-size:1.06rem;font-weight:640;margin:0 0 3px;} .pgd{color:var(--dim);font-size:.86rem;margin:0 0 14px;}

  function dayStr(days){ var s=days.slice().sort(function(a,b){return a-b;});
    if(!s.length) return "（未选星期）"; if(s.length===7) return "每日"; if(s.length===5&&s.join()==="0,1,2,3,4") return "工作日"; if(s.length===2&&s.join()==="5,6") return "周末";
    return "周"+s.map(function(i){return DAY_LABELS[i];}).join("/"); }
  function schStr(days,times){ return dayStr(days)+" "+times.map(function(t){return t.hh+":"+t.mm;}).join(" + "); }
  function cronBySchcid(schcid){ var parts=schcid.split(":"); var pr=projByName(parts[1]); for(var i=0;i<pr.cron.length;i++){ if(pr.cron[i].t===parts[2]) return pr.cron[i]; } return null; }
  function cronRecompute(schcid){ var c=cronBySchcid(schcid); if(!c) return; var e=cronEdit(schcid,c);
    var origStr=schStr(c.days,c.times), newStr=schStr(e.days,e.times);
    if(newStr!==origStr) PENDING[schcid]={label:c.t+" 时间",from:origStr,to:newStr,type:"cronsch"}; else delete PENDING[schcid]; updateBar(); }
  function cronPicker(schcid,c){
    var e=cronEdit(schcid,c), dirty=!!PENDING[schcid];
    var h='<span class="cronpick2'+(dirty?" dirty":"")+'"><span class="daybtns">';
    for(var i=0;i<7;i++){ var on=e.days.indexOf(i)>=0; h+='<span class="daybtn'+(on?" on":"")+'" data-cronday="'+esc(schcid)+':'+i+'">'+DAY_LABELS[i]+'</span>'; }
    h+='</span><span class="daylabel">'+esc(dayLabel(e.days))+'</span><span class="timerows">';
    var hh=[],mm=[]; for(var a=0;a<24;a++)hh.push(("0"+a).slice(-2)); for(var b2=0;b2<60;b2++)mm.push(("0"+b2).slice(-2));
    e.times.forEach(function(t,ti){
      h+='<span class="timerow"><select class="cronsel ch" data-crontime="'+esc(schcid)+':'+ti+'">'+opts(hh,function(x){return x;},t.hh)+'</select>'
        +'<span class="colon">:</span><select class="cronsel cm" data-crontime="'+esc(schcid)+':'+ti+'">'+opts(mm,function(x){return x;},t.mm)+'</select>'
        +(e.times.length>1?'<span class="deltime" data-crondeltime="'+esc(schcid)+':'+ti+'" title="删除这个时间">×</span>':'')+'</span>';
    });
    h+='<span class="addtime" data-cronaddtime="'+esc(schcid)+'">+ 加时间</span></span></span>';
    return h;
  }
  function cronPane(p){
    var h='<div class="discreal">launchd 定时任务（真实来源 = plist + 脚本路径，逐个在 <b>launchctl list</b> 里核过是否真在调度）。星期多选 + 一天可多次(＋加时间);每个可 enable/disable;改动进底部『待提交』;有 LLM 的可改模型。</div>';
    if(p.cronNote) h+='<div class="discreal">'+p.cronNote+'</div>';
    p.cron.forEach(function(c){
      var encid="cronen:"+p.name+":"+c.t, schcid="cronsch:"+p.name+":"+c.t;
      var enabled=cronEnabled(encid, c.active?"ON":"OFF");
      var badge = enabled
        ? '<span class="cronbadge on">● active · launchd</span>'
        : '<span class="cronbadge paused">⏸ 已暂停 · 待提交</span>';
      h+='<div class="cronrow'+(enabled?"":" cronoff")+'"><div class="cronhd"><span class="nm">'+esc(c.t)+'</span>'
        +'<span class="lbl">'+esc(c.note)+'</span>'+badge
        +'<span class="cronen">'+tgl(encid, c.active?"ON":"OFF", c.t+" 启用", false)+'</span>'
        +(c.model?cascade("cron:"+p.name+":"+c.t, c.t+" cron", c.model.v,c.model.m,c.model.e):'<span class="pill off">无 LLM</span>')
        +srcLink(c.src+(c.plist?'（plist: '+c.plist+'）':''))+'</div>'
        +'<div class="cronsched">'+cronPicker(schcid,c)+'</div></div>';
    });
    return h;
  }
  // real GitHub blob link else path-hover fallback。别编:只对真有 github remote 的 5 个 repo(逐个 git 核过 .md/脚本在 origin/main)给链接;
  // personal-assistant 无 git remote(纯本地)→ 绝不给会 404 的假链接,回退路径 hover。
  var GH_REPOS={flywheel:1,GeoForge3D:1,growth:1,"joycon-typeless":1,"tidal-echo":1};
  function srcLink(src){
    if(!src) return '';
    var clean=String(src).replace(/（[^）]*）\s*$/,"").trim(), ann=(String(src).match(/（[^）]*）\s*$/)||[""])[0];
    var m=clean.match(/^~\/Dev\/([^/]+)\/(.+)$/);
    if(m && GH_REPOS[m[1]]){
      var href="https://github.com/xrliAnnie/"+m[1]+"/blob/main/"+m[2];
      return '<a class="srclink" href="'+esc(href)+'" target="_blank" rel="noopener" title="'+esc(clean)+ann+'"><span class="ghi">↗</span>源</a>';
    }
    return '<span class="srclink pathonly" title="'+esc(clean)+ann+'（本地路径 · 无 github remote）">📄 源</span>';
  }
  function tnode(n){ return '<span class="tnode">'+esc(n)+'</span>'; }
  function dagPane(p){
    if(!p.dag||!p.dag.length) return '<div class="discreal">此项目暂无角色。</div>';
    var h='<div class="discreal">读自 <b>'+esc(p.name)+'/.flywheel/agents/</b> 的真实角色。每个角色 = 一个 md 一次单 session 做完;<b>三段式(design→implement→qa)只有 flywheel 的 engineer</b>。每个角色/阶段可改模型。</div>';
    p.dag.forEach(function(t,ti){
      var key=p.name+":"+ti;
      h+='<div class="tpl'+(t.isDef?" tpldef":"")+(!t.single?" tpl3":"")+'"><div class="tpl-hd"><span class="tpl-n">'+esc(t.title)+'</span><span class="tpl-badge'+(t.single?" single":"")+(t.isDef?" def":"")+'">'+esc(t.badge)+'</span>'+(t.src?srcLink(t.src):'')+'</div>';
      h+='<div class="tpl-flow">';
      t.nodes.forEach(function(nd,i){ h+=tnode(nd.n)+(i<t.nodes.length-1?'<span class="tarr">→</span>':''); });
      h+='</div>';
      if(t.ann) h+='<div class="tann'+(t.annCls?" "+t.annCls:"")+'">'+esc(t.ann)+'</div>';
      t.nodes.forEach(function(nd){
        h+='<div class="tnrow"><span class="tnn">'+esc(nd.n)+'</span>'+cascade("dag:"+key+":"+esc(nd.n), t.title+" · "+nd.n, nd.v,nd.m,nd.e)+'</div>';
      });
      h+='</div>';
    });
    return h;
  }
  function projFlagsPane(p){
    var GLOBAL=[["qa.auto","OFF"],["doc_flow.enabled","OFF"],["skills.proofshot.enabled","OFF"],["xiaohongshu_learning.enabled","OFF"]];
    var ovr={}; p.flags.forEach(function(f){ ovr[f.f]=f; });
    var h='<div class="fgrp"><div class="fgrp-h">本项目 flag(继承全局默认,可覆盖)</div>';
    GLOBAL.forEach(function(g){
      var o=ovr[g[0]];
      if(o) h+='<div class="fr"><span class="fn">'+esc(g[0])+'</span><span class="pill ovr fc">本项目覆盖:'+esc(o.v)+' ⭐</span><span class="tog">改回继承</span></div>';
      else h+='<div class="fr"><span class="fn">'+esc(g[0])+'</span><span class="pill val fc">继承全局:'+esc(g[1])+'</span><span class="tog">覆盖本项目</span></div>';
    });
    h+='</div>';
    return h;
  }
  function renderDetail(){
    var p=projByName(sel); curProj=p;
    var threeStage=p.dag&&p.dag.some(function(t){return !t.single;});
    var meta=p.isGroup ? ('· '+p.leads.length+' 个 Lead · 按 dept 归组') : ('· '+p.leads.length+' 个 Lead · '+(p.dag?p.dag.length:0)+' 角色'+(threeStage?' · engineer 三段式':''));
    var h='<div class="dh"><span class="pn">'+esc(p.name)+'</span><span class="pm">'+meta+'</span></div>';
    var hasCron=p.cron&&p.cron.length, hasDag=!p.isGroup;
    if(curTab==="f"||(curTab==="c"&&!hasCron)||(curTab==="d"&&!hasDag)) curTab="m";
    h+='<div class="dtabs"><span class="dtab'+(curTab==="m"?" on":"")+'" data-tab="m">模型</span>'
      +(hasDag?'<span class="dtab'+(curTab==="d"?" on":"")+'" data-tab="d">DAG 模板</span>':'')
      +(hasCron?'<span class="dtab'+(curTab==="c"?" on":"")+'" data-tab="c">⏰ 定时任务<span class="tabc">'+p.cron.length+'</span></span>':'')+'</div>';
    h+='<div class="pane'+(curTab==="m"?" on":"")+'" data-pane="m">'+modelPane(p)+'</div>';
    if(hasDag) h+='<div class="pane'+(curTab==="d"?" on":"")+'" data-pane="d">'+dagPane(p)+'</div>';
    if(hasCron) h+='<div class="pane'+(curTab==="c"?" on":"")+'" data-pane="c">'+cronPane(p)+'</div>';
    document.getElementById("pdetail").innerHTML=h;
  }

  function boolState(cid,orig){ if(PENDING[cid]) return PENDING[cid].to; if(STAGED[cid]!==undefined&&STAGED[cid]!==null) return STAGED[cid]; return orig; }
  function tgl(cid,orig,label,locked){
    var on=boolState(cid,orig)==="ON"; var dirty=!!PENDING[cid];
    var cls="tgl"+(on?" on":"")+(locked?" locked":"")+(dirty?" dirty":"");
    var attrs=locked?'':' data-tgl="'+esc(cid)+'" data-orig="'+esc(orig)+'" data-flabel="'+esc(label)+'" style="cursor:pointer"';
    return '<span class="'+cls+'"'+attrs+'></span>';
  }
  function flagCtl(fl,g){
    if(fl.kind==="bool"){ return (g.gate?'<span class="lk">🔒</span>':'')+tgl("flag:"+fl.f,fl.s,fl.f,g.gate); }
    if(fl.kind==="enum"){
      var segs=(fl.enums||[fl.s]).map(function(v){ return '<span class="seg'+(v===fl.s?" on":"")+'">'+esc(v)+'</span>'; }).join("");
      return (g.gate?'<span class="lk">🔒</span>':'')+'<span class="segd">'+segs+'</span>';
    }
    return '<span class="fval">'+esc(fl.s)+'</span>';
  }
  function flagsPage(){
    var h='<div class="pgpad"><h2 class="pgh">🚩 Feature Flags</h2>';
    FLAG_GROUPS.forEach(function(g){
      h+='<div class="fgrp"><div class="fgrp-h">'+esc(g.h)+'<span class="cnt">'+g.flags.length+'</span></div>';
      g.flags.forEach(function(fl){
        h+='<div class="fr"><span class="fn">'+esc(fl.f)+'</span><span class="fdesc">'+esc(fl.d)+'</span><span class="fc">'+flagCtl(fl,g)+'</span></div>';
        if(fl.ovr){ fl.ovr.forEach(function(o){
          var cid="flag:"+fl.f+":"+o.proj, orig=o.on?"ON":"OFF";
          h+='<div class="fr fsub"><span class="fn">└ '+esc(o.proj)+'</span><span class="fdesc">该项目单独覆盖（否则继承全局 '+esc(fl.s)+'）</span><span class="fc">'+tgl(cid,orig,fl.f+" @ "+o.proj,false)+'</span></div>';
        }); }
      });
      h+='</div>';
    });
    h+='</div>';
    return h;
  }
  function switchNav(nav){
    document.querySelectorAll(".nv").forEach(function(n){ n.classList.toggle("sel", n.getAttribute("data-nav")===nav); });
    document.querySelectorAll(".page").forEach(function(pg){ pg.classList.toggle("on", pg.getAttribute("data-page")===nav); });
    document.getElementById("apLabel").textContent={instance:"🗂 实例",flags:"🚩 Feature Flags"}[nav]||"";
    if(nav==="flags") document.querySelector('[data-page="flags"]').innerHTML=flagsPage();
  }

  document.addEventListener("click",function(ev){
    var t=ev.target;
    var nav=t.closest?t.closest("[data-nav]"):null; if(nav){ switchNav(nav.getAttribute("data-nav")); return; }
    var li=t.closest?t.closest("[data-proj]"):null; if(li){ sel=li.getAttribute("data-proj"); curTab="m"; renderList(); renderDetail(); return; }
    var tab=t.closest?t.closest("[data-tab]"):null; if(tab){ curTab=tab.getAttribute("data-tab"); renderDetail(); return; }
    // cron 星期多选钮 → toggle → 派生标签 + submit bar
    var db=t.closest?t.closest("[data-cronday]"):null;
    if(db){ var da=db.getAttribute("data-cronday").split(":"); var schcid=da[0]+":"+da[1]+":"+da[2], idx=+da[3];
      var e=cronEdit(schcid,cronBySchcid(schcid)); var pos=e.days.indexOf(idx);
      if(pos>=0){ if(e.days.length>1) e.days.splice(pos,1); } else e.days.push(idx);
      cronRecompute(schcid); renderDetail(); return; }
    // cron ＋加时间
    var at=t.closest?t.closest("[data-cronaddtime]"):null;
    if(at){ var sc=at.getAttribute("data-cronaddtime"); var e2=cronEdit(sc,cronBySchcid(sc)); e2.times.push({hh:"09",mm:"00"}); cronRecompute(sc); renderDetail(); return; }
    // cron × 删时间
    var dt=t.closest?t.closest("[data-crondeltime]"):null;
    if(dt){ var dp=dt.getAttribute("data-crondeltime").split(":"); var sc2=dp[0]+":"+dp[1]+":"+dp[2], ti=+dp[3];
      var e3=cronEdit(sc2,cronBySchcid(sc2)); if(e3.times.length>1) e3.times.splice(ti,1); cronRecompute(sc2); renderDetail(); return; }
    // flag toggle 切换 → dirty → submit bar（含 per-project override toggle）
    var fp=t.closest?t.closest("[data-tgl]"):null;
    if(fp){ var fcid=fp.getAttribute("data-tgl"), forig=fp.getAttribute("data-orig"), flabel=fp.getAttribute("data-flabel")||fcid;
      var isCronEn=fcid.indexOf("cronen:")===0;
      var fcur=boolState(fcid,forig), fnw=(fcur==="ON"?"OFF":"ON");
      if(fnw!==forig) PENDING[fcid]={label:flabel,from:forig,to:fnw,type:isCronEn?"cronen":"flag"}; else delete PENDING[fcid];
      if(isCronEn){ renderDetail(); }
      else { var fpg=document.querySelector('[data-page="flags"]'); if(fpg&&fpg.classList.contains("on")) fpg.innerHTML=flagsPage(); }
      updateBar(); return; }
    // 改B: save bar + modal buttons
    if(t.closest && t.closest(".savebar")){ if(t.classList.contains("submit")) openSubmit(); else if(t.classList.contains("discard")) doDiscard(); return; }
    var mb=t.getAttribute?t.getAttribute("data-m"):null;
    if(mb==="ok"){ doSubmit(); return; }
    if(mb==="cancel"||mb==="close"){ document.getElementById("ovl").classList.remove("on"); return; }
    if(t.id==="ovl"){ document.getElementById("ovl").classList.remove("on"); return; }
  });
  document.addEventListener("change",function(ev){
    var t=ev.target; if(!t||!t.classList) return;
    // cron 时间行的 时/分 下拉改动 → 更新 CRONEDIT → dirty → submit bar
    if(t.classList.contains("cronsel")){
      var ct=t.getAttribute("data-crontime").split(":"); var scid=ct[0]+":"+ct[1]+":"+ct[2], ti=+ct[3];
      var e=cronEdit(scid,cronBySchcid(scid));
      if(t.classList.contains("ch")) e.times[ti].hh=t.value; else e.times[ti].mm=t.value;
      cronRecompute(scid);
      var pk=t.closest(".cronpick2"); if(pk) pk.classList.toggle("dirty",!!PENDING[scid]); return;
    }
    var box=t.closest?t.closest(".casc3"):null; if(!box) return;
    var vsel=box.querySelector(".casc-vendor"),msel=box.querySelector(".casc-model"),esel=box.querySelector(".casc-effort");
    if(t.classList.contains("casc-vendor")){ var vd=vendorByName(vsel.value);
      msel.innerHTML=opts(vd.models,function(x){return x.l;},vd.models[0].l);
      esel.innerHTML=opts(vd.models[0].eff,function(x){return x;},vd.models[0].eff[0]);
    } else if(t.classList.contains("casc-model")){ var vd2=vendorByName(vsel.value),mdl=vd2.models[0];
      for(var i=0;i<vd2.models.length;i++){ if(vd2.models[i].l===msel.value){ mdl=vd2.models[i]; break; } }
      esel.innerHTML=opts(mdl.eff,function(x){return x;},mdl.eff[0]);
    }
    // 改B: dirty tracking vs baseline (data-base*)
    var cid=box.getAttribute("data-cid"), label=box.getAttribute("data-label");
    var base={v:box.getAttribute("data-basev"),m:box.getAttribute("data-basem"),e:box.getAttribute("data-basee")};
    var cur={v:vsel.value,m:msel.value,e:esel.value};
    if(cur.v!==base.v||cur.m!==base.m||cur.e!==base.e){ PENDING[cid]={label:label,from:base,to:cur}; box.classList.add("dirty"); }
    else { delete PENDING[cid]; box.classList.remove("dirty"); }
    updateBar();
  });
  document.getElementById("psearch").addEventListener("input",renderList);
  renderList(); renderDetail();
})();
</script>
