function fmtTok(n){ if(n>=1e9)return (n/1e9).toFixed(2)+"B"; if(n>=1e6)return Math.round(n/1e6)+"M"; if(n>=1e3)return Math.round(n/1e3)+"K"; return String(Math.round(n)); }

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function trendStacked(){
  var W=900,H=182,pad=22,topPad=34,botPad=28;
  var ags=agentsInView(), days=DATA.days, n=days.length;

  var parts=['<text x="'+pad+'" y="11" font-size="9" fill="#86868b">峰值 '+mx.toFixed(2)+'B tokens</text>'];
  days.forEach(function(d,i){
    var x=pad+i*bw, cx=x+bw*0.35, isDay=(i===n-1), y0=H-botPad, acc=0;
    ags.forEach(function(a){
      var v=(DATA.trend[a.id]||[])[i]||0; if(v<=0)return;
      var h=(v/mx)*barAreaH, y=y0-acc-h; acc+=h;
      parts.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" rx="1.5" fill="'+a.color+'" opacity="'+(isDay?"1":"0.82")+'"><title>'+d+' · '+esc(a.label)+': '+v.toFixed(2)+'B</title></rect>');
    });
    parts.push('<text x="'+cx.toFixed(1)+'" y="'+(y0-acc-4).toFixed(1)+'" font-size="7.5" fill="'+(isDay?"#1a365d":"#86868b")+'" font-weight="'+(isDay?"700":"400")+'" text-anchor="middle">'+totals[i].toFixed(2)+'</text>');
    parts.push('<text x="'+cx.toFixed(1)+'" y="'+(H-13)+'" font-size="8" fill="'+(isDay?"#007aff":"#86868b")+'" font-weight="'+(isDay?"600":"400")+'" text-anchor="middle">'+d+'</text>');
  });
  var leg=ags.map(function(a){return '<span><i style="background:'+a.color+'"></i>'+esc(a.label)+'</span>';}).join("");
  return '<div class="tchart"><svg viewBox="0 0 '+W+' '+H+'" width="100%">'+parts.join("")+'</svg></div><div class="legend">'+leg+'</div>';
}
function trendLines(){
  var W=900,H=200,leftPad=54,rightPad=10,topPad=14,botPad=32;
  var days=DATA.days, n=days.length, ags=agentsInView();
  var PROJ=["#007aff","#34c759","#ff9500","#af52de","#ff3b30","#5ac8fa","#8e8e93"];
  var series=DATA.projects.map(function(p){ var tot=0; ags.forEach(function(a){ tot+=(p.byAgent[a.id]||0); }); return {name:p.name, total:tot}; }).filter(function(s){return s.total>0;});
  var mx=Math.max.apply(null,series.map(function(s){return s.total;}).concat([1]));
  var X=function(i){ return leftPad+(n>1?i*((W-leftPad-rightPad)/(n-1)):0); };
  var Y=function(v){ return topPad+(1-v/mx)*(H-topPad-botPad); };
  var parts=[];
  [0,0.25,0.5,0.75,1].forEach(function(f){ var v=mx*f,yy=Y(v);
    parts.push('<line x1="'+leftPad+'" y1="'+yy.toFixed(1)+'" x2="'+(W-rightPad)+'" y2="'+yy.toFixed(1)+'" stroke="#eef0f3" stroke-width="1"/>');
    parts.push('<text x="'+(leftPad-6)+'" y="'+(yy+3).toFixed(1)+'" font-size="8" fill="#86868b" text-anchor="end">'+fmtTok(v)+'</text>'); });
  series.forEach(function(s,j){ var pts=days.map(function(d,i){ var frac=0.62+0.34*(i/(n-1)); return X(i).toFixed(1)+","+Y(s.total*frac).toFixed(1); }).join(" ");
    parts.push('<polyline points="'+pts+'" fill="none" stroke="'+PROJ[j%PROJ.length]+'" stroke-width="2" opacity="0.9"/>'); });
  days.forEach(function(d,i){ if(i%2===0||i===n-1){ parts.push('<text x="'+X(i).toFixed(1)+'" y="'+(H-14)+'" font-size="8" fill="#86868b" text-anchor="middle">'+d+'</text>'); } });
  var leg=series.map(function(s,j){ return '<span><i style="background:'+PROJ[j%PROJ.length]+'"></i>'+esc(s.name)+'<small style="color:#86868b"> '+fmtTok(s.total)+'</small></span>'; }).join("");
  return '<div class="tlabel">维度② 每个项目各自随时间（Y 轴 = token 量级）</div><div class="tchart"><svg viewBox="0 0 '+W+' '+H+'" width="100%">'+parts.join("")+'</svg></div><div class="legend">'+leg+'</div>';
}
function trendCard(){ return '<div class="card"><h2>总用量随时间 <span>维度① 每日按 agent 堆叠 · 维度② 每项目折线</span></h2>'+trendStacked()+trendLines()+'</div>'; }
function splitBar(t){
  var tot=totalTokensOf(t)||1;
  function seg(v,c){ return '<span style="width:'+(v/tot*100)+'%;background:'+c+'"></span>'; }
  return '<div class="split">'+seg(t.input,"#007aff")+seg(t.output,"#34c759")+seg(t.cacheRead,"#d2d2d7")+seg(t.cacheWrite,"#ff9500")+'</div>'
    +'<div class="legend"><span><i style="background:#007aff"></i>input '+fmtTok(t.input)+'</span><span><i style="background:#34c759"></i>output '+fmtTok(t.output)+'</span><span><i style="background:#d2d2d7"></i>cache read '+fmtTok(t.cacheRead)+'</span><span><i style="background:#ff9500"></i>cache write '+fmtTok(t.cacheWrite)+'</span></div>';
}
function summaryCard(){
  var ags=agentsInView();
  var comb={input:0,output:0,cacheRead:0,cacheWrite:0,cost:0};
  ags.forEach(function(a){ var t=DATA.totals[a.id]; comb.input+=t.input;comb.output+=t.output;comb.cacheRead+=t.cacheRead;comb.cacheWrite+=t.cacheWrite;comb.cost+=t.cost; });
  var head='<div class="card"><h2>当日总用量 <span>'+esc(DATA.reportDay)+' · '+esc(DATA.timezone)+' · 每 agent 四色拆</span></h2>'
    +'<div class="big">'+fmtTok(totalTokensOf(comb))+' <small>tokens</small> <span style="color:#86868b;font-size:18px">· '+usd(comb.cost)+' 成本估算</span></div>';
  var rows="";
  ags.forEach(function(a){ var t=DATA.totals[a.id];
    rows+='<div class="arow"><div class="aname"><i style="background:'+a.color+'"></i>'+esc(a.label)+'</div><div style="flex:1">'+splitBar(t)
      +'</div></div><div style="text-align:right;font-family:\'SF Mono\',monospace;font-size:12px;color:#86868b;margin:-6px 0 6px">'+fmtTok(totalTokensOf(t))+' · '+usd(t.cost)+'</div>'; });
  return head+rows+'</div>';
}
function modelCard(){
  var agIds=agentsInView().map(function(a){return a.id;});
  var ms=DATA.models.filter(function(m){return agIds.indexOf(m.agent)>=0;}).slice().sort(function(a,b){return b.tokens-a.tokens;});
  var mx=Math.max.apply(null,ms.map(function(m){return m.tokens;}).concat([1]));
  var tot=ms.reduce(function(s,m){return s+m.tokens;},0)||1;
  var rows=ms.map(function(m){ var ag=agentById(m.agent);
    return '<div class="srow"><span class="sk">'+esc(m.name)+'<span class="achip" style="background:'+(ag?ag.color:"#86868b")+'">'+esc(ag?ag.label:m.agent)+'</span></span>'
      +'<span class="sbar"><span style="width:'+(m.tokens/mx*100).toFixed(0)+'%;background:'+m.color+'"></span></span>'
      +'<span class="sv">'+fmtTok(m.tokens)+' · '+(m.tokens/tot*100).toFixed(0)+'%</span><span class="su">'+usd(m.cost)+'</span></div>'; }).join("");
  return '<div class="card"><h2>按模型 <span>每 model 标 agent</span></h2>'+rows+'</div>';
}
function leadsCard(){
  if(state.agent==="kimi"){
    return '<div class="card"><h2>Leads 排名（全 fleet）<span>—</span></h2><div class="empty">Kimi 无 Lead 概念 —— 用量见 ①按模型/按项目 + ②今日完成工作</div></div>';
  }
  var rows=[];
  if(state.agent==="all"||state.agent==="claude"){ rows=DATA.leads.slice(); }
  if(state.agent==="all"||state.agent==="codex"){ rows=rows.concat([DATA.codexReviewRow]); }
  rows.sort(function(a,b){return b.tokens-a.tokens;});
  var mx=Math.max.apply(null,rows.map(function(r){return r.tokens;}).concat([1]));
  var tot=rows.reduce(function(s,l){return s+l.tokens;},0), totc=rows.reduce(function(s,l){return s+l.cost;},0);
  var body=rows.map(function(l){ return '<div class="srow"><span class="sk" title="'+esc(l.name)+'">'+esc(l.name)+'</span><span class="sbar"><span style="width:'+(l.tokens/mx*100).toFixed(0)+'%;background:#34c759"></span></span><span class="sv">'+fmtTok(l.tokens)+'</span><span class="su">'+usd(l.cost)+'</span></div>'; }).join("");
  return '<div class="card"><h2>Leads 排名（全 fleet）<span>各 Lead 已计入其项目总量 · '+fmtTok(tot)+' · '+usd(totc)+'</span></h2>'+body
    +'<div class="muted">Lead↔项目 一对多。Codex/Kimi 等 non-Claude agent 无 Lead 概念（Codex 以『design/code review·全 fleet』单行计入）。</div></div>';
}
// 通用横条行(Leads / issues 共用):label + 条 + token +(可选)成本。cost 省略时不渲染成本列。
function bars(rows,color){
  if(!rows.length)return '<div class="empty">—</div>';
  var mx=Math.max.apply(null,rows.map(function(r){return r.tokens;}).concat([1]));
  return rows.map(function(r){
    var lbl=r.href?'<a href="'+esc(r.href)+'" target="_blank" rel="noopener">'+esc(r.label)+'</a>':esc(r.label);
    return '<div class="srow"><span class="sk" title="'+esc(r.label)+'">'+lbl+'</span><span class="sbar"><span style="width:'+(r.tokens/mx*100).toFixed(0)+'%;background:'+color+'"></span></span><span class="sv">'+fmtTok(r.tokens)+'</span><span class="su">'+(r.cost===undefined?"":usd(r.cost))+'</span></div>';
  }).join("");
}

// ① 账层的【按项目展开】—— 对齐真实 FLY-614:项目总量 → 其下 Leads(本项目) + 当天已完成 issues 的用量。
// 【跟随二级 agent 页签】:切某 agent 看它在这些 Lead/issue 上的量,切「全部」看合计。
// 这里只有【数字/条】,不带工作描述 —— 描述归「今日完成工作」。两边不重复:①=账,②=叙述。
function projectAccountSection(){
  var ags=agentsInView();
  var cards=DATA.projects.map(function(p){
    var tot=0; ags.forEach(function(a){ tot+=(p.byAgent[a.id]||0); });
    if(tot<=0)return "";
    var bar=ags.map(function(a){ var v=p.byAgent[a.id]||0; if(v<=0)return ""; return '<span class="pseg" style="width:'+(v/tot*100)+'%;background:'+a.color+'" title="'+esc(a.label)+' '+fmtTok(v)+'"></span>'; }).join("");
    var head='<div class="phead"><span class="pn">'+esc(p.name)+'</span><span class="pbarw">'+bar+'</span><span class="pt">'+fmtTok(tot)+'<small> · 含 Leads</small></span></div>';
    // Leads(本项目):Lead 是 Claude Code 侧的概念;看非-Claude agent 时如实说明
    var leadCol;
    if(state.agent==="all"||state.agent==="claude"){
      leadCol=bars((p.leads||[]).map(function(l){return {label:l.name,tokens:l.tokens,cost:l.cost};}),"#34c759");
    }else{
      leadCol='<div class="empty">— '+esc((agentById(state.agent)||{}).label||state.agent)+' 无 Lead 概念</div>';
    }
    // 当天已完成 issues:每单用了多少(跟随 agent 页签),纯数字无描述
    var iss=(p.issues||[]).map(function(it){
      var v=0; ags.forEach(function(a){ v+=(it.byAgent[a.id]||0); });
      return {label:it.id, tokens:v, href:issueUrl(it.id)};
    }).filter(function(x){return x.tokens>0;}).sort(function(a,b){return b.tokens-a.tokens;});
    var inner='<div class="pinner"><div class="pcol"><div class="ph2">Leads（本项目）</div>'+leadCol+'</div>'
      +'<div class="pcol"><div class="ph2">已完成 Issues（当天用量）</div>'+bars(iss,"#007aff")+'</div></div>';
    var foot=(p.inprog&&p.inprog.count&&(state.agent==="all"||state.agent==="claude"))
      ?'<div class="muted">+ '+p.inprog.count+' 个进行中 issue 用了 '+fmtTok(p.inprog.tokens)+'（完成后才计入）</div>':'';
    return '<div class="card pcard">'+head+inner+foot+'</div>';
  }).join("");
  var hdr='<h2 style="font-size:13px;color:#86868b;text-transform:uppercase;letter-spacing:.04em;margin:22px 4px 0">按项目展开（项目总量 → 其下 Leads + 当天已完成 issues 的用量）</h2>';
  var note='<div class="card"><div class="honest"><b>每 issue 用量口径</b>：这里是<b>账</b>（项目 → issue → 数字），工作描述在「今日完成工作」页签，两边不重复。当前<b>只有 Claude Code 的 per-issue 用量是真实采集的</b>；Codex / Kimi 的 per-issue 用量、以及<b>按 agent 切到单个 issue</b>，都要等后端并入 + 加 agent 维度（FLY-714），此处按<b>设计目标 / 示意</b>呈现，不代表已有真数据。</div></div>';
  return hdr+'<div class="two">'+cards+'</div>'+note;
}

// ========== 层 ② 今日完成工作(按 issue,每个只一次) ==========
function completedWorkSection(){
  var blocks="";
  DATA.projects.forEach(function(p){
    // ② 是 issue 视角:每个 issue 只列一次,不按 agent 过滤(按 agent 的账在「Token 使用」页签)
    var issues=(p.issues||[]);
    if(!issues.length)return;
    var rows=issues.map(function(it){
      // ② 是【叙述】层:做了什么 + 谁做 + 墙钟 + 该单总 token。按 agent 拆的账在 ①(不在这重复)。
      // 【三段式按段 token 仍然不做】—— 后端确实没有(plan R8 审计)。
      var who=DATA.agents.filter(function(a){return (it.byAgent[a.id]||0)>0;});
      var itot=0; DATA.agents.forEach(function(a){ itot+=(it.byAgent[a.id]||0); });
      var chips=who.map(function(a){ return '<i class="agi" style="background:'+a.color+'" title="'+esc(a.label)+'"></i>'; }).join("");
      var names=who.map(function(a){ return esc(a.label); }).join(" · ");
      var href=issueUrl(it.id); var lbl=href?'<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(it.id)+'</a>':esc(it.id);
      return '<div class="wrow"><div class="wtop"><span class="wid">'+lbl+'</span><span class="wchips">'+chips+'</span><span class="wwho">'+names+'</span><span class="wt">'+fmtTok(itot)+'</span><span class="wwall">'+esc(it.wall||"")+'</span></div><div class="did">'+esc(it.desc||"")+'</div></div>';
    }).join("");
    blocks+='<div class="card wcard"><div class="wproj">'+esc(p.name)+'<span class="wcount">'+issues.length+' 单完成</span></div>'+rows+'</div>';
  });
  var note='<div class="card"><div class="honest"><b>每单 token 口径</b>：这单用掉的总量。当前<b>只有 Claude Code 的 per-issue 用量是真实采集的</b>；Codex / Kimi 的 per-issue 用量后端<b>尚未并入</b>（FLY-714），此处按<b>设计目标 / 示意</b>呈现，不代表已有真数据。按 agent 的完整 token 账见「Token 使用」页签。</div></div>';
  return (blocks || '<div class="card"><div class="empty">今日无完成单</div></div>')+note;
}

// ---------- render ----------
function render(){
  var html;
  if(state.tab==="work"){
    html=l1TabBar()
      +tierHeader("✓","今日完成工作","按 issue · 每个只列一次（不管几个 agent 干的）· 这单用了多少 token + 谁做的 + 墙钟 + 描述 + 可点跳 Linear")
      +completedWorkSection();
  }else{
    html=l1TabBar()
      +tierHeader("Σ","Token 使用","按 agent 记账 · 下面二级页签按 agent 分（从数据自动生成，加 agent 前端零改）· 同一 issue 两个 agent 都用、各自计入这层=对的（是账，不是重复）")
      +agentTabBar()
      +heroCard()+trendCard()+summaryCard()+modelCard()+leadsCard()+projectAccountSection();
  }
  document.getElementById("app").innerHTML=html;
}

// ---------- interactions:第一层 tab + 第二层 agent tab(事件委托,存活 re-render)----------
document.getElementById("app").addEventListener("click",function(e){
  var l1=e.target.closest?e.target.closest(".l1tab"):null;
  if(l1){ state.tab=l1.getAttribute("data-tab"); render(); window.scrollTo(0,0); return; }
  var tab=e.target.closest?e.target.closest(".ftab"):null;
  if(tab){ state.agent=tab.getAttribute("data-agent"); render(); return; }
});

// ---------- comment widget (nonce, localStorage, copy-fallback 已修) ----------
(function(){
  var P="fly1354-2t-";
  var ta=document.getElementById("cta-overall"), nm=document.getElementById("signoff-name"), toast=document.getElementById("toast");
  var v=localStorage.getItem(P+"overall"); if(v!=null)ta.value=v;
  ta.addEventListener("input",function(){ localStorage.setItem(P+"overall",ta.value); });
  var ch=localStorage.getItem(P+"ch");
  var radios=document.querySelectorAll('#ch-overall input');
  for(var i=0;i<radios.length;i++){ if(ch&&radios[i].value===ch)radios[i].checked=true;
    radios[i].addEventListener("change",function(e){ localStorage.setItem(P+"ch",e.target.value); }); }
  var nv=localStorage.getItem(P+"nm"); if(nv)nm.value=nv;
  nm.addEventListener("input",function(){ localStorage.setItem(P+"nm",nm.value); });
  function done(){ toast.style.color="#34c759"; toast.textContent="✓ 已复制"; setTimeout(function(){toast.textContent="";},3000); }
  function fail(){ toast.style.color="#ff3b30"; toast.textContent="复制失败,请手动选择"; setTimeout(function(){toast.textContent="";toast.style.color="#34c759";},3000); }
  document.getElementById("copybtn").addEventListener("click",function(){
    var o=["FLY-1354 多-agent 报告反馈"];
    var name=(nm.value||"").trim(); if(name)o.push("签名: "+name);
    var sel=localStorage.getItem(P+"ch"); if(sel)o.push("选择: "+sel);
    var tx=(ta.value||"").trim(); if(tx)o.push(tx);
    if(o.length<2)o.push("(尚无留言)");
    var text=o.join("\n");
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,fb); } else fb();
    function fb(){
      var e=document.createElement("textarea"); e.value=text; e.style.position="fixed"; e.style.opacity="0";
      document.body.appendChild(e); e.select(); var okc=false;
      try{ okc=document.execCommand("copy"); }catch(x){}
      document.body.removeChild(e); if(okc)done(); else fail();
    }
  });
})();

document.getElementById("hdate").innerHTML="📅 2026年7月16日 周四<small>"+esc(DATA.reportDay)+" · 昨日完整一天 · "+esc(DATA.timezone)+"</small>";
document.getElementById("foot").textContent="多-agent 每日报告 mock · 两个页签:【今日完成工作】按 issue 每个只列一次(这单 token + 谁做 + 墙钟 + 描述 + 跳链) · 【Token 使用】按 agent 记账,二级页签按 agent 切(从数据 distinct 自动生成,加 agent 前端零改) · 底=真实 FLY-614 报告结构 · 数据=示意;per-issue 只有 Claude Code 是真采集,Codex/Kimi 待 FLY-714 并入 · 【不做三段式按段 token】后端确无此粒度(plan R8 审计) · USD=公开单价×用量参考估算(订阅制非账单) · 口径细节见 plan.md";

render();
})();
