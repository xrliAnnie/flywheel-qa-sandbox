# Flywheel self-hosting — Blueprint/Runner-side config (FLY-270).
# Consumed by packages/config/src/ConfigLoader.ts (validate) +
# packages/teamlead/src/bridge/run-infra.ts (checkpoints/agents/skills only).
#
# This onboards the flywheel repo ITSELF as a Flywheel project as a two-layer Flywheel team
# (CoS Aunt Cass triages/routes + Eng Lead Tadashi spawns Runners) that drives FLY issues → Runner → auto PR. Merge never starts a restart.
# Deployment has two sources in update-flywheel.sh: the local 00:00/12:00 shuttle
# and a founder-authorized scripts/request-restart.sh emergency ticket. This file does not configure either source.

project: flywheel

linear:
  # Flywheel issues are in the FLY team. NOTE: ConfigLoader requires this field
  # truthy but it is NOT read at runtime (run-infra only reads checkpoints/agents/
  # skills); scoping is enforced by projectName + the Lead's FLY-127 match.label
  # (set in ~/.flywheel/projects.json, Annie cutover). See FLY-189 §1.4.
  team_id: FLY

runners:
  default: claude
  available:
    claude:
      type: claude
      model: fable         # Legacy compatibility field; active default is roles.runner.model below

# FLY-728 / Annie: project-DEFAULT Runner model — the REAL knob the
# RoleAdapterResolver reads (run-infra.ts `rolesConfig = flywheelConfig?.roles`
# → resolveRoleAdapter `projectRoles`). Resolve order: issue label > dispatch
# `model` param (difficulty sorter) > THIS project default > account default.
# The resolver gates `model` behind `backend`, so `backend` is REQUIRED here.
# NOTE: `runners.available.claude.model` above is legacy and is NOT read by
# the resolver — this `roles:` block is.
#
# FLY-1496 / Annie: this is a PROJECT-WIDE FALLBACK for every runner dispatch
# that has no vendor/model label AND no dispatch `model` param. Unclassified
# work follows the founder's Fable/Codex preference; the explicit DAG workflow
# QA row remains the only Opus 5 default.
roles:
  runner:
    backend: claude-tmux
    # Use a canonical CLI-native id. The final resolver also canonicalizes and
    # checks this value against the live ban policy before launch.
    # Persist the family alias; RoleAdapterResolver canonicalizes once before spawn.
    model: fable

teams:
  - name: default
    orchestrators:
      - type: dag
        runner: claude
        budget_per_issue: 10

decision_layer:
  # Proposal-mode start (Annie-locked): Lead proposes, founder decides. merge /
  # ship / runner-lifecycle stay founder-gated (FLY-175 founder-only-authority).
  autonomy_level: advisor
  escalation_channel: discord

# Checkpoints: brainstorm (scope confirm) + question (generic Lead↔Annie gate) +
# approve_to_ship (founder gate before merge — Tadashi's gate question must
# state the self-ship Tier / restart blast radius, see identity.md).
checkpoints:
  brainstorm:
    timeout_ms: 86400000        # 24h
    timeout_behavior: fail-close
  question:
    timeout_ms: 86400000
    timeout_behavior: fail-open
  founder_review:
    timeout_ms: 172800000      # 48h, non-terminal multi-round product review
    timeout_behavior: fail-close
  approve_to_ship:
    timeout_ms: 86400000
    timeout_behavior: fail-close

# doc_flow (FLY-205 department-first process docs): Runners receive a DOC-FLOW
# system-prompt block to write exploration/research/plan under
# `<department>/doc/<ISSUE-KEY>-<slug>/`. department-first folder; flywheel's
# engineering agents resolve to `engineering`. Controls DOCUMENT OUTPUT ONLY —
# every checkpoint/agent-role gate still applies at all doc tiers; QA runners
# produce no docs and are skipped.
doc_flow:
  default_department: engineering

# Nodes are selected by issue label while their file, display label, and explicit
# department ownership come from `.flywheel/agents/registry.yaml`. AgentDispatcher
# step-2a routes a node only when the spawning Lead's department appears in the
# registry entry's `department` / `departments` set; unlisted departments are never
# inferred from file paths or relaxed. `general` intentionally has no department
# and remains the top-level catch-all.
#
# FLY-604 / FLY-1059 / FLY-1089: one executor per role, zero label overlap
# (REPLACE, not augment). Three creative work-types are now three distinct roles
# (Annie's lock: one creative work-type = one agent.md = one Runner session):
#   - engineer         REPLACES the former code-executor (+ merges frontend); owns
#                      all old `code` change-type labels + technical domains +
#                      research/plan (Flywheel's research/plan are mostly technical).
#   - product-designer REPLACES the former docs-executor; owns doc/docs + design +
#                      ux — docs / UX-spec / design-production for a DEFINED issue.
#                      FLY-1089 moved PM (`product`/`pm`) OUT to the new `pm` role.
#   - pm               FLY-1089: NEW Product Manager / product co-creation role
#                      (understand intent → research + explainer HTML → founder
#                      co-eval → converge PRD → split build issues). owns pm/product.
#                      Was "Mode A" inside product-designer (FLY-880); split out.
#   - prototype        FLY-1089: NEW feasibility-first Prototype role (decide what to
#                      validate → cheapest real prototype → founder experience →
#                      doable/not-doable). owns prototype. Distinct from `designer`:
#                      prototype = "can it be done?" (throwaway, function-real);
#                      designer = "what should it look like?" (visual high-fidelity).
#   - designer         FLY-1059: NEW visual mockup-first role (concept images A/B/C
#                      → founder design gate → high-fidelity, BEFORE implement).
#                      owns designer/mockup.
#   - qa               is new (independent verification).
#   - general          is kept (top-level cross-dept catch-all).
# Hard rule: every label the old code/docs executors routed still routes somewhere
# (migrated, none dropped): old code -> engineer; old docs doc/docs/design ->
# product-designer; research/plan -> engineer. FLY-1059 moved `designer` (+ added
# `mockup`); FLY-1089 moved `product`/`pm` (product-designer -> pm) + added
# `prototype`. Final split: pm owns pm/product; prototype owns prototype;
# product-designer owns doc/docs/design/ux; designer owns designer/mockup.
agents:
  engineer:
    node: engineer
    # change-type labels (migrated from the former code-executor) + technical
    # domains + research/plan (technical research + implementation plans).
    match:
      labels: ["code", "feat", "fix", "refactor", "test", "infra", "tooling", "bug", "backend", "frontend", "api", "server", "ui", "web", "be", "fe", "eng", "research", "plan"]
  qa:
    node: qa
    # bare "test" stays with `engineer` (TDD unit-test work, migrated from code);
    # qa owns qa/testing to avoid a same-dept first-match collision.
    match:
      labels: ["qa", "testing"]
  product-designer:
    node: product_designer
    # FLY-901 dual-register ownership now comes from registry.yaml; config only
    # references the stable node identity.
    # doc/docs + design (UX design) + ux — docs / UX-spec / design-production for a
    # DEFINED issue. research/plan route to `engineer`.
    # FLY-1059 moved `designer` OUT (visual mockup) ; FLY-1089 moved `product`/`pm`
    # OUT to the new `pm` role (product co-creation is a distinct work-type).
    match:
      labels: ["doc", "docs", "design", "ux"]
  pm:
    # FLY-1089: the Product Manager / product co-creation role. Understand intent →
    # research + an explainer page → founder co-eval → converge a PRD → split build
    # issues. One agent.md, one session (founder gate = in-session pause). Was
    # "Mode A" inside product-designer (FLY-880); split out per Annie's one-role-
    # per-agent.md lock. Dispatch with `no-three-stage` (or from the product channel)
    # so the co-creation loop is not chopped by DAG workflow stops.
    node: pm
    # FLY-901 dual-register ownership comes from registry.yaml.
    # DISJOINT from product-designer / designer / prototype / engineer / qa.
    match:
      labels: ["pm", "product"]
  prototype:
    # FLY-1089: the feasibility-first Prototype role. Decide what to validate → build
    # the CHEAPEST real prototype → run it for the founder to experience →
    # doable (hand to engineer to productionize) / not-doable (drop). Throwaway,
    # function-real, NOT production-grade. Distinct from `designer` (visual look).
    # One agent.md, one session; dispatch with `no-three-stage` (or product channel).
    node: proto
    # FLY-901 dual-register ownership comes from registry.yaml.
    # DISJOINT from product-designer / designer / pm / engineer / qa. Single label
    # only — `poc` deliberately NOT an alias (去黑话 / no-jargon, Annie).
    match:
      labels: ["prototype"]
  designer:
    # FLY-1059: the visual mockup-first Designer role. Dispatched by label to do
    # concept-image direction exploration (codex-image ∥ gemini-image) → founder
    # design gate → high-fidelity mockup, BEFORE implement. The DAG workflow Design
    # PHASE mockup-first behavior lives in Blueprint (isUiDesignFlavored) and is a
    # SEPARATE mechanism from this whole-issue label route.
    node: product_design
    # FLY-901 ownership comes from registry.yaml.
    # DISJOINT from product-designer / engineer / qa. (SINGLE-label routing is
    # order-independent; a MULTI-label issue still first-matches by YAML order —
    # precondition: one executor-family label per issue. FLY-1089.)
    match:
      labels: ["designer", "mockup"]
  # Top-level entry (no department). An empty labels array NEVER wins label
  # matching (FLY-1335 — empty is not a wildcard). This entry is reached two
  # ways: (1) the Lead passes agentName:"general" explicitly, or (2) via the
  # `default_agent` declaration below — any issue whose labels match no
  # executor above falls through to it (AgentDispatcher Step 3a).
  general:
    node: general
    match:
      labels: []

# FLY-1335: the real catch-all wiring. Label dispatch that matches nothing in
# `agents` falls through to `general` (instead of the shipped
# registered general node). ConfigLoader validates the name exists.
default_agent: general
