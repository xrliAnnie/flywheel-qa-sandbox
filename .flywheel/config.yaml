# Flywheel self-hosting — Blueprint/Runner-side config (FLY-270).
# Consumed by packages/config/src/ConfigLoader.ts (validate) +
# packages/teamlead/src/bridge/run-infra.ts (checkpoints/agents/skills only).
#
# This onboards the flywheel repo ITSELF as a Flywheel project as a two-layer Flywheel team
# (CoS Aunt Cass triages/routes + Eng Lead Tadashi spawns Runners) that drives FLY issues → Runner → auto PR. The self-hosting ship/restart
# safety boundary lives in scripts/self-ship-restart.sh + update-flywheel.sh
# (Method B durable queue), NOT here. See doc/engineer/plan/new/v1.47.0-FLY-270-self-onboard.md.

project: flywheel

linear:
  # Flywheel issues are in the FLY team. NOTE: ConfigLoader requires this field
  # truthy but it is NOT read at runtime (run-infra only reads checkpoints/agents/
  # skills); scoping is enforced by projectName + the Lead's FLY-127 match.label
  # (set in ~/.flywheel/projects.json, Annie cutover). See FLY-189 §1.4.
  team_id: FLY

runners:
  default: claude
  available:
    claude:
      type: claude
      model: sonnet        # Runner model; Lead model is set per-fleet (FLY-241/247)

# FLY-728 / Annie: project-DEFAULT Runner model — the REAL knob the
# RoleAdapterResolver reads (run-infra.ts `rolesConfig = flywheelConfig?.roles`
# → resolveRoleAdapter `projectRoles`). Resolve order: issue label > dispatch
# `model` param (difficulty sorter) > THIS project default > account default.
# The resolver gates `model` behind `backend`, so `backend` is REQUIRED here.
# NOTE: `runners.available.claude.model` above is legacy and is NOT read by
# the resolver — this `roles:` block is.
#
# FLY-788 / Annie: this is a PROJECT-WIDE FALLBACK for every runner spawn that
# has no vendor/model label AND no dispatch `model` param — includes but is
# NOT limited to the FLY-579 auto-QA pipeline (which creates a fresh
# `QA·FLY-XX` issue and dispatches it without a label or dispatchModel, so it
# lands exactly here). This used to default to Fable 5 (FLY-728); Annie found
# that meant any such automatic spawn silently burned tokens on Fable
# ("5 个 QA 全 Fable、30 分钟就烧完"). Defaulted to Opus 4.8 (1M) instead —
# still the strongest fleet-standard tier, but the model an unlabelled/
# un-sorted spawn should get by default, not a project opt-in choice.
roles:
  runner:
    backend: claude-tmux
    model: claude-opus-4-8[1m]

teams:
  - name: default
    orchestrators:
      - type: dag
        runner: claude
        budget_per_issue: 10

decision_layer:
  # Proposal-mode start (Annie-locked): Lead proposes, founder decides. merge /
  # ship / runner-lifecycle stay founder-gated (FLY-175 founder-only-authority).
  autonomy_level: advisor
  escalation_channel: discord

# Checkpoints: brainstorm (scope confirm) + question (generic Lead↔Annie gate) +
# approve_to_ship (founder gate before merge — Tadashi's gate question must
# state the self-ship Tier / restart blast radius, see identity.md).
checkpoints:
  brainstorm:
    enabled: true
    timeout_ms: 86400000        # 24h
    timeout_behavior: fail-close
  question:
    enabled: true
    timeout_ms: 86400000
    timeout_behavior: fail-open
  approve_to_ship:
    enabled: true
    timeout_ms: 86400000
    timeout_behavior: fail-close

# FLY-707 (enablement, FLY-698 epic): flywheel default-enables built workflow
# features instead of leaving them dormant behind a per-project opt-in.
#
# qa (FLY-579 auto-QA pipeline): after code review passes, the Bridge spawns an
# INDEPENDENT QA Runner on a separate QA·FLY-XX issue pinned to the reviewed
# commit and HOLDS the founder until QA is green. Read from this CANONICAL root
# only (auto-qa-config-source.ts → ConfigLoader → cfg.qa); a runner can't edit
# its own PR's config to skip its own QA. The global env FLYWHEEL_AUTO_QA=0 is a
# hard kill-switch on top of this. The qa-executor agent is wired in agents.qa.
qa:
  auto: true
  # Issue labels that skip auto-QA even when auto is true — docs/chore PRs have
  # nothing to functionally verify. A per-issue Linear `no-qa` label also skips.
  skip_labels: [docs, chore]

# doc_flow (FLY-205 department-first process docs): Runners receive a DOC-FLOW
# system-prompt block to write exploration/research/plan under
# `<department>/doc/<ISSUE-KEY>-<slug>/`. department-first folder; flywheel's
# engineering agents resolve to `engineering`. Controls DOCUMENT OUTPUT ONLY —
# every checkpoint/agent-role gate still applies at all doc tiers; QA runners
# produce no docs and are skipped.
doc_flow:
  enabled: true
  default_department: engineering

# founder_milestone_report (FLY-725): when a Runner reaches a ZERO-SIGNAL terminal
# milestone (failed / blocked) the Bridge pushes ONE @founder-pinged report to the
# issue's [FLY-XX] chat thread — a mechanism-guaranteed, ground-truth "push" so the
# founder is never forced to pull. Content is generated from the real session event
# (route / PR / last_error), NOT the possibly-lagging thread title. v1 = failed +
# blocked only: routine `completed` → FLY-727 daily digest; `ship_ready` is already
# an @founder ping via the FLY-605 approve_to_ship gate (not duplicated here).
# Absent/enabled:false = off (byte-compatible); FLYWHEEL_FOUNDER_MILESTONE_NOTIFY=0
# is a fleet kill-switch. Loaded from this CANONICAL root only, so a runner can't
# edit its own PR config to change founder notifications.
founder_milestone_report:
  enabled: true
  milestones: [failed, blocked]

# Executors: role-based so Tadashi (one engineering Lead) covers multiple roles
# by issue label — the GeoForge3D "Peter covers many roles" pattern, narrowed by
# Annie to 3 roles. All agents live under .flywheel/agents/engineering/ —
# department is inferred from that path and MUST equal the spawning Lead's
# department ("engineering", Tadashi) for AgentDispatcher step-2a (dept label
# match) to route. A folder named anything else (e.g. product/) would NOT route.
#
# FLY-604: one executor per role, zero label overlap (REPLACE, not augment):
#   - engineer         REPLACES the former code-executor (+ merges frontend); owns
#                      all old `code` change-type labels + technical domains +
#                      research/plan (Flywheel's research/plan are mostly technical).
#   - product-designer REPLACES the former docs-executor (+ adds product/UX/PM);
#                      owns doc/docs + design (UX design) + product/pm/ux/designer.
#   - qa               is new (independent verification).
#   - general          is kept (top-level cross-dept catch-all).
# Hard rule: every label the old code/docs executors routed still routes here
# (migrated, none dropped): old code -> engineer; old docs doc/docs/design ->
# product-designer, research/plan -> engineer.
agents:
  engineer:
    agent_file: .flywheel/agents/engineering/engineer-executor.md
    department: engineering
    # change-type labels (migrated from the former code-executor) + technical
    # domains + research/plan (technical research + implementation plans).
    match:
      labels: ["code", "feat", "fix", "refactor", "test", "infra", "tooling", "bug", "backend", "frontend", "api", "server", "ui", "web", "be", "fe", "eng", "research", "plan"]
  qa:
    agent_file: .flywheel/agents/engineering/qa-executor.md
    department: engineering
    # bare "test" stays with `engineer` (TDD unit-test work, migrated from code);
    # qa owns qa/testing to avoid a same-dept first-match collision.
    match:
      labels: ["qa", "testing"]
  product-designer:
    agent_file: .flywheel/agents/engineering/product-designer-executor.md
    department: engineering
    # doc/docs + design (UX design, migrated from the former docs-executor) +
    # product/UX/PM. research/plan are NOT here — they route to `engineer`.
    match:
      labels: ["doc", "docs", "design", "product", "pm", "ux", "designer"]
  # Top-level catch-all (no department). Used when the Lead passes agentName:"general"
  # or no executor label matches.
  general:
    agent_file: .flywheel/agents/general-executor.md
    match:
      labels: []

# FLY-793 / Annie 2026-07-04: enable the three-stage pipeline (Design→Implement→QA)
# for the flywheel project ONLY — "我们现在开始用三段式真正干活，这个只需要开在 flywheel".
# Per-project opt-in knob (ConfigLoader validates boolean; default absent=off).
# E2E-verified: FLY-824 FINAL PASS + FLY-849 combined-batch PASS (5 rounds, PR #440).
#
# FLY-887 R2: three_stage_channels narrows three-stage ENTRY to fresh main
# dispatches from Leads whose chatChannel is listed (#flywheel-engineer only —
# cos/product/codex-infra/anna dispatches run single-session). Channel ids MUST
# be quoted strings (a bare YAML number silently loses snowflake precision;
# ConfigLoader rejects it). Absent key = no restriction. To E2E three-stage in
# the 529 Room, add the slot channel here or delete the key.
pipeline:
  three_stage: true
  three_stage_channels: ["1516209714097291335"] # #flywheel-engineer
