# Generated by scripts/test-deploy.sh (FLY-115 v1.24.3) — sandbox test config.
# DO NOT commit to xrliAnnie/flywheel-qa-sandbox; teardown wipes HOST_REPO.
project: test-slot-4

linear:
  team_id: FLY

runners:
  default: claude
  available:
    claude:
      type: claude
      model: sonnet

roles:
  runner:
    backend: claude-tmux
    model: claude-opus-4-8[1m]

teams:
  - name: default
    orchestrators:
      - type: dag
        runner: claude

decision_layer:
  autonomy_level: advisor
  escalation_channel: discord

# These canonical feature switches are read directly by contract tests and by
# the sandbox Bridge. Keeping them here preserves the repository's checked-in
# behavior without replacing the test-slot identity or checkpoint settings.
qa:
  auto: true
  skip_labels: [docs, chore]

doc_flow:
  enabled: true
  default_department: engineering

founder_milestone_report:
  enabled: true
  milestones: [failed, blocked]

# Keep sandbox routing aligned with the checked-in executor prompts. The two
# dispatcher contract suites load this real config rather than a synthetic
# fixture, so these label sets must remain pairwise disjoint.
agents:
  engineer:
    agent_file: .flywheel/agents/engineering/engineer-executor.md
    department: engineering
    match:
      labels: ["code", "feat", "fix", "refactor", "test", "infra", "tooling", "bug", "backend", "frontend", "api", "server", "ui", "web", "be", "fe", "eng", "research", "plan"]
  qa:
    agent_file: .flywheel/agents/engineering/qa-executor.md
    department: engineering
    match:
      labels: ["qa", "testing"]
  product-designer:
    agent_file: .flywheel/agents/engineering/product-designer-executor.md
    department: engineering
    departments: [engineering, product]
    match:
      labels: ["doc", "docs", "design", "ux"]
  pm:
    agent_file: .flywheel/agents/engineering/pm-executor.md
    department: engineering
    departments: [engineering, product]
    match:
      labels: ["pm", "product"]
  prototype:
    agent_file: .flywheel/agents/engineering/prototype-executor.md
    department: engineering
    departments: [engineering, product]
    match:
      labels: ["prototype"]
  designer:
    agent_file: .flywheel/agents/engineering/designer-executor.md
    department: engineering
    departments: [engineering, product]
    match:
      labels: ["designer", "mockup"]
  general:
    agent_file: .flywheel/agents/general-executor.md
    match:
      labels: []

checkpoints:
  approve_to_ship:
    enabled: true
    timeout_ms: 14400000     # 4h (FLY-159: ConfigLoader floor; anything lower is warn+raised)
    timeout_behavior: fail-close
